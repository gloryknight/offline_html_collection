<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura | Mindful Breathwork Guide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            overflow: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .breath-circle {
            transition: transform 2s ease-in-out, opacity 2s ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.3; transform: scale(1); }
            50% { opacity: 0.6; transform: scale(1.1); }
        }

        .glow-effect {
            animation: pulse-glow 4s infinite ease-in-out;
        }

        .phase-text {
            transition: all 0.5s ease;
        }

        /* Custom scrollbar for the info section */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }

        /* Hide UI when breathing is active to focus */
        .focus-mode .ui-element { opacity: 0; pointer-events: none; transform: translateY(10px); }
        .focus-mode .ui-element { transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="text-slate-200 min-h-screen flex items-center justify-center p-4">

    <!-- Background Ambient Glow -->
    <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div id="bg-glow" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[500px] h-[500px] bg-teal-500/10 rounded-full blur-[120px] glow-effect"></div>
    </div>

    <main class="relative z-10 w-full max-w-4xl grid grid-cols-1 lg:grid-cols-12 gap-8 items-center">
        
        <!-- Left Side: Visualizer -->
        <div class="lg:col-span-7 flex flex-col items-center justify-center space-y-12">
            <div class="relative flex items-center justify-center w-64 h-64 md:w-80 md:h-80">
                <!-- Outer Glow -->
                <div id="visualizer-glow" class="absolute inset-0 rounded-full bg-teal-500/20 blur-3xl scale-75 transition-all duration-[2000ms]"></div>
                
                <!-- Main Breathing Circle -->
                <div id="breath-circle" class="breath-circle w-48 h-48 md:w-64 md:h-64 rounded-full border border-white/20 flex items-center justify-center bg-gradient-to-br from-white/5 to-transparent shadow-2xl">
                    <div class="text-center">
                        <p id="phase-label" class="phase-text text-xl md:text-2xl font-light tracking-widest uppercase opacity-0">Ready</p>
                        <p id="timer-display" class="text-4xl md:text-5xl font-light mt-2 opacity-0 transition-opacity duration-500">0</p>
                    </div>
                </div>
            </div>

            <!-- Controls -->
            <div class="ui-element flex items-center space-x-6 transition-all duration-700">
                <button id="start-btn" class="px-8 py-3 rounded-full bg-teal-500/20 hover:bg-teal-500/40 border border-teal-500/50 text-teal-100 transition-all duration-300 font-medium">
                    Start Session
                </button>
                <button id="reset-btn" class="px-8 py-3 rounded-full glass hover:bg-white/10 text-slate-300 transition-all duration-300 font-medium">
                    Reset
                </button>
            </div>
        </div>

        <!-- Right Side: Settings & Info -->
        <div class="lg:col-span-5 space-y-6">
            <header class="ui-element transition-all duration-700">
                <h1 class="text-4xl font-light tracking-tight text-white mb-2">Aura</h1>
                <p class="text-slate-400 leading-relaxed">Find your center through rhythmic breathing. Choose a technique and let the guide lead you.</p>
            </header>

            <div class="ui-element space-y-6 transition-all duration-700 delay-100">
                <!-- Pattern Selector -->
                <section class="glass rounded-2xl p-6">
                    <label class="block text-xs font-semibold uppercase tracking-widest text-teal-500/80 mb-4">Breathing Technique</label>
                    <div class="grid grid-cols-1 gap-3" id="pattern-selector">
                        <!-- Patterns injected by JS -->
                    </div>
                </section>

                <!-- Info Cards -->
                <section class="glass rounded-2xl p-6 max-h-[200px] overflow-y-auto transition-all duration-700 delay-200">
                    <label class="block text-xs font-semibold uppercase tracking-widest text-teal-500/80 mb-3">Technique Info</label>
                    <div id="info-content" class="text-sm text-slate-400 leading-relaxed italic">
                        Select a pattern to see details.
                    </div>
                </section>
            </div>

            <!-- Footer -->
            <footer class="ui-element pt-4 opacity-30 text-[10px] uppercase tracking-[0.2em] transition-all duration-700 delay-300">
                Designed for Mindfulness &bull; Open Source
            </footer>
        </div>
    </main>

    <script>
        const patterns = [
            { 
                id: 'box', 
                name: 'Box Breathing', 
                desc: 'Used by Navy SEALs to manage stress and improve focus.',
                phases: [
                    { label: 'Inhale', duration: 4, scale: 1.5, color: '#2dd4bf' }, // teal-400
                    { label: 'Hold', duration: 4, scale: 1.5, color: '#2dd4bf' },
                    { label: 'Exhale', duration: 4, scale: 1.0, color: '#94a3b8' }, // slate-400
                    { label: 'Hold', duration: 4, scale: 1.0, color: '#94a3b8' }
                ]
            },
            { 
                id: '478', 
                name: '4-7-8 Relax', 
                desc: 'A natural tranquilizer for the nervous system.',
                phases: [
                    { label: 'Inhale', duration: 4, scale: 1.5, color: '#2dd4bf' },
                    { label: 'Hold', duration: 7, scale: 1.5, color: '#2dd4bf' },
                    { label: 'Exhale', duration: 8, scale: 1.0, color: '#94a3b8' }
                ]
            },
            { 
                id: 'equal', 
                name: 'Equal Breathing', 
                desc: 'Balances the nervous system by evening out breath length.',
                phases: [
                    { label: 'Inhale', duration: 5, scale: 1.4, color: '#2dd4bf' },
                    { label: 'Exhale', duration: 5, scale: 1.0, color: '#94a3b8' }
                ]
            }
        ];

        let currentPattern = patterns[0];
        let isRunning = false;
        let timerInterval = null;

        // DOM Elements
        const startBtn = document.getElementById('start-btn');
        const resetBtn = document.getElementById('reset-btn');
        const patternSelector = document.getElementById('pattern-selector');
        const infoContent = document.getElementById('info-content');
        const breathCircle = document.getElementById('breath-circle');
        const visualizerGlow = document.getElementById('visualizer-glow');
        const phaseLabel = document.getElementById('phase-label');
        const timerDisplay = document.getElementById('timer-display');
        const body = document.body;

        // Initialize Pattern Selector
        function initPatterns() {
            patternSelector.innerHTML = '';
            patterns.forEach(p => {
                const btn = document.createElement('button');
                btn.className = `w-full text-left px-4 py-3 rounded-xl transition-all duration-300 border ${currentPattern.id === p.id ? 'bg-teal-500/20 border-teal-500/50 text-white' : 'glass border-transparent text-slate-400 hover:bg-white/5'}`;
                btn.innerHTML = `<div class="font-medium">${p.name}</div>`;
                btn.onclick = () => selectPattern(p);
                patternSelector.appendChild(btn);
            });
        }

        function selectPattern(p) {
            if (isRunning) return;
            currentPattern = p;
            infoContent.textContent = p.desc;
            initPatterns();
        }

        async function startBreathing() {
            if (isRunning) return;
            isRunning = true;
            startBtn.textContent = 'Stop Session';
            startBtn.classList.replace('bg-teal-500/20', 'bg-red-500/20');
            startBtn.classList.replace('border-teal-500/50', 'border-red-500/50');
            startBtn.classList.replace('text-teal-100', 'text-red-100');
            
            body.classList.add('focus-mode');
            phaseLabel.style.opacity = '1';
            timerDisplay.style.opacity = '1';

            let phaseIndex = 0;

            while (isRunning && phaseIndex < currentPattern.phases.length) {
                const phase = currentPattern.phases[phaseIndex % currentPattern.phases.length];
                
                // Set Phase Visuals
                phaseLabel.textContent = phase.label;
                breathCircle.style.transform = `scale(${phase.scale})`;
                visualizerGlow.style.backgroundColor = phase.color;
                visualizerGlow.style.opacity = '0.4';

                // Countdown logic
                let timeLeft = phase.duration;
                timerDisplay.textContent = timeLeft;

                const countdown = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        timerDisplay.textContent = timeLeft;
                    } else {
                        clearInterval(countdown);
                    }
                }, 1000);

                // Wait for phase duration
                await new Promise(resolve => setTimeout(resolve, phase.duration * 1000));
                
                phaseIndex++;
            }
        }

        function stopBreathing() {
            isRunning = false;
            clearInterval(timerInterval);
            startBtn.textContent = 'Start Session';
            startBtn.classList.replace('bg-red-500/20', 'bg-teal-500/20');
            startBtn.classList.replace('border-red-500/50', 'border-teal-500/50');
            startBtn.classList.replace('text-red-100', 'text-teal-100');
            
            body.classList.remove('focus-mode');
            phaseLabel.style.opacity = '0';
            timerDisplay.style.opacity = '0';
            breathCircle.style.transform = 'scale(1)';
            visualizerGlow.style.opacity = '0.3';
        }

        function reset() {
            stopBreathing();
            phaseLabel.textContent = 'Ready';
            timerDisplay.textContent = '0';
        }

        // Event Listeners
        startBtn.addEventListener('click', () => {
            if (isRunning) stopBreathing();
            else startBreathing();
        });

        resetBtn.addEventListener('click', reset);

        // Init app
        infoContent.textContent = currentPattern.desc;
        initPatterns();

    </script>
</body>
</html>
