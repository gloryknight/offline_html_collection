<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big O Visualizer | Algorithm Complexity Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .chart-container { position: relative; height: 400px; width: 100%; }
        input[type="range"] { accent-color: #6366f1; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-cyan-400">
                    Complexity Visualizer
                </h1>
                <p class="text-slate-400 mt-1">Visualize Big O notation growth and algorithmic efficiency.</p>
            </div>
            <div class="flex items-center gap-3 text-sm text-slate-400 bg-slate-800/50 px-4 py-2 rounded-full border border-slate-700">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
                </span>
                Live Simulation Engine Active
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Sidebar Controls -->
            <aside class="lg:col-span-4 space-y-6">
                <section class="glass p-6 rounded-2xl shadow-xl">
                    <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                        </svg>
                        Parameters
                    </h2>
                    
                    <div class="space-y-6">
                        <!-- Input Size Slider -->
                        <div>
                            <div class="flex justify-between mb-2">
                                <label class="text-sm font-medium text-slate-300">Input Size (n): <span id="val-n" class="text-indigo-400 font-bold">50</span></label>
                            </div>
                            <input type="range" id="input-n" min="1" max="100" value="50" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                        </div>

                        <!-- Scale Toggle -->
                        <div>
                            <label class="text-sm font-medium text-slate-300 block mb-2">Y-Axis Scaling</label>
                            <div class="flex p-1 bg-slate-900 rounded-lg border border-slate-700">
                                <button id="btn-linear" onclick="setScale('linear')" class="flex-1 py-1 text-xs font-medium rounded-md transition-all duration-200 bg-indigo-600 text-white">Linear</button>
                                <button id="btn-log" onclick="setScale('logarithmic')" class="flex-1 py-1 text-xs font-medium rounded-md transition-all duration-200 text-slate-400 hover:text-white">Logarithmic</button>
                            </div>
                        </div>

                        <!-- Complexity Selection -->
                        <div>
                            <label class="text-sm font-medium text-slate-300 block mb-3">Select Algorithms</label>
                            <div id="algorithm-list" class="space-y-2 max-h-64 overflow-y-auto custom-scrollbar pr-2">
                                <!-- Dynamically populated -->
                            </div>
                        </div>

                        <button onclick="runSimulation()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl transition-all transform active:scale-95 shadow-lg shadow-indigo-500/20">
                            Run Simulation
                        </button>
                    </div>
                </section>

                <!-- Complexity Guide -->
                <section class="glass p-6 rounded-2xl text-sm">
                    <h3 class="font-semibold mb-3 text-slate-200 uppercase tracking-wider text-xs">Quick Reference</h3>
                    <div id="info-box" class="text-slate-400 leading-relaxed italic">
                        Select an algorithm to see its mathematical definition.
                    </div>
                </section>
            </aside>

            <!-- Main Chart Area -->
            <main class="lg:col-span-8 space-y-6">
                <div class="glass p-6 rounded-2xl shadow-xl min-h-[500px] flex flex-col">
                    <div class="flex items-center justify-between mb-6">
                        <h3 class="text-xl font-semibold">Growth Visualization</h3>
                        <div id="legend" class="hidden md:flex gap-4 text-xs"></div>
                    </div>
                    <div class="chart-container flex-grow">
                        <canvas id="complexityChart"></canvas>
                    </div>
                </div>

                <!-- Stats Grid -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4" id="stats-container">
                    <!-- Dynamic stats cards will appear here -->
                </div>
            </main>
        </div>
    </div>

    <script>
        const algorithms = [
            { id: 'o1', label: 'O(1) - Constant', color: '#94a3b8', formula: (n) => 1, desc: 'Time remains the same regardless of input size.' },
            { id: 'ologn', label: 'O(log n) - Logarithmic', color: '#2dd4bf', formula: (n) => Math.log2(n), desc: 'Increases slowly; characteristic of binary search.' },
            { id: 'on', label: 'O(n) - Linear', color: '#6366f1', formula: (n) => n, desc: 'Growth is directly proportional to input size.' },
            { id: 'onlogn', label: 'O(n log n) - Linearithmic', color: '#8b5cf6', formula: (n) => n * Math.log2(n), desc: 'Common in efficient sorting algorithms like Merge Sort.' },
            { id: 'on2', label: 'O(n²) - Quadratic', color: '#f43f5e', formula: (n) => Math.pow(n, 2), desc: 'Growth accelerates rapidly; common in nested loops.' },
            { id: 'o2n', label: 'O(2ⁿ) - Exponential', color: '#fb923c', formula: (n) => Math.pow(2, n), desc: 'Extremely inefficient growth; typical of recursive brute force.' }
        ];

        let chart;
        let currentScale = 'linear';
        let activeAlgos = ['o1', 'ologn', 'on', 'onlogn', 'on2'];

        // Initialize UI
        function init() {
            const list = document.getElementById('algorithm-list');
            algorithms.forEach(algo => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-3 rounded-xl border cursor-pointer transition-all ${activeAlgos.includes(algo.id) ? 'bg-slate-700/50 border-indigo-500' : 'border-slate-700 hover:border-slate-500'}`;
                div.innerHTML = `
                    <div class="flex items-center gap-3">
                        <input type="checkbox" ${activeAlgos.includes(algo.id) ? 'checked' : ''} 
                               class="w-4 h-4 rounded border-slate-600 text-indigo-600 focus:ring-indigo-500 bg-slate-800" 
                               onclick="toggleAlgo('${algo.id}', event)">
                        <span class="text-sm font-medium" style="color: ${algo.color}">${algo.label}</span>
                    </div>
                `;
                div.onclick = (e) => { if(e.target.type !== 'checkbox') toggleAlgo(algo.id, e); };
                list.appendChild(div);
            });

            setupEventListeners();
            runSimulation();
        }

        function setupEventListeners() {
            const nInput = document.getElementById('input-n');
            const nValDisplay = document.getElementById('val-n');
            
            nInput.addEventListener('input', (e) => {
                nValDisplay.textContent = e.target.value;
                runSimulation();
            });
        }

        function toggleAlgo(id, event) {
            if (event && event.target.type === 'checkbox') return; 
            
            const index = activeAlgos.indexOf(id);
            if (index > -1) {
                activeAlgos.splice(index, 1);
            } else {
                activeAlgos.push(id);
            }
            
            // Refresh UI
            document.getElementById('algorithm-list').innerHTML = '';
            init(); // Re-render list (simplified for this demo)
            runSimulation();
        }

        function setScale(scale) {
            currentScale = scale;
            document.getElementById('btn-linear').className = `flex-1 py-1 text-xs font-medium rounded-md transition-all duration-200 ${scale === 'linear' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`;
            document.getElementById('btn-log').className = `flex-1 py-1 text-xs font-medium rounded-md transition-all duration-200 ${scale === 'logarithmic' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`;
            runSimulation();
        }

        function runSimulation() {
            const nMax = parseInt(document.getElementById('input-n').value);
            const labels = [];
            const datasets = [];
            const statsContainer = document.getElementById('stats-container');
            statsContainer.innerHTML = '';

            // Generate Data Points
            for (let i = 1; i <= nMax; i++) {
                labels.push(i);
            }

            algorithms.forEach(algo => {
                if (activeAlgos.includes(algo.id)) {
                    const data = labels.map(n => algo.formula(n));
                    datasets.push({
                        label: algo.label,
                        data: data,
                        borderColor: algo.color,
                        backgroundColor: algo.color + '22',
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: true
                    });

                    // Create Stats Card for the final point (n)
                    const card = document.createElement('div');
                    card.className = 'glass p-4 rounded-xl border-l-4 transition-all hover:translate-y-[-2px]';
                    card.style.borderLeftColor = algo.color;
                    card.innerHTML = `
                        <p class="text-xs text-slate-400 uppercase font-semibold">${algo.label}</p>
                        <p class="text-xl font-bold mt-1" style="color: ${algo.color}">${Math.round(algo.formula(nMax)).toLocaleString()}</p>
                        <p class="text-[10px] text-slate-500">Operations at n=${nMax}</p>
                    `;
                    statsContainer.appendChild(card);
                }
            });

            renderChart(labels, datasets);
        }

        function renderChart(labels, datasets) {
            const ctx = document.getElementById('complexityChart').getContext('2d');
            
            if (chart) chart.destroy();

            chart = new Chart(ctx, {
                type: 'line',
                data: { labels, datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    scales: {
                        x: {
                            grid: { color: '#334155', drawBorder: false },
                            ticks: { color: '#94a3b8' }
                        },
                        y: {
                            type: currentScale,
                            grid: { color: '#334155', drawBorder: false },
                            ticks: { 
                                color: '#94a3b8',
                                callback: (value) => currentScale === 'logarithmic' ? `10^${Math.log10(value).toFixed(1)}` : value 
                            }
                        }
                    },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            backgroundColor: '#1e293b',
                            titleColor: '#f8fafc',
                            bodyColor: '#cbd5e1',
                            borderColor: '#475569',
                            borderWidth: 1,
                            padding: 12,
                            displayColors: true,
                            callbacks: {
                                label: (context) => ` ${context.dataset.label}: ${Math.round(context.parsed.y).toLocaleString()} ops`
                            }
                        }
                    },
                    animation: { duration: 800, easing: 'easeOutQuart' }
                }
            });
        }

        // Initial Run
        window.onload = init;
    </script>
</body>
</html>
