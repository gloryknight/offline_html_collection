<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Pro | Advanced Beautifier & Validator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'Fira Code', monospace !important; font-size: 14px !important; }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1f2937; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #6b7280; }
        .glass { background: rgba(17, 24, 39, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .glow { box-shadow: 0 0 20px rgba(99, 102, 241, 0.2); }
        @keyframes slideIn { from { transform: translateY(10px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .animate-slide { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-[#0f172a]/80 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-1.5 rounded-lg">
                    <i data-lucide="braces" class="w-6 h-6 text-white"></i>
                </div>
                <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400 tracking-tight">
                    JSON<span class="text-indigo-500">Pro</span>
                </h1>
            </div>
            <div class="flex items-center gap-4">
                <button onclick="loadSample()" class="text-sm text-slate-400 hover:text-white transition-colors flex items-center gap-1">
                    <i data-lucide="file-text" class="w-4 h-4"></i> Sample
                </button>
                <div id="statusBadge" class="hidden px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1.5 transition-all duration-300">
                    <!-- Status injected by JS -->
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full p-4 sm:p-6 lg:p-8 grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Input Section -->
        <div class="flex flex-col gap-3 group">
            <div class="flex items-center justify-between px-1">
                <label class="text-sm font-medium text-slate-400 flex items-center gap-2">
                    <i data-lucide="terminal" class="w-4 h-4"></i> Raw Input
                </label>
                <button onclick="clearInput()" class="text-xs text-slate-500 hover:text-red-400 transition-colors flex items-center gap-1">
                    <i data-lucide="trash-2" class="w-3 h-3"></i> Clear
                </button>
            </div>
            <div class="relative flex-grow min-h-[400px] lg:min-h-[600px]">
                <textarea 
                    id="jsonInput" 
                    spellcheck="false"
                    class="w-full h-full bg-[#1e293b] text-indigo-100 p-4 rounded-xl border border-slate-700 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none resize-none custom-scrollbar transition-all placeholder:text-slate-600"
                    placeholder='Paste your messy JSON here...'
                ></textarea>
            </div>
        </div>

        <!-- Output Section -->
        <div class="flex flex-col gap-3">
            <div class="flex items-center justify-between px-1">
                <label class="text-sm font-medium text-slate-400 flex items-center gap-2">
                    <i data-lucide="sparkles" class="w-4 h-4"></i> Formatted Output
                </label>
                <div class="flex gap-2">
                    <button onclick="copyOutput()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1 rounded-md transition-all flex items-center gap-1.5 border border-slate-700">
                        <i data-lucide="copy" class="w-3 h-3"></i> Copy
                    </button>
                </div>
            </div>
            <div class="relative flex-grow min-h-[400px] lg:min-h-[600px] bg-[#1e293b] rounded-xl border border-slate-700 overflow-hidden group">
                <pre id="jsonOutputContainer" class="w-full h-full m-0 p-4 overflow-auto custom-scrollbar"><code id="jsonOutput" class="language-json"></code></pre>
                <!-- Empty State Overlay -->
                <div id="emptyState" class="absolute inset-0 flex flex-col items-center justify-center text-slate-500 pointer-events-none">
                    <i data-lucide="layout" class="w-12 h-12 mb-3 opacity-20"></i>
                    <p class="text-sm">Results will appear here</p>
                </div>
            </div>
        </div>

        <!-- Action Bar -->
        <div class="lg:col-span-2 flex flex-wrap items-center justify-center gap-4 py-6 border-t border-slate-800/50">
            <button onclick="processJSON('beautify')" class="flex items-center gap-2 px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold transition-all glow active:scale-95 shadow-lg shadow-indigo-500/20">
                <i data-lucide="align-left" class="w-5 h-5"></i> Beautify
            </button>
            <button onclick="processJSON('minify')" class="flex items-center gap-2 px-6 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-semibold transition-all active:scale-95 border border-slate-700">
                <i data-lucide="minimize-2" class="w-5 h-5"></i> Minify
            </button>
            <button onclick="processJSON('validate')" class="flex items-center gap-2 px-6 py-3 bg-emerald-600/10 hover:bg-emerald-600/20 text-emerald-400 border border-emerald-500/30 rounded-xl font-semibold transition-all active:scale-95">
                <i data-lucide="check-circle" class="w-5 h-5"></i> Validate Only
            </button>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full bg-slate-800 text-white text-sm font-medium shadow-2xl border border-slate-700 opacity-0 pointer-events-none transition-all duration-300 z-[100]">
        Copied to clipboard!
    </div>

    <footer class="py-8 text-center text-slate-500 text-xs">
        Built with <span class="text-red-500">♥</span> for developers • Open Source
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const jsonInput = document.getElementById('jsonInput');
        const jsonOutput = document.getElementById('jsonOutput');
        const emptyState = document.getElementById('emptyState');
        const statusBadge = document.getElementById('statusBadge');
        const toast = document.getElementById('toast');

        function showToast(message) {
            toast.textContent = message;
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', '-translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                toast.classList.remove('opacity-100', '-translate-y-0');
            }, 2500);
        }

        function setStatus(type, message) {
            statusBadge.classList.remove('hidden', 'bg-emerald-500/10', 'text-emerald-400', 'bg-red-500/10', 'text-red-400');
            statusBadge.classList.add('flex', 'animate-slide');
            
            if (type === 'success') {
                statusBadge.classList.add('bg-emerald-500/10', 'text-emerald-400');
                statusBadge.innerHTML = `<i data-lucide="check" class="w-3 h-3"></i> ${message}`;
            } else if (type === 'error') {
                statusBadge.classList.add('bg-red-500/10', 'text-red-400');
                statusBadge.innerHTML = `<i data-lucide="alert-circle" class="w-3 h-3"></i> ${message}`;
            } else {
                statusBadge.classList.add('hidden');
            }
            lucide.createIcons();
        }

        function clearInput() {
            jsonInput.value = '';
            jsonOutput.textContent = '';
            emptyState.style.display = 'flex';
            setStatus('none');
        }

        function loadSample() {
            const sample = {
                project: "JSON Pro",
                version: 1.0,
                features: ["Beautify", "Minify", "Validate"],
                active: true,
                author: {
                    name: "Developer",
                    tools: ["Tailwind CSS", "Vanilla JS"]
                }
            };
            jsonInput.value = JSON.stringify(sample);
            processJSON('beautify');
        }

        function copyOutput() {
            const text = jsonOutput.textContent;
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                showToast("Copied to clipboard!");
            });
        }

        function processJSON(mode) {
            const rawValue = jsonInput.value.trim();
            
            if (!rawValue) {
                setStatus('error', 'Input is empty');
                return;
            }

            try {
                const parsed = JSON.parse(rawValue);
                let result = '';

                if (mode === 'beautify') {
                    result = JSON.stringify(parsed, null, 4);
                } else if (mode === 'minify') {
                    result = JSON.stringify(parsed);
                } else if (mode === 'validate') {
                    result = JSON.stringify(parsed, null, 4); // Just show it pretty for validation success
                }

                // Update UI
                jsonOutput.textContent = result;
                emptyState.style.display = 'none';
                Prism.highlightElement(jsonOutput);
                setStatus('success', 'Valid JSON');
                
            } catch (e) {
                const errorMsg = e.message.split('at position')[0]; // Clean up error message
                setStatus('error', errorMsg);
                jsonOutput.textContent = '';
                emptyState.style.display = 'flex';
            }
        }

        // Allow Tab key in textarea
        jsonInput.addEventListener('keydown', function(e) {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = this.selectionStart;
                const end = this.selectionEnd;
                this.value = this.value.substring(0, start) + "    " + this.value.substring(end);
                this.selectionStart = this.selectionEnd = start + 4;
            }
        });
    </script>
</body>
</html>
