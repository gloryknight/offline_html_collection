<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neumorphic Calculator | Premium UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #e0e5ec;
            --shadow-light: #ffffff;
            --shadow-dark: #a3b1c6;
            --accent: #6d5dfc;
        }

        body {
            background-color: var(--bg-color);
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .neumorphic-card {
            background: var(--bg-color);
            border-radius: 40px;
            box-shadow: 20px 20px 60px var(--shadow-dark),
                        -20px -20px 60px var(--shadow-light);
        }

        .neu-inset {
            background: var(--bg-color);
            box-shadow: inset 6px 6px 12px var(--shadow-dark),
                        inset -6px -6px 12px var(--shadow-light);
        }

        .neu-button {
            background: var(--bg-color);
            border-radius: 20px;
            box-shadow: 6px 6px 12px var(--shadow-dark),
                        -6px -6px 12px var(--shadow-light);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            color: #4a5568;
        }

        .neu-button:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark),
                        inset -4px -4px 8px var(--shadow-light);
            transform: scale(0.98);
        }

        .neu-button-accent {
            background: var(--accent);
            color: white;
            box-shadow: 6px 6px 12px #b8b9be,
                        -6px -6px 12px #ffffff;
        }

        .neu-button-accent:active {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2);
        }

        .display-text {
            color: #4a5568;
            word-wrap: break-word;
            word-break: break-all;
        }

        /* Custom Scrollbar for history if needed */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: var(--shadow-dark);
            border-radius: 10px;
        }
    </style>
</head>
<body class="p-4">

    <div class="neumorphic-card w-full max-w-sm p-8">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 px-2">
            <span class="text-xs font-semibold tracking-widest text-gray-400 uppercase">Neumorphic UI</span>
            <div class="flex space-x-1">
                <div class="w-3 h-3 rounded-full bg-red-300 opacity-50"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-300 opacity-50"></div>
                <div class="w-3 h-3 rounded-full bg-green-300 opacity-50"></div>
            </div>
        </div>

        <!-- Display Screen -->
        <div class="neu-inset rounded-3xl p-6 mb-8 min-h-[120px] flex flex-col justify-end items-end overflow-hidden">
            <div id="previous-operand" class="text-sm text-gray-400 h-6 transition-all duration-200"></div>
            <div id="current-operand" class="display-text text-4xl font-light tracking-tight">0</div>
        </div>

        <!-- Buttons Grid -->
        <div class="grid grid-cols-4 gap-5">
            <!-- Row 1 -->
            <button onclick="clearDisplay()" class="neu-button h-14 w-full text-red-400">AC</button>
            <button onclick="deleteLast()" class="neu-button h-14 w-full">DEL</button>
            <button onclick="appendOperator('%')" class="neu-button h-14 w-full">%</button>
            <button onclick="appendOperator('/')" class="neu-button h-14 w-full text-indigo-500">/</button>

            <!-- Row 2 -->
            <button onclick="appendNumber('7')" class="neu-button h-14 w-full">7</button>
            <button onclick="appendNumber('8')" class="neu-button h-14 w-full">8</button>
            <button onclick="appendNumber('9')" class="neu-button h-14 w-full">9</button>
            <button onclick="appendOperator('*')" class="neu-button h-14 w-full text-indigo-500">×</button>

            <!-- Row 3 -->
            <button onclick="appendNumber('4')" class="neu-button h-14 w-full">4</button>
            <button onclick="appendNumber('5')" class="neu-button h-14 w-full">5</button>
            <button onclick="appendNumber('6')" class="neu-button h-14 w-full">6</button>
            <button onclick="appendOperator('-')" class="neu-button h-14 w-full text-indigo-500">−</button>

            <!-- Row 4 -->
            <button onclick="appendNumber('1')" class="neu-button h-14 w-full">1</button>
            <button onclick="appendNumber('2')" class="neu-button h-14 w-full">2</button>
            <button onclick="appendNumber('3')" class="neu-button h-14 w-full">3</button>
            <button onclick="appendOperator('+')" class="neu-button h-14 w-full text-indigo-500">+</button>

            <!-- Row 5 -->
            <button onclick="appendNumber('0')" class="neu-button h-14 col-span-2">0</button>
            <button onclick="appendNumber('.')" class="neu-button h-14 w-full">.</button>
            <button onclick="calculate()" class="neu-button-accent h-14 w-full">=</button>
        </div>

        <!-- Footer -->
        <div class="mt-8 text-center">
            <p class="text-[10px] text-gray-400 uppercase tracking-[0.2em]">Precision Engineering</p>
        </div>
    </div>

    <script>
        let currentOperand = '0';
        let previousOperand = '';
        let operation = null;
        let shouldResetScreen = false;

        const currentDisplay = document.getElementById('current-operand');
        const previousDisplay = document.getElementById('previous-operand');

        function updateDisplay() {
            currentDisplay.innerText = formatNumber(currentOperand);
            if (operation != null) {
                previousDisplay.innerText = `${formatNumber(previousOperand)} ${operation}`;
            } else {
                previousDisplay.innerText = '';
            }
        }

        function formatNumber(number) {
            if (number === 'Error') return 'Error';
            const stringNumber = number.toString();
            const integerDigits = parseFloat(stringNumber.split('.')[0]);
            const decimalDigits = stringNumber.split('.')[1];
            let integerDisplay;
            
            if (isNaN(integerDigits)) {
                integerDisplay = '';
            } else {
                integerDisplay = integerDigits.toLocaleString('en', { maximumFractionDigits: 0 });
            }

            if (decimalDigits != null) {
                return `${integerDisplay}.${decimalDigits}`;
            } else {
                return integerDisplay;
            }
        }

        function appendNumber(number) {
            if (currentOperand === '0' || shouldResetScreen) {
                currentOperand = number;
                shouldResetScreen = false;
            } else {
                if (number === '.' && currentOperand.includes('.')) return;
                currentOperand += number;
            }
            updateDisplay();
        }

        function appendOperator(op) {
            if (operation !== null) calculate();
            previousOperand = currentOperand;
            operation = op;
            shouldResetScreen = true;
            updateDisplay();
        }

        function clearDisplay() {
            currentOperand = '0';
            previousOperand = '';
            operation = null;
            updateDisplay();
        }

        function deleteLast() {
            if (currentOperand.length === 1) {
                currentOperand = '0';
            } else {
                currentOperand = currentOperand.slice(0, -1);
            }
            updateDisplay();
        }

        function calculate() {
            let computation;
            const prev = parseFloat(previousOperand);
            const current = parseFloat(currentOperand);

            if (isNaN(prev) || isNaN(current)) return;

            switch (operation) {
                case '+':
                    computation = prev + current;
                    break;
                case '-':
                    computation = prev - current;
                    break;
                case '*':
                    computation = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        computation = 'Error';
                    } else {
                        computation = prev / current;
                    }
                    break;
                case '%':
                    computation = prev % current;
                    break;
                default:
                    return;
            }

            currentOperand = computation.toString();
            operation = null;
            previousOperand = '';
            shouldResetScreen = true;
            updateDisplay();
        }

        // Keyboard Support
        document.addEventListener('keydown', (e) => {
            if (e.key >= 0 && e.key <= 9) appendNumber(e.key);
            if (e.key === '.') appendNumber('.');
            if (e.key === '=' || e.key === 'Enter') calculate();
            if (e.key === 'Backspace') deleteLast();
            if (e.key === 'Escape') clearDisplay();
            if (['+', '-', '*', '/', '%'].includes(e.key)) appendOperator(e.key);
        });

        // Initialize
        updateDisplay();
    </script>
</body>
</html>
