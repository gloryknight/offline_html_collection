<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FocusFlow // Minimalist Daily Timer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #f4f4f5;
            overflow: hidden;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .progress-ring__circle {
            transition: stroke-dashoffset 0.3s linear;
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .timer-active {
            animation: pulse-soft 2s infinite ease-in-out;
        }

        input[type="text"]::-webkit-placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .btn-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <!-- Background Ambient Light -->
    <div class="fixed top-[-10%] left-[-10%] w-[40%] h-[40%] rounded-full bg-indigo-900/20 blur-[120px] pointer-events-none"></div>
    <div class="fixed bottom-[-10%] right-[-10%] w-[40%] h-[40%] rounded-full bg-blue-900/20 blur-[120px] pointer-events-none"></div>

    <main class="w-full max-w-md z-10">
        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-sm font-medium tracking-[0.3em] uppercase text-zinc-500 mb-2">FocusFlow</h1>
            <p id="current-task-display" class="text-lg font-light text-zinc-300 italic">Ready to focus?</p>
        </div>

        <!-- Timer Card -->
        <div class="glass rounded-[2.5rem] p-8 shadow-2xl relative overflow-hidden">
            
            <!-- Progress Ring Container -->
            <div class="relative flex items-center justify-center mb-10">
                <svg class="w-64 h-64 md:w-72 md:h-72">
                    <!-- Background Circle -->
                    <circle
                        class="text-zinc-800"
                        stroke-width="6"
                        stroke="currentColor"
                        fill="transparent"
                        r="130"
                        cx="50%"
                        cy="50%"
                    />
                    <!-- Progress Circle -->
                    <circle
                        id="progress-ring"
                        class="progress-ring__circle text-indigo-500"
                        stroke-width="6"
                        stroke-linecap="round"
                        stroke="currentColor"
                        fill="transparent"
                        r="130"
                        cx="50%"
                        cy="50%"
                    />
                </svg>
                
                <!-- Time Display -->
                <div class="absolute inset-0 flex flex-col items-center justify-center">
                    <span id="timer-display" class="text-6xl md:text-7xl font-light tracking-tighter tabular-nums">25:00</span>
                    <span id="status-label" class="text-xs uppercase tracking-[0.2em] text-zinc-500 mt-2">Focus Session</span>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center justify-center gap-6 mb-10">
                <button id="reset-btn" class="p-3 rounded-full glass text-zinc-400 hover:text-white btn-transition active:scale-90">
                    <i data-lucide="rotate-ccw" class="w-5 h-5"></i>
                </button>

                <button id="start-pause-btn" class="w-16 h-16 rounded-full bg-white text-black flex items-center justify-center btn-transition hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(255,255,255,0.3)]">
                    <i id="play-icon" data-lucide="play" class="w-7 h-7 fill-current"></i>
                </button>

                <button id="skip-btn" class="p-3 rounded-full glass text-zinc-400 hover:text-white btn-transition active:scale-90">
                    <i data-lucide="skip-forward" class="w-5 h-5"></i>
                </button>
            </div>

            <!-- Presets & Task Input -->
            <div class="space-y-6">
                <div class="flex justify-between gap-2">
                    <button onclick="setTimer(25, 'Focus')" class="preset-btn flex-1 py-2 text-xs rounded-full glass border-zinc-800 hover:bg-white/10 transition-all active:scale-95">Pomodoro</button>
                    <button onclick="setTimer(5, 'Short Break')" class="preset-btn flex-1 py-2 text-xs rounded-full glass border-zinc-800 hover:bg-white/10 transition-all active:scale-95">Short Break</button>
                    <button onclick="setTimer(15, 'Long Break')" class="preset-btn flex-1 py-2 text-xs rounded-full glass border-zinc-800 hover:bg-white/10 transition-all active:scale-95">Long Break</button>
                </div>

                <div class="relative group">
                    <input type="text" id="task-input" placeholder="What are you working on?" 
                        class="w-full bg-transparent border-b border-zinc-800 py-2 px-1 focus:outline-none focus:border-indigo-500 transition-colors text-sm text-center">
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <div class="mt-8 text-center">
            <p class="text-[10px] uppercase tracking-[0.4em] text-zinc-600 font-medium">Stay Disciplined • Stay Focused</p>
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // DOM Elements
        const timerDisplay = document.getElementById('timer-display');
        const progressRing = document.getElementById('progress-ring');
        const startPauseBtn = document.getElementById('start-pause-btn');
        const playIcon = document.getElementById('play-icon');
        const resetBtn = document.getElementById('reset-btn');
        const skipBtn = document.getElementById('skip-btn');
        const taskInput = document.getElementById('task-input');
        const taskDisplay = document.getElementById('current-task-display');
        const statusLabel = document.getElementById('status-label');

        // Timer State
        let timeLeft;
        let totalTime;
        let timerId = null;
        let isRunning = false;
        let currentMode = 'Focus';

        // SVG Ring Configuration
        const radius = progressRing.r.baseVal.value;
        const circumference = 2 * Math.PI * radius;
        progressRing.style.strokeDasharray = `${circumference} ${circumference}`;
        progressRing.style.strokeDashoffset = circumference;

        // Initialization
        function init(minutes, mode) {
            clearInterval(timerId);
            isRunning = false;
            currentMode = mode;
            timeLeft = minutes * 60;
            totalTime = timeLeft;
            updateDisplay();
            setProgress(0);
            updatePlayIcon();
            statusLabel.textContent = `${mode} Session`;
            playIcon.parentElement.classList.remove('timer-active');
        }

        function updateDisplay() {
            const minutes = Math.floor(timeLeft / 60);
            const seconds = timeLeft % 60;
            const display = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
            timerDisplay.textContent = display;
            document.title = `${display} - FocusFlow`;
        }

        function setProgress(percent) {
            const offset = circumference - (percent / 100 * circumference);
            progressRing.style.strokeDashoffset = offset;
        }

        function updatePlayIcon() {
            if (isRunning) {
                playIcon.setAttribute('data-lucide', 'pause');
            } else {
                playIcon.setAttribute('data-lucide', 'play');
            }
            lucide.createIcons();
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                isRunning = false;
                playIcon.parentElement.classList.remove('timer-active');
            } else {
                isRunning = true;
                playIcon.parentElement.classList.add('timer-active');
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    
                    const percent = ((totalTime - timeLeft) / totalTime) * 100;
                    setProgress(percent);

                    if (timeLeft <= 0) {
                        clearInterval(timerId);
                        handleTimerComplete();
                    }
                }, 1000);
            }
            updatePlayIcon();
        }

        function handleTimerComplete() {
            isRunning = false;
            updatePlayIcon();
            playIcon.parentElement.classList.remove('timer-active');
            // Simple beep sound using Web Audio API (no external files needed)
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(440, ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1);
            osc.start();
            osc.stop(ctx.currentTime + 1);
            alert(`${currentMode} session completed!`);
        }

        function resetTimer() {
            init(totalTime / 60, currentMode);
        }

        function setTimer(minutes, mode) {
            init(minutes, mode);
        }

        // Event Listeners
        startPauseBtn.addEventListener('click', toggleTimer);
        resetBtn.addEventListener('click', resetTimer);
        skipBtn.addEventListener('click', () => {
            if (currentMode === 'Focus') setTimer(5, 'Short Break');
            else if (currentMode === 'Short Break') setTimer(25, 'Focus');
            else setTimer(25, 'Focus');
        });

        taskInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && taskInput.value.trim() !== '') {
                taskDisplay.textContent = `"${taskInput.value}"`;
                taskInput.blur();
                taskInput.classList.add('opacity-50');
                taskInput.disabled = true;
            }
        });

        // Start the app
        init(25, 'Focus');
    </script>
</body>
</html>
