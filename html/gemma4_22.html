<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowState // Professional Kanban</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .kanban-column { min-height: 70vh; }
        .ghost-card { opacity: 0.4; background: #e2e8f0; border: 2px dashed #94a3b8; }
        .drag-handle { cursor: grab; }
        .drag-handle:active { cursor: grabbing; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .modal-enter { animation: modalEnter 0.3s ease-out forwards; }
        @keyframes modalEnter {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body class="text-slate-800">

    <!-- Navigation -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <i data-lucide="layout" class="text-white w-5 h-5"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">FlowState <span class="text-indigo-600">Kanban</span></h1>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="openModal()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-medium transition-all shadow-sm active:scale-95">
                    <i data-lucide="plus" class="w-4 h-4"></i> New Task
                </button>
                <button onclick="clearAll()" class="text-slate-500 hover:text-red-600 p-2 transition-colors" title="Clear Board">
                    <i data-lucide="trash-2" class="w-5 h-5"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6" id="board">
            
            <!-- To Do Column -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between px-2">
                    <div class="flex items-center gap-2">
                        <h2 class="font-semibold text-slate-700 uppercase tracking-wider text-sm">To Do</h2>
                        <span id="todo-count" class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                    </div>
                </div>
                <div id="todo" class="kanban-column flex flex-col gap-3 p-2 rounded-xl bg-slate-100/50 border border-dashed border-slate-300 transition-colors duration-200">
                    <!-- Tasks go here -->
                </div>
            </div>

            <!-- In Progress Column -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between px-2">
                    <div class="flex items-center gap-2">
                        <h2 class="font-semibold text-slate-700 uppercase tracking-wider text-sm">In Progress</h2>
                        <span id="progress-count" class="bg-indigo-100 text-indigo-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                    </div>
                </div>
                <div id="inprogress" class="kanban-column flex flex-col gap-3 p-2 rounded-xl bg-slate-100/50 border border-dashed border-slate-300 transition-colors duration-200">
                    <!-- Tasks go here -->
                </div>
            </div>

            <!-- Done Column -->
            <div class="flex flex-col gap-4">
                <div class="flex items-center justify-between px-2">
                    <div class="flex items-center gap-2">
                        <h2 class="font-semibold text-slate-700 uppercase tracking-wider text-sm">Done</h2>
                        <span id="done-count" class="bg-emerald-100 text-emerald-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                    </div>
                </div>
                <div id="done" class="kanban-column flex flex-col gap-3 p-2 rounded-xl bg-slate-100/50 border border-dashed border-slate-300 transition-colors duration-200">
                    <!-- Tasks go here -->
                </div>
            </div>

        </div>
    </main>

    <!-- Task Modal -->
    <div id="taskModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl overflow-hidden modal-enter">
            <div class="px-6 py-4 border-b border-slate-100 flex justify-between items-center">
                <h3 id="modalTitle" class="text-lg font-bold text-slate-800">Create New Task</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <form id="taskForm" class="p-6 space-y-4">
                <input type="hidden" id="taskId">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Task Title</label>
                    <input type="text" id="taskTitle" required placeholder="What needs to be done?" 
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                    <textarea id="taskDesc" rows="3" placeholder="Add more details..." 
                        class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all resize-none"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Priority</label>
                    <select id="taskPriority" class="w-full px-4 py-2 border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none appearance-none bg-white">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                </div>
                <div class="pt-4 flex gap-3">
                    <button type="button" onclick="closeModal()" class="flex-1 px-4 py-2 border border-slate-200 text-slate-600 rounded-lg font-medium hover:bg-slate-50 transition-colors">Cancel</button>
                    <button type="submit" class="flex-1 px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition-all shadow-md shadow-indigo-200">Save Task</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // State Management
        let tasks = JSON.parse(localStorage.getItem('flowstate_tasks')) || [];

        const taskForm = document.getElementById('taskForm');
        const modal = document.getElementById('taskModal');
        const columns = ['todo', 'inprogress', 'done'];

        // Initialize Lucide Icons
        function initIcons() {
            lucide.createIcons();
        }

        // Core Functions
        function saveToLocalStorage() {
            localStorage.setItem('flowstate_tasks', JSON.stringify(tasks));
            updateCounts();
        }

        function updateCounts() {
            columns.forEach(col => {
                const count = tasks.filter(t => t.status === col).length;
                document.getElementById(`${col}-count`).textContent = count;
            });
        }

        function renderTasks() {
            // Clear all columns
            columns.forEach(col => document.getElementById(col).innerHTML = '');

            tasks.forEach(task => {
                const taskEl = createTaskElement(task);
                document.getElementById(task.status).appendChild(taskEl);
            });
            
            initIcons();
            updateCounts();
        }

        function createTaskElement(task) {
            const div = document.createElement('div');
            div.className = 'bg-white p-4 rounded-xl shadow-sm border border-slate-200 cursor-default group hover:shadow-md transition-all duration-200 relative';
            div.dataset.id = task.id;

            const priorityColors = {
                low: 'bg-blue-100 text-blue-700',
                medium: 'bg-amber-100 text-amber-700',
                high: 'bg-rose-100 text-rose-700'
            };

            div.innerHTML = `
                <div class="flex items-start justify-between mb-2">
                    <span class="text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${priorityColors[task.priority]}">
                        ${task.priority}
                    </span>
                    <div class="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                        <button onclick="editTask('${task.id}')" class="p-1 hover:bg-slate-100 rounded text-slate-500"><i data-lucide="edit-2" class="w-3.5 h-3.5"></i></button>
                        <button onclick="deleteTask('${task.id}')" class="p-1 hover:bg-red-50 rounded text-red-500"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                    </div>
                </div>
                <div class="drag-handle absolute top-0 left-0 w-full h-1 opacity-0 group-hover:opacity-100 transition-opacity rounded-t-xl bg-indigo-400/20"></div>
                <h4 class="font-semibold text-slate-800 leading-tight mb-1">${task.title}</h4>
                <p class="text-sm text-slate-500 line-clamp-2 font-normal">${task.description || 'No description'}</p>
            `;
            return div;
        }

        // CRUD Operations
        taskForm.onsubmit = (e) => {
            e.preventDefault();
            const id = document.getElementById('taskId').value;
            const title = document.getElementById('taskTitle').value;
            const description = document.getElementById('taskDesc').value;
            const priority = document.getElementById('taskPriority').value;

            if (id) {
                // Update
                const index = tasks.findIndex(t => t.id === id);
                tasks[index] = { ...tasks[index], title, description, priority };
            } else {
                // Create
                const newTask = {
                    id: Date.now().toString(),
                    title,
                    description,
                    priority,
                    status: 'todo'
                };
                tasks.push(newTask);
            }

            saveToLocalStorage();
            renderTasks();
            closeModal();
        };

        function editTask(id) {
            const task = tasks.find(t => t.id === id);
            if (!task) return;

            document.getElementById('modalTitle').textContent = 'Edit Task';
            document.getElementById('taskId').value = task.id;
            document.getElementById('taskTitle').value = task.title;
            document.getElementById('taskDesc').value = task.description;
            document.getElementById('taskPriority').value = task.priority;

            openModal(true);
        }

        function deleteTask(id) {
            if (confirm('Are you sure you want to delete this task?')) {
                tasks = tasks.filter(t => t.id !== id);
                saveToLocalStorage();
                renderTasks();
            }
        }

        function clearAll() {
            if (confirm('This will wipe your entire board. Continue?')) {
                tasks = [];
                saveToLocalStorage();
                renderTasks();
            }
        }

        // UI Helpers
        function openModal(isEdit = false) {
            if (!isEdit) {
                taskForm.reset();
                document.getElementById('taskId').value = '';
                document.getElementById('modalTitle').textContent = 'Create New Task';
            }
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        // Drag & Drop Initialization
        function initDragAndDrop() {
            columns.forEach(colId => {
                const el = document.getElementById(colId);
                new Sortable(el, {
                    group: 'kanban',
                    animation: 200,
                    ghostClass: 'ghost-card',
                    handle: '.drag-handle', // If you want to restrict drag handle specifically
                    onEnd: (evt) => {
                        const taskId = evt.item.dataset.id;
                        const newStatus = evt.to.id;
                        
                        // Update state
                        const taskIndex = tasks.findIndex(t => t.id === taskId);
                        if (taskIndex > -1) {
                            tasks[taskIndex].status = newStatus;
                            saveToLocalStorage();
                            updateCounts();
                        }
                    },
                });
            });
        }

        // Initialize App
        window.onload = () => {
            renderTasks();
            initDragAndDrop();
            initIcons();
        };

        // Close modal on outside click
        window.onclick = (event) => {
            if (event.target == modal) closeModal();
        }
    </script>
</body>
</html>
