<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GridMaster // CSS Grid Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .code-font { font-family: 'Fira Code', monospace; }
        .grid-canvas { 
            background-image: radial-gradient(#334155 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        .grid-item-active { outline: 3px solid #6366f1; outline-offset: 2px; z-index: 10; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="h-screen overflow-hidden flex flex-col">

    <!-- Header -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md px-6 py-4 flex justify-between items-center shrink-0">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <i data-lucide="layout-grid" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">GridMaster <span class="text-indigo-400 text-sm font-medium ml-2">v1.0</span></h1>
                <p class="text-slate-400 text-xs">Visual CSS Grid Architect</p>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button onclick="resetGrid()" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2 text-sm">
                <i data-lucide="rotate-ccw" class="w-4 h-4"></i> Reset
            </button>
            <button onclick="copyCode()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-lg text-sm font-medium transition-all flex items-center gap-2 shadow-lg shadow-indigo-500/20">
                <i data-lucide="copy" class="w-4 h-4"></i> Copy CSS
            </button>
        </div>
    </header>

    <main class="flex-1 flex overflow-hidden">
        <!-- Left Sidebar: Controls -->
        <aside class="w-80 border-r border-slate-800 bg-slate-900 p-6 overflow-y-auto custom-scrollbar shrink-0">
            <section class="mb-8">
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i data-lucide="settings" class="w-3 h-3"></i> Container Settings
                </h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Columns: <span id="col-val" class="text-indigo-400">3</span></label>
                        <input type="range" id="cols-input" min="1" max="12" value="3" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Rows: <span id="row-val" class="text-indigo-400">3</span></label>
                        <input type="range" id="rows-input" min="1" max="12" value="3" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-300 mb-2">Gap (px): <span id="gap-val" class="text-indigo-400">10</span></label>
                        <input type="range" id="gap-input" min="0" max="50" value="10" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                    </div>
                </div>
            </section>

            <section class="mb-8">
                <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-3 h-3"></i> Elements
                </h2>
                <button onclick="addItem()" class="w-full py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 rounded-lg text-sm transition-all flex items-center justify-center gap-2">
                    <i data-lucide="plus" class="w-4 h-4"></i> Add Grid Item
                </button>
                <div id="items-list" class="mt-4 space-y-2">
                    <!-- Items list injected here -->
                </div>
            </section>

            <section id="item-editor" class="hidden animate-fade-in">
                <h2 class="text-xs font-semibold text-indigo-400 uppercase tracking-wider mb-4 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-3 h-3"></i> Item Properties
                </h2>
                <div class="bg-slate-800/50 p-4 rounded-xl border border-indigo-500/30 space-y-4">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2">Column Span</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="edit-col-start" min="1" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-500">
                            <input type="number" id="edit-col-end" min="1" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-2">Row Span</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="number" id="edit-row-start" min="1" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-500">
                            <input type="number" id="edit-row-end" min="1" class="bg-slate-900 border border-slate-700 rounded px-2 py-1 text-sm focus:outline-none focus:border-indigo-500">
                        </div>
                    </div>
                    <button onclick="deleteSelectedItem()" class="w-full py-2 bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 rounded-lg text-xs font-medium transition-all">
                        Delete Item
                    </button>
                </div>
            </section>
        </aside>

        <!-- Center: Playground -->
        <section class="flex-1 relative p-8 grid-canvas overflow-auto flex items-center justify-center">
            <div id="grid-container" class="bg-slate-800/30 border-2 border-dashed border-slate-700 rounded-xl transition-all duration-300 shadow-2xl" style="display: grid; width: 600px; height: 600px;">
                <!-- Grid items injected here -->
            </div>
        </section>

        <!-- Right Sidebar: Code Output -->
        <aside class="w-96 border-l border-slate-800 bg-slate-950 p-6 overflow-y-auto custom-scrollbar shrink-0">
            <h2 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-4 flex items-center gap-2">
                <i data-lucide="code" class="w-3 h-3"></i> CSS Output
            </h2>
            <div class="relative group">
                <pre id="code-display" class="code-font text-sm text-indigo-300 bg-slate-900 p-4 rounded-lg border border-slate-800 whitespace-pre-wrap leading-relaxed"></pre>
            </div>
        </aside>
    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-8 left-1/2 -translate-x-1/2 bg-indigo-600 text-white px-6 py-3 rounded-full shadow-2xl opacity-0 transition-opacity pointer-events-none font-medium">
        Copied to clipboard!
    </div>

    <script>
        // State Management
        let state = {
            cols: 3,
            rows: 3,
            gap: 10,
            items: [
                { id: 1, colStart: 1, colEnd: 3, rowStart: 1, rowEnd: 2, color: '#6366f1' },
                { id: 2, colStart: 1, colEnd: 2, rowStart: 2, rowEnd: 4, color: '#8b5cf6' }
            ],
            selectedItemId: null
        };

        // DOM Elements
        const gridContainer = document.getElementById('grid-container');
        const codeDisplay = document.getElementById('code-display');
        const itemsList = document.getElementById('items-list');
        const itemEditor = document.getElementById('item-editor');

        // Initialization
        function init() {
            lucide.createIcons();
            setupEventListeners();
            render();
        }

        function setupEventListeners() {
            document.getElementById('cols-input').addEventListener('input', (e) => {
                state.cols = parseInt(e.target.value);
                document.getElementById('col-val').innerText = state.cols;
                render();
            });
            document.getElementById('rows-input').addEventListener('input', (e) => {
                state.rows = parseInt(e.target.value);
                document.getElementById('row-val').innerText = state.rows;
                render();
            });
            document.getElementById('gap-input').addEventListener('input', (e) => {
                state.gap = parseInt(e.target.value);
                document.getElementById('gap-val').innerText = state.gap;
                render();
            });

            // Editor Inputs
            ['edit-col-start', 'edit-col-end', 'edit-row-start', 'edit-row-end'].forEach(id => {
                document.getElementById(id).addEventListener('input', updateSelectedItem);
            });
        }

        function addItem() {
            const newId = state.items.length > 0 ? Math.max(...state.items.map(i => i.id)) + 1 : 1;
            state.items.push({
                id: newId,
                colStart: 1,
                colEnd: 2,
                rowStart: 1,
                rowEnd: 2,
                color: `hsl(${Math.random() * 360}, 70%, 60%)`
            });
            state.selectedItemId = newId;
            render();
        }

        function deleteSelectedItem() {
            state.items = state.items.filter(i => i.id !== state.selectedItemId);
            state.selectedItemId = null;
            render();
        }

        function selectItem(id) {
            state.selectedItemId = id;
            render();
        }

        function updateSelectedItem() {
            const item = state.items.find(i => i.id === state.selectedItemId);
            if (item) {
                item.colStart = parseInt(document.getElementById('edit-col-start').value) || 1;
                item.colEnd = parseInt(document.getElementById('edit-col-end').value) || 2;
                item.rowStart = parseInt(document.getElementById('edit-row-start').value) || 1;
                item.rowEnd = parseInt(document.getElementById('edit-row-end').value) || 2;
                render();
            }
        }

        function resetGrid() {
            state = {
                cols: 3, rows: 3, gap: 10, items: [], selectedItemId: null
            };
            document.getElementById('cols-input').value = 3;
            document.getElementById('rows-input').value = 3;
            document.getElementById('gap-input').value = 10;
            document.getElementById('col-val').innerText = 3;
            document.getElementById('row-val').innerText = 3;
            document.getElementById('gap-val').innerText = 10;
            render();
        }

        function render() {
            // 1. Render Grid Container
            gridContainer.style.gridTemplateColumns = `repeat(${state.cols}, 1fr)`;
            gridContainer.style.gridTemplateRows = `repeat(${state.rows}, 1fr)`;
            gridContainer.style.gap = `${state.gap}px`;
            gridContainer.innerHTML = '';

            // 2. Render Items in Grid
            state.items.forEach(item => {
                const el = document.createElement('div');
                el.className = `rounded-lg cursor-pointer transition-all duration-200 flex items-center justify-center text-white font-bold shadow-lg ${state.selectedItemId === item.id ? 'grid-item-active' : ''}`;
                el.style.backgroundColor = item.color;
                el.style.gridColumn = `${item.colStart} / ${item.colEnd}`;
                el.style.gridRow = `${item.rowStart} / ${item.rowEnd}`;
                el.innerText = `Item ${item.id}`;
                el.onclick = (e) => { e.stopPropagation(); selectItem(item.id); };
                gridContainer.appendChild(el);
            });

            // 3. Render Sidebar Items List
            itemsList.innerHTML = '';
            state.items.forEach(item => {
                const div = document.createElement('div');
                div.className = `flex items-center justify-between p-2 rounded text-sm cursor-pointer transition-colors ${state.selectedItemId === item.id ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'hover:bg-slate-800 text-slate-400'}`;
                div.innerHTML = `<span>Item ${item.id}</span> <i data-lucide="chevron-right" class="w-4 h-4"></i>`;
                div.onclick = () => selectItem(item.id);
                itemsList.appendChild(div);
            });

            // 4. Render Item Editor (if selected)
            if (state.selectedItemId) {
                const item = state.items.find(i => i.id === state.selectedItemId);
                if (item) {
                    itemEditor.classList.remove('hidden');
                    document.getElementById('edit-col-start').value = item.colStart;
                    document.getElementById('edit-col-end').value = item.colEnd;
                    document.getElementById('edit-row-start').value = item.rowStart;
                    document.getElementById('edit-row-end').value = item.rowEnd;
                } else {
                    itemEditor.classList.add('hidden');
                }
            } else {
                itemEditor.classList.add('hidden');
            }

            // 5. Render Code Output
            generateCode();
            lucide.createIcons();
        }

        function generateCode() {
            let css = `.grid-container {\n`;
            css += `  display: grid;\n`;
            css += `  grid-template-columns: repeat(${state.cols}, 1fr);\n`;
            css += `  grid-template-rows: repeat(${state.rows}, 1fr);\n`;
            css += `  gap: ${state.gap}px;\n`;
            css += `}\n\n`;

            state.items.forEach(item => {
                css += `.item-${item.id} {\n`;
                css += `  grid-column: ${item.colStart} / ${item.colEnd};\n`;
                css += `  grid-row: ${item.rowStart} / ${item.rowEnd};\n`;
                css += `}\n\n`;
            });

            codeDisplay.textContent = css;
        }

        async function copyCode() {
            try {
                await navigator.clipboard.writeText(codeDisplay.textContent);
                const toast = document.getElementById('toast');
                toast.style.opacity = '1';
                setTimeout(() => toast.style.opacity = '0', 2000);
            } catch (err) {
                console.error('Failed to copy!', err);
            }
        }

        // Start App
        init();
    </script>
</body>
</html>
