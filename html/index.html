<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline HTML Collection</title>
    <meta name="description" content="A collection of offline-first web tools. Everything runs in your browser — no servers, no tracking, no data sent anywhere.">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b1020'/%3E%3Cpath d='M9 21V11l7 6 7-6v10' fill='none' stroke='%2338bdf8' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
    <style>
        :root {
            --bg: #0b1020;

            --text: #e6edf7;
            --muted: #8b97ad;
            --accent: #38bdf8;
            --accent-2: #818cf8;
            --radius: 16px;
            --shadow: 0 18px 40px -18px rgba(0, 0, 0, 0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background:
                radial-gradient(1200px 600px at 80% -10%, rgba(129, 140, 248, 0.12), transparent 60%),
                radial-gradient(900px 500px at 0% 0%, rgba(56, 189, 248, 0.10), transparent 55%),
                var(--bg);
            color: var(--text); line-height: 1.6; min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        .wrap { max-width: 1240px; margin: 0 auto; padding: 0 1.25rem; }

        header { padding: 3.5rem 0 1.5rem; text-align: center; }
        header .badge {
            display: inline-flex; align-items: center; gap: 0.5rem;
            font-size: 0.78rem; font-weight: 600; letter-spacing: 0.04em;
            color: var(--accent); background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.25);
            padding: 0.35rem 0.8rem; border-radius: 999px; margin-bottom: 1.1rem;
        }
        header .dot { width: 7px; height: 7px; border-radius: 50%; background: #34d399; box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.18); }
        header h1 {
            font-size: clamp(2rem, 5vw, 3rem); font-weight: 800; letter-spacing: -0.03em;
            background: linear-gradient(120deg, #fff, var(--accent) 55%, var(--accent-2));
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        header p { color: var(--muted); font-size: 1.05rem; max-width: 640px; margin: 0.75rem auto 0; }

        .controls {
            position: sticky; top: 0; z-index: 20;
            background: rgba(11, 16, 32, 0.82); backdrop-filter: blur(14px);
            border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
            padding: 0.9rem 0;
        }
        .controls .inner { display: flex; flex-wrap: wrap; gap: 0.8rem; align-items: center; }
        .search { position: relative; flex: 1 1 260px; min-width: 200px; }
        .search svg { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); opacity: 0.5; }
        .search input {
            width: 100%; padding: 0.7rem 0.9rem 0.7rem 2.4rem;
            background: var(--card); border: 1px solid var(--border); border-radius: 12px;
            color: var(--text); font-size: 0.95rem; font-family: inherit; outline: none;
            transition: border-color .2s, background .2s;
        }
        .search input::placeholder { color: var(--muted); }
        .search input:focus { border-color: var(--border-hover); background: var(--card-hover); }
        .filters { display: flex; flex-wrap: wrap; gap: 0.45rem; }
        .chip {
            font-size: 0.82rem; font-weight: 600; cursor: pointer;
            color: var(--muted); background: var(--card);
            border: 1px solid var(--border); border-radius: 999px;
            padding: 0.42rem 0.85rem; transition: all .18s ease; white-space: nowrap;
        }
        .chip:hover { color: var(--text); border-color: var(--border-hover); }
        .chip .n { opacity: 0.6; font-weight: 500; margin-left: 0.3rem; }
        .chip.active { color: #06121f; background: var(--accent); border-color: var(--accent); }
        .chip.active .n { opacity: 0.7; }

        main { padding: 1.75rem 0 3rem; }
        .count { color: var(--muted); font-size: 0.85rem; margin-bottom: 1.1rem; }
        .count b { color: var(--text); font-weight: 700; }
        .grid { display: grid; gap: 1.1rem; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
        .card {
            display: flex; flex-direction: column; text-decoration: none; color: inherit;
            background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 1.25rem 1.3rem; position: relative; overflow: hidden;
            transition: transform .25s cubic-bezier(.2,.7,.2,1), border-color .25s, background .25s, box-shadow .25s;
        }
        .card::before {
            content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            opacity: 0; transition: opacity .25s;
        }
        .card:hover, .card:focus-visible {
            transform: translateY(-5px); border-color: var(--border-hover);
            background: var(--card-hover); box-shadow: var(--shadow); outline: none;
        }
        .card:hover::before, .card:focus-visible::before { opacity: 1; }
        .card .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.7rem; }
        .tag {
            font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
            color: var(--accent); background: rgba(56, 189, 248, 0.12);
            padding: 0.22rem 0.55rem; border-radius: 999px;
        }
        .slug { font-size: 0.72rem; font-weight: 500; color: var(--muted); font-family: ui-monospace, monospace; }
        .card h2 { font-size: 1.12rem; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 0.45rem; }
        .card p { font-size: 0.88rem; color: var(--muted); flex: 1; }
        .card .go { margin-top: 0.9rem; font-size: 0.82rem; font-weight: 600; color: var(--accent); opacity: 0; transform: translateY(4px); transition: all .25s; }
        .card:hover .go, .card:focus-visible .go { opacity: 1; transform: none; }

        .empty { text-align: center; color: var(--muted); padding: 4rem 1rem; display: none; }
        .empty h3 { color: var(--text); font-size: 1.2rem; margin-bottom: 0.4rem; }

        footer { border-top: 1px solid var(--border); padding: 2rem 0 3rem; text-align: center; color: var(--muted); font-size: 0.85rem; }
        footer a { color: var(--accent); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @media (max-width: 640px) {
            header { padding: 2.5rem 0 1rem; }
            .grid { grid-template-columns: 1fr; }
        }
        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; scroll-behavior: auto !important; }
        }
    </style>
</head>

                <input id="q" type="search" placeholder="Search tools…" autocomplete="off" aria-label="Search tools">

        <div class="empty" id="empty">

    <footer class="wrap">

        const CATS = {
        "developer": "Developer",
        "visualization": "Visualization",
        "creative": "Creative",
        "productivity": "Productivity",
        "data": "Data",
        "design": "Design",
        "calculator": "Calculator",
        "games": "Games"
};
        const grid = document.getElementById("grid");
        const filters = document.getElementById("filters");
        const count = document.getElementById("count");
        const empty = document.getElementById("empty");
        const q = document.getElementById("q");
        let activeCat = "all";

        const counts = {};
        TOOLS.forEach(t => counts[t.category] = (counts[t.category] || 0) + 1);
        const chips = [["all", "All", TOOLS.length], ...Object.keys(CATS).filter(c => counts[c]).map(c => [c, CATS[c], counts[c]])];
        filters.innerHTML = chips.map(([id, label, n]) =>
            `<button class="chip${id === activeCat ? " active" : ""}" data-cat="${id}">${label}<span class="n">${n}</span></button>`
        ).join("");

        const esc = s => s.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

        function render() {
            const term = q.value.trim().toLowerCase();
            const list = TOOLS.filter(t =>
                (activeCat === "all" || t.category === activeCat) &&
                (!term || t.name.toLowerCase().includes(term) || t.desc.toLowerCase().includes(term))
            );
            grid.innerHTML = list.map(t => `
                <a class="card" href="${t.slug}.html">
                    <div class="top"><span class="tag">${CATS[t.category]}</span><span class="slug">${t.slug}</span></div>
                    <h2>${esc(t.name)}</h2>
                    <p>${t.desc}</p>
                    <span class="go">Open &rarr;</span>
                </a>`).join("");
            count.innerHTML = `Showing <b>${list.length}</b> of ${TOOLS.length} tools`;
            empty.style.display = list.length ? "none" : "block";
        }

        filters.addEventListener("click", e => {
            const b = e.target.closest(".chip");
            if (!b) return;
            activeCat = b.dataset.cat;
            filters.querySelectorAll(".chip").forEach(c => c.classList.toggle("active", c === b));
            render();
        });
        document.querySelector('meta[name="description"]').content = `A collection of ${TOOLS.length} offline-first web tools. Everything runs in your browser — no servers, no tracking, no data sent anywhere.`;
        q.addEventListener("input", render);
        document.addEventListener("keydown", e => {
            if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
        });
        render();
