<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern HTML Previewer</title>
    <style>
        /* --- CONFIGURATION VARIABLES --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --radius: 12px;
            --font-mono: 'Fira Code', 'Cascadia Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- MAIN LAYOUT --- */
        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
        }

        p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* --- EDITOR AREA --- */
        .editor-wrapper {
            position: relative;
            margin-bottom: 1.5rem;
        }

        textarea {
            width: 100%;
            height: 400px;
            background: #000;
            color: #d1d5db;
            font-family: var(--font-mono);
            font-size: 14px;
            padding: 1rem;
            border: 1px solid #334155;
            border-radius: var(--radius);
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--accent);
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        /* --- MODAL / POPUP --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            /* Hidden by default */
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            height: 90vh;
            background: white;
            /* Preview is usually white */
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        /* Keyboard Hint */
        .hint {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: right;
        }

        kbd {
            background: #334155;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: var(--font-mono);
        }
    </style>
</head>

<body>

    <div class="container">
        <header>
            <h1>HTML Live Previewer</h1>
            <p>Enter your HTML code below to preview it in real-time.</p>
        </header>

        <div class="editor-wrapper">
            <textarea id="code-input" placeholder="<html><body><h1>Hello World</h1></body></html>"></textarea>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="showPreview()" title="Ctrl + Enter">
                <span>▶</span> Preview Code
            </button>
            <button class="btn-secondary" onclick="pasteFromClipboard()">
                <span>📋</span> Paste from Clipboard
            </button>
            <button class="btn-secondary" onclick="clearEditor()">
                <span>🗑️</span> Clear
            </button>
        </div>

        <div class="hint">
            Tip: Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to preview quickly.
        </div>
    </div>

    <!-- The Popup Modal -->
    <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-modal" onclick="toggleModal(false)">&times;</div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        const codeInput = document.getElementById('code-input');
        const modal = document.getElementById('modal-overlay');
        const previewFrame = document.getElementById('preview-frame');

        /**
         * Renders the HTML into the iframe and opens the modal
         */
        function showPreview() {
            const code = codeInput.value;

            // We use srcdoc for a clean, isolated injection of the user's code
            previewFrame.srcdoc = code;

            toggleModal(true);
        }

        /**
         * Opens or closes the modal
         */
        function toggleModal(show) {
            modal.style.display = show ? 'flex' : 'none';
            // Prevent scrolling on body when modal is open
            document.body.style.overflow = show ? 'hidden' : 'auto';
        }

        /**
         * Closes modal only if clicking the overlay (not the content)
         */
        function closeModal(e) {
            if (e.target === modal) toggleModal(false);
        }

        /**
         * Uses Clipboard API to paste code instantly
         */
        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                codeInput.value += text;
                codeInput.focus();
            } catch (err) {
                alert("Failed to read clipboard. Please use Ctrl+V.");
            }
        }

        function clearEditor() {
            if (confirm("Are you sure you want to clear all code?")) {
                codeInput.value = '';
            }
        }

        /**
         * Keyboard Shortcuts
         */
        document.addEventListener('keydown', (e) => {
            // Ctrl + Enter or Cmd + Enter to Preview
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                showPreview();
            }

            // Esc key to close modal
            if (e.key === 'Escape') {
                toggleModal(false);
            }
        });

        // Auto-focus textarea on load
        window.onload = () => codeInput.focus();
    </script>

</body>

</html>
