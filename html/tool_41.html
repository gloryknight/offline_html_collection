<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern HTML Previewer</title>
    <style>
        /* --- CONFIGURATION VARIABLES --- */
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
            --danger: #ef4444;
            --radius: 12px;
            --font-mono: 'Fira Code', 'Cascadia Code', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 900px;
            background: var(--card-bg);
            padding: 2rem;
            border-radius: var(--radius);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        header {
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--accent);
        }

        p {
            color: var(--text-dim);
            font-size: 0.9rem;
            margin-top: 4px;
        }

        /* --- EDITOR AREA WITH LINE NUMBERS --- */
        .editor-container {
            position: relative;
            width: 100%;
            height: 400px;
            background: #000;
            border: 1px solid #334155;
            border-radius: var(--radius);
            overflow: hidden;
            display: flex;
        }

        .line-numbers {
            width: 45px;
            padding: 1rem 0;
            background: #111;
            color: #4b5563;
            text-align: center;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.5;
            /* Must match textarea line-height */
            user-select: none;
            border-right: 1px solid #334155;
            overflow: hidden;
        }

        #code-input {
            flex: 1;
            width: 100%;
            height: 100%;
            background: transparent;
            color: #d1d5db;
            font-family: var(--font-mono);
            font-size: 14px;
            line-height: 1.5;
            /* Must match line-numbers */
            padding: 1rem;
            border: none;
            resize: none;
            outline: none;
            white-space: pre;
            overflow: auto;
        }

        /* --- CONTROLS --- */
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        button {
            cursor: pointer;
            padding: 10px 20px;
            border-radius: 6px;
            border: none;
            font-weight: 600;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--accent);
            color: #000;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #334155;
            color: white;
        }

        .btn-secondary:hover {
            background: #475569;
        }

        /* --- MODAL --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            width: 100%;
            height: 90vh;
            background: white;
            border-radius: var(--radius);
            position: relative;
            overflow: hidden;
            animation: modalIn 0.3s ease-out;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.95);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        #preview-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--danger);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 20px;
            cursor: pointer;
            z-index: 1001;
        }

        .hint {
            margin-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-dim);
            text-align: right;
        }

        kbd {
            background: #334155;
            padding: 2px 5px;
            border-radius: 4px;
            font-family: var(--font-mono);
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>HTML Live Previewer</h1>
            <p>Enter your HTML code below to preview it in real-time.</p>
        </header>

        <div class="editor-container">
            <div id="line-numbers" class="line-numbers">1</div>
            <textarea id="code-input" spellcheck="false"
                placeholder="<html><body><h1>Hello</h1></body></html>"></textarea>
        </div>

        <div class="controls">
            <button class="btn-primary" onclick="showPreview()" title="Ctrl + Enter"><span>▶</span> Preview
                Code</button>
            <button class="btn-secondary" onclick="pasteFromClipboard()"><span>📋</span> Paste</button>
            <button class="btn-secondary" onclick="clearEditor()"><span>🗑️</span> Clear</button>
        </div>

        <div class="hint">Tip: Press <kbd>Ctrl</kbd> + <kbd>Enter</kbd> to preview. URL updates automatically.</div>
    </div>

    <div id="modal-overlay" class="modal-overlay" onclick="closeModal(event)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="close-modal" onclick="toggleModal(false)">&times;</div>
            <iframe id="preview-frame"></iframe>
        </div>
    </div>

    <script>
        const codeInput = document.getElementById('code-input');
        const lineNumbers = document.getElementById('line-numbers');
        const modal = document.getElementById('modal-overlay');
        const previewFrame = document.getElementById('preview-frame');

        /**
         * Updates the line number gutter and URL hash
         */
        function updateEditor() {
            const code = codeInput.value;

            // 1. Update Line Numbers
            const lines = code.split('\n').length;
            let lineNumbersHTML = '';
            for (let i = 1; i <= lines; i++) {
                lineNumbersHTML += i + '<br>';
            }
            lineNumbers.innerHTML = lineNumbersHTML;

            // 2. Update URL Hash (Base64 encoded to handle special characters)
            const encodedCode = btoa(unescape(encodeURIComponent(code)));
            window.history.replaceState(null, null, '#' + encodedCode);
        }

        /**
         * Load code from URL hash on startup
         */
        function loadFromHash() {
            const hash = window.location.hash.substring(1);
            if (hash) {
                try {
                    const decodedCode = decodeURIComponent(escape(atob(hash)));
                    codeInput.value = decodedCode;
                    showPreview()
                } catch (e) {
                    console.error("Failed to decode hash", e);
                }
            }
            updateEditor();
        }

        function showPreview() {
            previewFrame.srcdoc = codeInput.value;
            toggleModal(true);
        }

        function toggleModal(show) {
            modal.style.display = show ? 'flex' : 'none';
            document.body.style.overflow = show ? 'hidden' : 'auto';
        }

        function closeModal(e) {
            if (e.target === modal) toggleModal(false);
        }

        async function pasteFromClipboard() {
            try {
                const text = await navigator.clipboard.readText();
                codeInput.value += text;
                updateEditor();
                codeInput.focus();
            } catch (err) {
                alert("Failed to read clipboard.");
            }
        }

        function clearEditor() {
            if (confirm("Clear all code?")) {
                codeInput.value = '';
                updateEditor();
            }
        }

        // Sync scrolling between textarea and line numbers
        codeInput.addEventListener('scroll', () => {
            lineNumbers.scrollTop = codeInput.scrollTop;
        });

        // Listen for input to update lines and URL
        codeInput.addEventListener('input', updateEditor);

        // Keyboard Shortcuts
        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') showPreview();
            if (e.key === 'Escape') toggleModal(false);

            // Support Tab key in textarea
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeInput.selectionStart;
                const end = codeInput.selectionEnd;
                codeInput.value = codeInput.value.substring(0, start) + "    " + codeInput.value.substring(end);
                codeInput.selectionStart = codeInput.selectionEnd = start + 4;
                updateEditor();
            }
        });

        window.onload = () => {
            loadFromHash();
            codeInput.focus();
        };
    </script>
</body>

</html>
