<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D CSS Cube Playground</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow: hidden;
        }

        /* 3D Engine Styles */
        .viewport {
            perspective: 1000px;
            perspective-origin: center;
        }

        .scene {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            transform-style: preserve-3d;
        }

        .cube {
            position: relative;
            width: var(--size, 200px);
            height: var(--size, 200px);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }

        .face {
            position: absolute;
            width: var(--size, 200px);
            height: var(--size, 200px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            background: rgba(99, 102, 241, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1.2rem;
            backface-visibility: visible;
            user-select: none;
        }

        /* Face Orientations */
        .front  { transform: rotateY(0deg) translateZ(calc(var(--size) / 2)); }
        .back   { transform: rotateY(180deg) translateZ(calc(var(--size) / 2)); }
        .right  { transform: rotateY(90deg) translateZ(calc(var(--size) / 2)); }
        .left   { transform: rotateY(-90deg) translateZ(calc(var(--size) / 2)); }
        .top    { transform: rotateX(90deg) translateZ(calc(var(--size) / 2)); }
        .bottom { transform: rotateX(-90deg) translateZ(calc(var(--size) / 2)); }

        /* Grid Floor */
        .grid-floor {
            position: absolute;
            width: 2000px;
            height: 2000px;
            background-image: radial-gradient(circle, #334155 1px, transparent 1px);
            background-size: 40px 40px;
            transform: rotateX(90deg) translateZ(-200px);
            z-index: -1;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }

        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type=range] {
            accent-color: #6366f1;
        }
    </style>
</head>
<body class="h-screen w-full flex flex-col md:flex-row">

    <!-- Sidebar Controls -->
    <aside class="w-full md:w-80 glass h-auto md:h-full overflow-y-auto p-6 z-10 shadow-2xl">
        <div class="flex items-center gap-3 mb-8">
            <div class="p-2 bg-indigo-600 rounded-lg">
                <i data-lucide="box" class="text-white w-6 h-6"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight">CubeLab <span class="text-indigo-400 text-sm font-normal block">3D CSS Playground</span></h1>
        </div>

        <div class="space-y-8">
            <!-- Rotation Section -->
            <section>
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="rotate-3d" class="w-4 h-4"></i> Rotation
                </h2>
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span>X Axis</span><span id="val-x">0°</span></div>
                        <input type="range" id="rot-x" min="0" max="360" value="0" class="w-full">
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span>Y Axis</span><span id="val-y">0°</span></div>
                        <input type="range" id="rot-y" min="0" max="360" value="0" class="w-full">
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span>Z Axis</span><span id="val-z">0°</span></div>
                        <input type="range" id="rot-z" min="0" max="360" value="0" class="w-full">
                    </div>
                </div>
            </section>

            <!-- Geometry Section -->
            <section>
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="settings" class="w-4 h-4"></i> Geometry
                </h2>
                <div class="space-y-4">
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span>Size</span><span id="val-size">200px</span></div>
                        <input type="range" id="size" min="50" max="350" value="200" class="w-full">
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span>Perspective</span><span id="val-persp">1000px</span></div>
                        <input type="range" id="perspective" min="200" max="2000" value="1000" class="w-full">
                    </div>
                </div>
            </section>

            <!-- Appearance Section -->
            <section>
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="palette" class="w-4 h-4"></i> Appearance
                </h2>
                <div class="space-y-4">
                    <div>
                        <label class="text-sm block mb-2">Theme Color</label>
                        <input type="color" id="color" value="#6366f1" class="w-full h-10 rounded cursor-pointer bg-transparent border-none">
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><span>Opacity</span><span id="val-opacity">0.3</span></div>
                        <input type="range" id="opacity" min="0.1" max="1" step="0.1" value="0.3" class="w-full">
                    </div>
                </div>
            </section>

            <!-- Animation Section -->
            <section>
                <h2 class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4 flex items-center gap-2">
                    <i data-lucide="play" class="w-4 h-4"></i> Motion
                </h2>
                <button id="auto-rotate" class="w-full py-2 px-4 bg-slate-700 hover:bg-indigo-600 transition-colors rounded-lg text-sm font-medium flex items-center justify-center gap-2">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i> Enable Auto-Rotate
                </button>
            </section>

            <!-- Export Section -->
            <section>
                <button id="copy-code" class="w-full py-3 px-4 bg-indigo-500 hover:bg-indigo-400 transition-all rounded-lg text-sm font-bold shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-2">
                    <i data-lucide="code" class="w-4 h-4"></i> Copy CSS Code
                </button>
            </section>
        </div>

        <div class="mt-12 text-center opacity-30 text-[10px] uppercase tracking-widest">
            Built with Pure CSS & JS
        </div>
    </aside>

    <!-- Main Viewport -->
    <main class="flex-1 relative overflow-hidden flex items-center justify-center bg-[#020617]">
        <div id="viewport" class="viewport w-full h-full">
            <div class="grid-floor"></div>
            <div class="scene">
                <div id="cube" class="cube" style="--size: 200px;">
                    <div class="face front text-white/80">Front</div>
                    <div class="face back text-white/80">Back</div>
                    <div class="face right text-white/80">Right</div>
                    <div class="face left text-white/80">Left</div>
                    <div class="face top text-white/80">Top</div>
                    <div class="face bottom text-white/80">Bottom</div>
                </div>
            </div>
        </div>

        <!-- Floating Status -->
        <div class="absolute bottom-6 right-6 glass px-4 py-2 rounded-full text-xs font-mono text-indigo-300 flex items-center gap-2 border border-indigo-500/30">
            <span class="relative flex h-2 w-2">
                <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                <span class="relative inline-flex rounded-full h-2 w-2 bg-indigo-500"></span>
            </span>
            Live Rendering Active
        </div>
    </main>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // DOM Elements
        const cube = document.getElementById('cube');
        const viewport = document.getElementById('viewport');
        const faces = document.querySelectorAll('.face');
        
        // Inputs
        const inputX = document.getElementById('rot-x');
        const inputY = document.getElementById('rot-y');
        const inputZ = document.getElementById('rot-z');
        const inputSize = document.getElementById('size');
        const inputPersp = document.getElementById('perspective');
        const inputColor = document.getElementById('color');
        const inputOpacity = document.getElementById('opacity');
        const btnAuto = document.getElementById('auto-rotate');
        const btnCopy = document.getElementById('copy-code');

        // Value Displays
        const valX = document.getElementById('val-x');
        const valY = document.getElementById('val-y');
        const valZ = document.getElementById('val-z');
        const valSize = document.getElementById('val-size');
        const valPersp = document.getElementById('val-persp');
        const valOpacity = document.getElementById('val-opacity');

        let state = {
            x: 0,
            y: 0,
            z: 0,
            size: 200,
            perspective: 1000,
            color: '#6366f1',
            opacity: 0.3,
            autoRotate: false,
            rotationSpeed: { x: 0.5, y: 0.5, z: 0 }
        };

        function updateStyles() {
            cube.style.transform = `rotateX(${state.x}deg) rotateY(${state.y}deg) rotateZ(${state.z}deg)`;
            cube.style.setProperty('--size', `${state.size}px`);
            viewport.style.perspective = `${state.perspective}px`;
            
            faces.forEach(face => {
                face.style.backgroundColor = hexToRgba(state.color, state.opacity);
                face.style.borderColor = hexToRgba(state.color, 1);
            });

            // Update UI Labels
            valX.innerText = `${Math.round(state.x)}°`;
            valY.innerText = `${Math.round(state.y)}°`;
            valZ.innerText = `${Math.round(state.z)}°`;
            valSize.innerText = `${state.size}px`;
            valPersp.innerText = `${state.perspective}px`;
            valOpacity.innerText = state.opacity;
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        // Event Listeners
        inputX.addEventListener('input', (e) => { state.x = e.target.value; updateStyles(); });
        inputY.addEventListener('input', (e) => { state.y = e.target.value; updateStyles(); });
        inputZ.addEventListener('input', (e) => { state.z = e.target.value; updateStyles(); });
        inputSize.addEventListener('input', (e) => { state.size = e.target.value; updateStyles(); });
        inputPersp.addEventListener('input', (e) => { state.perspective = e.target.value; updateStyles(); });
        inputColor.addEventListener('input', (e) => { state.color = e.target.value; updateStyles(); });
        inputOpacity.addEventListener('input', (e) => { state.opacity = e.target.value; updateStyles(); });

        btnAuto.addEventListener('click', () => {
            state.autoRotate = !state.autoRotate;
            btnAuto.classList.toggle('bg-indigo-600');
            btnAuto.classList.toggle('bg-slate-700');
            btnAuto.innerHTML = state.autoRotate 
                ? `<i data-lucide="pause" class="w-4 h-4"></i> Stop Auto-Rotate` 
                : `<i data-lucide="refresh-cw" class="w-4 h-4"></i> Enable Auto-Rotate`;
            lucide.createIcons();
        });

        btnCopy.addEventListener('click', () => {
            const cssCode = `
/* 3D Cube CSS */
.cube {
  width: ${state.size}px;
  height: ${state.size}px;
  transform-style: preserve-3d;
  transform: rotateX(${state.x}deg) rotateY(${state.y}deg) rotateZ(${state.z}deg);
}

.face {
  position: absolute;
  width: ${state.size}px;
  height: ${state.size}px;
  background: ${hexToRgba(state.color, state.opacity)};
  border: 2px solid ${state.color};
}

.front  { transform: rotateY(0deg) translateZ(${state.size/2}px); }
.back   { transform: rotateY(180deg) translateZ(${state.size/2}px); }
.right  { transform: rotateY(90deg) translateZ(${state.size/2}px); }
.left   { transform: rotateY(-90deg) translateZ(${state.size/2}px); }
.top    { transform: rotateX(90deg) translateZ(${state.size/2}px); }
.bottom { transform: rotateX(-90deg) translateZ(${state.size/2}px); }`.trim();

            navigator.clipboard.writeText(cssCode).then(() => {
                const originalText = btnCopy.innerHTML;
                btnCopy.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i> Copied!`;
                lucide.createIcons();
                setTimeout(() => {
                    btnCopy.innerHTML = originalText;
                    lucide.createIcons();
                }, 2000);
            });
        });

        // Animation Loop
        function animate() {
            if (state.autoRotate) {
                state.x += state.rotationSpeed.x;
                state.y += state.rotationSpeed.y;
                state.z += state.rotationSpeed.z;
                
                // Sync sliders to match animation
                inputX.value = state.x % 360;
                inputY.value = state.y % 360;
                inputZ.value = state.z % 360;
                updateStyles();
            }
            requestAnimationFrame(animate);
        }

        // Initial Call
        updateStyles();
        animate();
    </script>
</body>
</html>
