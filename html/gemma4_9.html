<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Beautifier | Professional SQL Formatter</title>
    <meta name="description" content="A professional, lightning-fast tool to beautify and format messy SQL queries instantly.">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <!-- PrismJS for Syntax Highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" id="prism-theme" />
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SQL Formatter Library -->
    <script src="https://cdn.jsdelivr.net/npm/sql-formatter@15.3.1/dist/sql-formatter.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Fira Code', 'monospace'],
                    },
                }
            }
        }
    </script>

    <style>
        body { transition: background-color 0.3s ease, color 0.3s ease; }
        .glass {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .dark .glass {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        pre[class*="language-"] {
            margin: 0 !important;
            border-radius: 0.5rem !important;
            background: transparent !important;
        }
        code[class*="language-"] {
            font-family: 'Fira Code', monospace !important;
            font-size: 14px !important;
        }
        .custom-scrollbar::-webkit-scrollbar { width: 8px; height: 8px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; }
        .transition-all-200 { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 min-h-screen font-sans">

    <!-- Navigation -->
    <nav class="sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800 glass px-6 py-4">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <i data-lucide="database" class="w-5 h-5"></i>
                </div>
                <span class="text-xl font-bold tracking-tight italic">SQL<span class="text-indigo-600 dark:text-indigo-400">Flow</span></span>
            </div>
            
            <div class="flex items-center gap-4">
                <button id="themeToggle" class="p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-all-200">
                    <i data-lucide="sun" id="sunIcon" class="w-5 h-5 hidden"></i>
                    <i data-lucide="moon" id="moonIcon" class="w-5 h-5"></i>
                </button>
                <a href="https://github.com" target="_blank" class="hidden sm:flex items-center gap-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:text-indigo-600 transition-colors">
                    <i data-lucide="github" class="w-4 h-4"></i> GitHub
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto p-6 lg:p-8">
        <!-- Header Section -->
        <header class="mb-10 text-center sm:text-left">
            <h1 class="text-4xl font-extrabold tracking-tight mb-3 bg-clip-text text-transparent bg-gradient-to-r from-indigo-600 to-violet-500 dark:from-indigo-400 dark:to-violet-300">
                SQL Formatter & Beautifier
            </h1>
            <p class="text-slate-600 dark:text-slate-400 text-lg max-w-2xl">
                Clean up messy SQL queries instantly. Professional indentation, syntax highlighting, and easy export for developers.
            </p>
        </header>

        <!-- Controls Bar -->
        <div class="flex flex-wrap items-center justify-between gap-4 mb-6 bg-white dark:bg-slate-900 p-4 rounded-2xl shadow-sm border border-slate-200 dark:border-slate-800">
            <div class="flex flex-wrap items-center gap-4">
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Dialect:</label>
                    <select id="dialect" class="bg-slate-100 dark:bg-slate-800 border-none rounded-md px-3 py-1.5 text-sm focus:ring-2 ring-indigo-500 outline-none cursor-pointer">
                        <option value="sql">Standard SQL</option>
                        <option value="postgresql">PostgreSQL</option>
                        <option value="mysql">MySQL</option>
                        <option value="tsql">T-SQL (SQL Server)</option>
                        <option value="plsql">PL/SQL</option>
                    </select>
                </div>
                <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-700 hidden sm:block"></div>
                <div class="flex items-center gap-2">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-500">Indent:</label>
                    <select id="indent" class="bg-slate-100 dark:bg-slate-800 border-none rounded-md px-3 py-1.5 text-sm focus:ring-2 ring-indigo-500 outline-none cursor-pointer">
                        <option value="2">2 Spaces</option>
                        <option value="4" selected>4 Spaces</option>
                        <option value="\t">Tabs</option>
                    </select>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button id="clearBtn" class="px-4 py-2 text-sm font-medium text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-lg transition-all">
                    Clear
                </button>
                <button id="formatBtn" class="flex items-center gap-2 px-6 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg font-semibold shadow-lg shadow-indigo-500/30 transition-all transform active:scale-95">
                    <i data-lucide="wand-2" class="w-4 h-4"></i> Format SQL
                </button>
            </div>
        </div>

        <!-- Editor Grid -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 min-h-[500px]">
            <!-- Input Area -->
            <div class="flex flex-col group">
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="text-sm font-semibold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="terminal" class="w-4 h-4"></i> Input Query
                    </span>
                </div>
                <div class="relative flex-grow group">
                    <textarea 
                        id="inputSql" 
                        spellcheck="false"
                        placeholder="-- Paste your messy SQL here...&#10;SELECT * FROM users WHERE id=1 AND status='active' ORDER BY created_at DESC;"
                        class="w-full h-[500px] lg:h-full p-6 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-sm focus:ring-2 ring-indigo-500 outline-none font-mono text-sm resize-none custom-scrollbar transition-all"
                    ></textarea>
                </div>
            </div>

            <!-- Output Area -->
            <div class="flex flex-col">
                <div class="flex items-center justify-between mb-2 px-1">
                    <span class="text-sm font-semibold text-slate-500 uppercase tracking-widest flex items-center gap-2">
                        <i data-lucide="check-circle" class="w-4 h-4"></i> Formatted Output
                    </span>
                    <button id="copyBtn" class="flex items-center gap-1.5 text-xs font-bold text-indigo-600 dark:text-indigo-400 hover:bg-indigo-50 dark:hover:bg-indigo-900/30 px-3 py-1 rounded-full transition-all">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i> <span id="copyText">COPY</span>
                    </button>
                </div>
                <div class="relative flex-grow overflow-hidden bg-[#1e1e1e] rounded-2xl shadow-xl border border-slate-800 group/output">
                    <pre class="h-[500px] lg:h-full custom-scrollbar overflow-auto"><code id="outputSql" class="language-sql"></code></pre>
                </div>
            </div>
        </div>

        <!-- Footer Info -->
        <footer class="mt-16 text-center pb-8">
            <p class="text-slate-500 dark:text-slate-600 text-sm">
                Built with ❤️ for Developers • Open Source & Lightweight
            </p>
        </footer>
    </main>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-sql.min.js"></script>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const inputSql = document.getElementById('inputSql');
        const outputSql = document.getElementById('outputSql');
        const formatBtn = document.getElementById('formatBtn');
        const clearBtn = document.getElementById('clearBtn');
        const copyBtn = document.getElementById('copyBtn');
        const copyText = document.getElementById('copyText');
        const dialectSelect = document.getElementById('dialect');
        const indentSelect = document.getElementById('indent');
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        // Theme Logic
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            sunIcon.classList.toggle('hidden', !isDark);
            moonIcon.classList.toggle('hidden', isDark);
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
        }

        // Check saved theme
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
        }

        themeToggle.addEventListener('click', toggleTheme);

        // Formatting Logic
        function formatSQL() {
            const rawSql = inputSql.value.trim();
            if (!rawSql) return;

            let indentValue = indentSelect.value;
            if (indentValue !== '\\t') {
                indentValue = parseInt(indentValue);
            } else {
                indentValue = '\t';
            }

            try {
                const formatted = sqlFormatter.format(rawSql, {
                    language: dialectSelect.value,
                    tabWidth: typeof indentValue === 'number' ? indentValue : undefined,
                    useTabs: indentValue === '\t',
                    indentStyle: "tabularLeft"
                });

                outputSql.textContent = formatted;
                Prism.highlightElement(outputSql);
            } catch (err) {
                outputSql.textContent = "-- Error formatting SQL: \n" + err.message;
                console.error(err);
            }
        }

        // Copy Logic
        async function copyToClipboard() {
            const text = outputSql.textContent;
            if (!text || text.startsWith('-- Error')) return;

            try {
                await navigator.clipboard.writeText(text);
                copyText.innerText = 'COPIED!';
                copyBtn.classList.add('bg-green-50', 'text-green-600');
                
                setTimeout(() => {
                    copyText.innerText = 'COPY';
                    copyBtn.classList.remove('bg-green-50', 'text-green-600');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy: ', err);
            }
        }

        // Event Listeners
        formatBtn.addEventListener('click', formatSQL);
        clearBtn.addEventListener('click', () => {
            inputSql.value = '';
            outputSql.textContent = '';
        });
        copyBtn.addEventListener('click', copyToClipboard);

        // Keyboard Shortcut (Cmd/Ctrl + Enter)
        document.addEventListener('keydown', (e) => {
            if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
                formatSQL();
            }
        });

        // Auto-resize textarea for better UX (optional enhancement)
        inputSql.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = (this.scrollHeight) + 'px';
        });
    </script>
</body>
</html>
