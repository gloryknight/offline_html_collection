<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraGen | Generative Math Art</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #050505;
            margin: 0;
            overflow: hidden;
            color: white;
        }
        canvas {
            display: block;
            cursor: crosshair;
        }
        .glass {
            background: rgba(15, 15, 15, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input[type=range] {
            accent-color: #6366f1;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 6s ease-in-out infinite; }
    </style>
</head>
<body>

    <!-- UI Overlay -->
    <div class="fixed inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        
        <!-- Header -->
        <header class="flex justify-between items-start pointer-events-auto">
            <div>
                <h1 class="text-3xl font-light tracking-tighter text-white opacity-90">Aura<span class="font-semibold text-indigo-500">Gen</span></h1>
                <p class="text-xs text-gray-400 uppercase tracking-widest mt-1">Mathematical Generative Canvas</p>
            </div>
            <div class="flex gap-3">
                <button id="downloadBtn" class="glass px-4 py-2 rounded-full text-sm hover:bg-white/10 transition-all pointer-events-auto border border-white/20">
                    Export PNG
                </button>
            </div>
        </header>

        <!-- Main Controls -->
        <div class="flex justify-between items-end w-full h-full pointer-events-none">
            <!-- Left Panel: Parameters -->
            <aside class="glass w-72 p-6 rounded-3xl pointer-events-auto custom-scrollbar max-h-[80vh] overflow-y-auto transition-all duration-500 translate-x-[-120%] group-hover:translate-x-0" id="controlPanel">
                <div class="space-y-6">
                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-3">Complexity</label>
                        <input type="range" id="complexity" min="2" max="20" step="1" value="6" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-3">Symmetry</label>
                        <input type="range" id="symmetry" min="1" max="12" step="1" value="6" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-3">Expansion</label>
                        <input type="range" id="expansion" min="0.1" max="5" step="0.1" value="1.5" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-3">Speed</label>
                        <input type="range" id="speed" min="0.001" max="0.05" step="0.001" value="0.01" class="w-full h-1 bg-white/10 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-[10px] uppercase tracking-widest text-gray-400 block mb-3">Color Palette</label>
                        <select id="palette" class="w-full bg-white/5 border border-white/10 rounded-lg p-2 text-sm focus:outline-none focus:ring-1 ring-indigo-500 transition-all">
                            <option value="neon">Electric Neon</option>
                            <option value="sunset">Golden Sunset</option>
                            <option value="ocean">Deep Ocean</option>
                            <option value="minimal">Monochrome</option>
                        </select>
                    </div>

                    <div class="pt-4 space-y-3">
                        <button id="randomizeBtn" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-sm font-semibold transition-all shadow-lg shadow-indigo-500/20">
                            Randomize Seed
                        </button>
                        <button id="clearBtn" class="w-full py-3 bg-white/5 hover:bg-white/10 rounded-xl text-sm font-semibold transition-all border border-white/10">
                            Clear Canvas
                        </button>
                    </div>
                </div>
            </aside>

            <!-- Right Panel: Instructions -->
            <div class="pointer-events-none flex flex-col items-end gap-4">
                <div class="glass px-5 py-3 rounded-2xl text-[11px] text-gray-400 tracking-wide animate-float">
                    CLICK CANVAS TO EVOLVE PATTERN
                </div>
            </div>
        </div>
    </div>

    <!-- Canvas -->
    <canvas id="canvas"></canvas>

    <script>
        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const controlPanel = document.getElementById('controlPanel');
        
        // UI Elements
        const complexitySlider = document.getElementById('complexity');
        const symmetrySlider = document.getElementById('symmetry');
        const expansionSlider = document.getElementById('expansion');
        const speedSlider = document.getElementById('speed');
        const paletteSelect = document.getElementById('palette');
        const randomizeBtn = document.getElementById('randomizeBtn');
        const clearBtn = document.getElementById('clearBtn');
        const downloadBtn = document.getElementById('downloadBtn');

        let width, height;
        let particles = [];
        let time = 0;
        let mouse = { x: undefined, y: undefined };
        let isMouseDown = false;

        const palettes = {
            neon: ['#6366f1', '#a855f7', '#ec4899', '#06b6d4'],
            sunset: ['#f59e0b', '#ef4444', '#ec4899', '#facc15'],
            ocean: ['#0ea5e9', '#2dd4bf', '#2563eb', '#06b6d4'],
            minimal: ['#ffffff', '#94a3b8', '#475569', '#1e293b']
        };

        class Particle {
            constructor(x, y, color) {
                this.baseX = x;
                this.baseY = y;
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 2 + 1;
                this.angle = Math.random() * Math.PI * 2;
                this.velocity = Math.random() * 0.5 + 0.2;
            }

            update(time, params) {
                const { complexity, expansion, symmetry } = params;
                
                // Mathematical movement logic (Lissajous-inspired)
                this.angle += parseFloat(speedSlider.value);
                
                const orbitRadius = (Math.sin(time * 0.5) * 100) + (complexity * 20);
                const driftX = Math.cos(this.angle * complexity) * orbitRadius;
                const driftY = Math.sin(this.angle * expansion) * orbitRadius;

                this.x = width / 2 + driftX;
                this.y = height / 2 + driftY;
            }

            draw(symmetry) {
                ctx.save();
                ctx.translate(width / 2, height / 2);
                
                for (let i = 0; i < symmetry; i++) {
                    ctx.rotate((Math.PI * 2) / symmetry);
                    ctx.beginPath();
                    ctx.arc(this.x - width/2, this.y - height/2, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.fill();
                    
                    // Add a glow effect
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = this.color;
                }
                ctx.restore();
            }
        }

        function init() {
            resize();
            createParticles();
            animate();
            
            // Show control panel after delay
            setTimeout(() => {
                controlPanel.style.transform = 'translateX(0)';
            }, 800);
        }

        function createParticles() {
            particles = [];
            const count = complexitySlider.value * 15;
            const currentPalette = palettes[paletteSelect.value];
            
            for (let i = 0; i < count; i++) {
                const color = currentPalette[Math.floor(Math.random() * currentPalette.length)];
                particles.push(new Particle(width / 2, height / 2, color));
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }

        function animate() {
            // Create trail effect by not fully clearing the canvas
            ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
            ctx.fillRect(0, 0, width, height);

            time += parseFloat(speedSlider.value);

            const params = {
                complexity: parseInt(complexitySlider.value),
                symmetry: parseInt(symmetrySlider.value),
                expansion: parseFloat(expansionSlider.value)
            };

            particles.forEach(p => {
                p.update(time, params);
                p.draw(params.symmetry);
            });

            requestAnimationFrame(animate);
        }

        // Events
        window.addEventListener('resize', resize);

        canvas.addEventListener('mousedown', (e) => {
            isMouseDown = true;
            createParticles(); // Re-seed on click
            // Jitter effect
            particles.forEach(p => {
                p.angle += Math.random() * 10;
            });
        });

        randomizeBtn.addEventListener('click', () => {
            complexitySlider.value = Math.floor(Math.random() * 18) + 2;
            symmetrySlider.value = Math.floor(Math.random() * 11) + 1;
            expansionSlider.value = (Math.random() * 4 + 0.5).toFixed(1);
            createParticles();
        });

        clearBtn.addEventListener('click', () => {
            ctx.clearRect(0, 0, width, height);
            createParticles();
        });

        complexitySlider.addEventListener('input', createParticles);
        paletteSelect.addEventListener('change', createParticles);

        downloadBtn.addEventListener('click', () => {
            const link = document.createElement('a');
            link.download = `auragen-art-${Date.now()}.png`;
            link.href = canvas.toDataURL();
            link.click();
        });

        // Start the app
        init();

    </script>
</body>
</html>
