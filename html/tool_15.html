<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumFlow | Particle Physics Sandbox</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #020617;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
        }
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        input[type=range] {
            accent-color: #3b82f6;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- UI Overlay -->
    <div class="fixed inset-0 pointer-events-none flex flex-col justify-between p-6 z-10">
        
        <!-- Header -->
        <header class="flex justify-between items-start pointer-events-auto">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tighter text-white bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-emerald-400">
                    QUANTUM FLOW
                </h1>
                <p class="text-xs uppercase tracking-[0.2em] text-slate-500 font-semibold">High-Performance Physics Sandbox</p>
            </div>
            <div class="hidden md:block text-right">
                <div id="fps-counter" class="text-emerald-400 font-mono text-sm">60 FPS</div>
                <div class="text-[10px] text-slate-500 uppercase tracking-widest">Engine Status: Active</div>
            </div>
        </header>

        <!-- Main Controls -->
        <main class="flex flex-col md:flex-row justify-between items-end gap-6 pointer-events-auto">
            
            <!-- Settings Panel -->
            <div class="glass p-6 rounded-2xl w-full max-w-xs custom-scrollbar overflow-y-auto max-h-[60vh] md:max-h-none">
                <h2 class="text-sm font-semibold mb-4 text-blue-400 uppercase tracking-wider border-b border-white/10 pb-2">Parameters</h2>
                
                <div class="space-y-5">
                    <!-- Particle Count -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-medium">
                            <span>Particle Density</span>
                            <span id="val-count" class="text-blue-400">1000</span>
                        </div>
                        <input type="range" id="input-count" min="100" max="5000" step="100" value="1000" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Gravity -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-medium">
                            <span>Gravity Strength</span>
                            <span id="val-gravity" class="text-blue-400">0.5</span>
                        </div>
                        <input type="range" id="input-gravity" min="-1" max="1" step="0.05" value="0.2" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Friction -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-medium">
                            <span>Damping (Friction)</span>
                            <span id="val-friction" class="text-blue-400">0.98</span>
                        </div>
                        <input type="range" id="input-friction" min="0.8" max="1" step="0.005" value="0.98" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Particle Size -->
                    <div class="space-y-2">
                        <div class="flex justify-between text-xs font-medium">
                            <span>Particle Radius</span>
                            <span id="val-size" class="text-blue-400">2</span>
                        </div>
                        <input type="range" id="input-size" min="0.5" max="10" step="0.5" value="2" class="w-full h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <!-- Color Theme -->
                    <div class="space-y-2">
                        <span class="text-xs font-medium block mb-2 uppercase tracking-tighter text-slate-400">Color Palette</span>
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="setTheme('cyan')" class="h-8 rounded bg-cyan-500/40 border border-cyan-500 hover:bg-cyan-500 transition-colors"></button>
                            <button onclick="setTheme('magma')" class="h-8 rounded bg-orange-600/40 border border-orange-600 hover:bg-orange-600 transition-colors"></button>
                            <button onclick="setTheme('emerald')" class="h-8 rounded bg-emerald-500/40 border border-emerald-500 hover:bg-emerald-500 transition-colors"></button>
                        </div>
                    </div>

                    <!-- Actions -->
                    <div class="pt-2 flex gap-2">
                        <button id="btn-reset" class="flex-1 py-2 bg-white/5 hover:bg-white/10 border border-white/10 rounded-lg text-xs font-bold transition-all uppercase tracking-widest">Reset</button>
                        <button id="btn-explode" class="flex-1 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-xs font-bold transition-all uppercase tracking-widest shadow-lg shadow-blue-900/20">Explode</button>
                    </div>
                </div>
            </div>

            <!-- Interaction Hint -->
            <div class="text-slate-500 text-[10px] md:text-xs uppercase tracking-[0.3em] pb-2 animate-pulse">
                Click & Drag to Manipulate Matter
            </div>
        </main>
    </div>

    <!-- Canvas Layer -->
    <canvas id="sandbox"></canvas>

    <script>
        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d', { alpha: false }); // Optimization: no alpha for background
        const fpsDisplay = document.getElementById('fps-counter');

        // State Management
        let width, height;
        let particles = [];
        let mouse = { x: -1000, y: -1000, active: false, down: false };
        let frameCount = 0;
        let lastTime = performance.now();

        // Configurable Parameters
        const config = {
            count: 1000,
            gravity: 0.2,
            friction: 0.98,
            size: 2,
            theme: 'cyan', // cyan, magma, emerald
            colors: {
                cyan: ['#22d3ee', '#0ea5e9', '#3b82f6'],
                magma: ['#fb923c', '#ea580c', '#ef4444'],
                emerald: ['#34d399', '#10b981', '#059669']
            }
        };

        // UI Elements
        const inputs = {
            count: document.getElementById('input-count'),
            gravity: document.getElementById('input-gravity'),
            friction: document.getElementById('input-friction'),
            size: document.getElementById('input-size'),
        };

        const displays = {
            count: document.getElementById('val-count'),
            gravity: document.getElementById('val-gravity'),
            friction: document.getElementById('val-friction'),
            size: document.getElementById('val-size'),
        };

        class Particle {
            constructor(x, y) {
                this.init(x, y);
            }

            init(x, y) {
                this.x = x || Math.random() * width;
                this.y = y || Math.random() * height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * config.size + 1;
                const colorSet = config.colors[config.theme];
                this.color = colorSet[Math.floor(Math.random() * colorSet.length)];
            }

            update() {
                // Apply Friction
                this.vx *= config.friction;
                this.vy *= config.friction;

                // Gravity toward mouse
                if (mouse.active) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    const force = (mouse.down ? -2 : 1) * config.gravity * 50 / (dist + 100);
                    
                    this.vx += (dx / dist) * force;
                    this.vy += (dy / dist) * force;
                }

                // Apply Velocity
                this.x += this.vx;
                this.y += this.vy;

                // Boundary Check with bounce
                if (this.x < 0) { this.x = 0; this.vx *= -1; }
                else if (this.x > width) { this.x = width; this.vx *= -1; }
                
                if (this.y < 0) { this.y = 0; this.vy *= -1; }
                else if (this.y > height) { this.y = height; this.vy *= -1; }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, config.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            for (let i = 0; i < config.count; i++) {
                particles.push(new Particle());
            }
        }

        function resize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * window.devicePixelRatio;
            canvas.height = height * window.devicePixelRatio;
            canvas.style.width = `${width}px`;
            canvas.style.height = `${height}px`;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            initParticles();
        }

        function setTheme(theme) {
            config.theme = theme;
            initParticles(); // Re-color particles
        }

        function explode() {
            particles.forEach(p => {
                const dx = p.x - mouse.x;
                const dy = p.y - mouse.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const force = 100 / (dist + 1);
                p.vx += (dx / dist) * force * 20;
                p.vy += (dy / dist) * force * 20;
            });
        }

        function animate() {
            // Create motion trail effect
            ctx.fillStyle = 'rgba(2, 6, 23, 0.15)';
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            // FPS Calculation
            frameCount++;
            const now = performance.now();
            if (now - lastTime >= 1000) {
                fpsDisplay.innerText = `${frameCount} FPS`;
                fpsDisplay.className = frameCount > 50 ? 'text-emerald-400 font-mono text-sm' : 'text-orange-400 font-mono text-sm';
                frameCount = 0;
                lastTime = now;
            }

            requestAnimationFrame(animate);
        }

        // Listeners
        window.addEventListener('resize', resize);
        
        canvas.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        canvas.addEventListener('mousedown', () => mouse.down = true);
        window.addEventListener('mouseup', () => mouse.down = false);
        canvas.addEventListener('mouseleave', () => mouse.active = false);

        // Control Listeners
        inputs.count.oninput = (e) => {
            config.count = parseInt(e.target.value);
            displays.count.innerText = config.count;
            initParticles();
        };

        inputs.gravity.oninput = (e) => {
            config.gravity = parseFloat(e.target.value);
            displays.gravity.innerText = config.gravity;
        };

        inputs.friction.oninput = (e) => {
            config.friction = parseFloat(e.target.value);
            displays.friction.innerText = config.friction;
        };

        inputs.size.oninput = (e) => {
            config.size = parseFloat(e.target.value);
            displays.size.innerText = config.size;
        };

        document.getElementById('btn-reset').onclick = initParticles;
        document.getElementById('btn-explode').onclick = explode;

        // Boot
        resize();
        animate();
    </script>
</body>
</html>
