<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise | Professional Budget Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-in { animation: slideIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="text-slate-800 antialiased">

    <div class="min-h-screen pb-12">
        <!-- Navigation -->
        <nav class="bg-white border-b border-slate-200 px-6 py-4 mb-8">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <div class="bg-indigo-600 p-2 rounded-lg text-white">
                        <i data-lucide="wallet" class="w-6 h-6"></i>
                    </div>
                    <h1 class="text-xl font-bold tracking-tight text-slate-900">SpendWise</h1>
                </div>
                <div class="text-sm text-slate-500 font-medium" id="current-date"></div>
            </div>
        </nav>

        <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <!-- Summary Cards -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                <div class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-slate-500 text-sm font-medium uppercase tracking-wider">Total Balance</span>
                        <i data-lucide="banknote" class="text-indigo-500 w-5 h-5"></i>
                    </div>
                    <div class="text-3xl font-bold text-slate-900" id="total-balance">$0.00</div>
                </div>
                <div class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-slate-500 text-sm font-medium uppercase tracking-wider">Total Income</span>
                        <i data-lucide="trending-up" class="text-emerald-500 w-5 h-5"></i>
                    </div>
                    <div class="text-3xl font-bold text-emerald-600" id="total-income">$0.00</div>
                </div>
                <div class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200">
                    <div class="flex items-center justify-between mb-4">
                        <span class="text-slate-500 text-sm font-medium uppercase tracking-wider">Total Expenses</span>
                        <i data-lucide="trending-down" class="text-rose-500 w-5 h-5"></i>
                    </div>
                    <div class="text-3xl font-bold text-rose-600" id="total-expense">$0.00</div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
                <!-- Left Column: Form and List -->
                <div class="lg:col-span-7 space-y-8">
                    <!-- Add Transaction Card -->
                    <section class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                            <i data-lucide="plus-circle" class="w-5 h-5 text-indigo-600"></i>
                            Add New Transaction
                        </h2>
                        <form id="transaction-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-slate-700 mb-1">Description</label>
                                <input type="text" id="desc" required placeholder="e.g., Grocery Shopping" 
                                    class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Amount ($)</label>
                                <input type="number" id="amount" required step="0.01" placeholder="0.00" 
                                    class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-700 mb-1">Category</label>
                                <select id="category" class="w-full px-4 py-2 rounded-xl border border-slate-200 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all">
                                    <option value="Food">Food & Dining</option>
                                    <option value="Shopping">Shopping</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Rent">Housing/Rent</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Utilities">Utilities</option>
                                    <option value="Income">Salary/Income</option>
                                </select>
                            </div>
                            <div class="md:col-span-2 pt-2">
                                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 rounded-xl transition-all transform active:scale-[0.98] shadow-lg shadow-indigo-200">
                                    Add Transaction
                                </button>
                            </div>
                        </form>
                    </section>

                    <!-- History Card -->
                    <section class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200">
                        <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                            <i data-lucide="list" class="w-5 h-5 text-indigo-600"></i>
                            Recent Transactions
                        </h2>
                        <div id="transaction-list" class="space-y-3 max-h-[400px] overflow-y-auto custom-scrollbar pr-2">
                            <!-- Items injected by JS -->
                            <div class="text-center py-10 text-slate-400 italic">No transactions recorded yet.</div>
                        </div>
                    </section>
                </div>

                <!-- Right Column: Visualization -->
                <div class="lg:col-span-5 space-y-8">
                    <section class="glass-card p-6 rounded-2xl shadow-sm border border-slate-200 sticky top-8">
                        <h2 class="text-lg font-semibold mb-6 flex items-center gap-2">
                            <i data-lucide="pie-chart" class="w-5 h-5 text-indigo-600"></i>
                            Spending Breakdown
                        </h2>
                        <div class="relative aspect-square w-full max-w-[300px] mx-auto">
                            <canvas id="expenseChart"></canvas>
                        </div>
                        <div id="chart-legend" class="mt-8 space-y-2 text-sm">
                            <!-- Legend injected by JS -->
                        </div>
                    </section>
                </div>
            </div>
        </main>
    </div>

    <script>
        // State Management
        let transactions = JSON.parse(localStorage.getItem('transactions')) || [];
        let myChart = null;

        const categoryColors = {
            'Food': '#f87171',
            'Shopping': '#fb923c',
            'Transport': '#fbbf24',
            'Rent': '#818cf8',
            'Entertainment': '#c084fc',
            'Utilities': '#2dd4bf',
            'Income': '#34d399'
        };

        // DOM Elements
        const transactionForm = document.getElementById('transaction-form');
        const transactionList = document.getElementById('transaction-list');
        const totalBalanceEl = document.getElementById('total-balance');
        const totalIncomeEl = document.getElementById('total-income');
        const totalExpenseEl = document.getElementById('total-expense');
        const expenseChartCanvas = document.getElementById('expenseChart').getContext('2d');

        // Initialize
        function init() {
            lucide.createIcons();
            document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });
            updateUI();
        }

        // Add Transaction
        transactionForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const desc = document.getElementById('desc').value;
            const amount = parseFloat(document.getElementById('amount').value);
            const category = document.getElementById('category').value;

            const transaction = {
                id: Math.floor(Math.random() * 1000000),
                desc,
                amount: category === 'Income' ? amount : -Math.abs(amount),
                category,
                date: new Date().toISOString()
            };

            transactions.unshift(transaction);
            saveData();
            updateUI();
            transactionForm.reset();
        });

        // Delete Transaction
        function deleteTransaction(id) {
            transactions = transactions.filter(t => t.id !== id);
            saveData();
            updateUI();
        }

        function saveData() {
            localStorage.setItem('transactions', JSON.stringify(transactions));
        }

        // Update UI Components
        function updateUI() {
            renderList();
            calculateTotals();
            updateChart();
        }

        function calculateTotals() {
            const totals = transactions.reduce((acc, t) => {
                if (t.amount > 0) acc.income += t.amount;
                else acc.expense += Math.abs(t.amount);
                return acc;
            }, { income: 0, expense: 0 });

            const balance = totals.income - totals.expense;

            totalBalanceEl.innerText = formatCurrency(balance);
            totalIncomeEl.innerText = formatCurrency(totals.income);
            totalExpenseEl.innerText = formatCurrency(totals.expense);

            // Color coding for balance
            totalBalanceEl.className = `text-3xl font-bold ${balance >= 0 ? 'text-slate-900' : 'text-rose-600'}`;
        }

        function renderList() {
            if (transactions.length === 0) {
                transactionList.innerHTML = `<div class="text-center py-10 text-slate-400 italic">No transactions recorded yet.</div>`;
                return;
            }

            transactionList.innerHTML = transactions.map(t => `
                <div class="animate-slide-in flex items-center justify-between p-4 bg-white border border-slate-100 rounded-xl shadow-sm group hover:border-indigo-200 transition-all">
                    <div class="flex items-center gap-4">
                        <div class="p-2 rounded-lg ${t.amount > 0 ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600'}">
                            <i data-lucide="${t.amount > 0 ? 'arrow-up-right' : 'arrow-down-left'}" class="w-4 h-4"></i>
                        </div>
                        <div>
                            <p class="font-semibold text-slate-800">${t.desc}</p>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="text-xs px-2 py-0.5 rounded-full bg-slate-100 text-slate-500 font-medium">${t.category}</span>
                                <span class="text-[10px] text-slate-400 uppercase tracking-tighter">${new Date(t.date).toLocaleDateString()}</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-4">
                        <span class="font-bold ${t.amount > 0 ? 'text-emerald-600' : 'text-rose-600'}">
                            ${t.amount > 0 ? '+' : ''}${formatCurrency(t.amount)}
                        </span>
                        <button onclick="deleteTransaction(${t.id})" class="opacity-0 group-hover:opacity-100 p-2 text-slate-400 hover:text-rose-500 transition-all">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function updateChart() {
            // Group expenses by category (ignoring Income)
            const expenseData = transactions
                .filter(t => t.amount < 0 && t.category !== 'Income')
                .reduce((acc, t) => {
                    acc[t.category] = (acc[t.category] || 0) + Math.abs(t.amount);
                    return acc;
                }, {});

            const labels = Object.keys(expenseData);
            const values = Object.values(expenseData);
            const colors = labels.map(l => categoryColors[l] || '#cbd5e1');

            if (myChart) {
                myChart.destroy();
            }

            if (labels.length === 0) {
                document.getElementById('chart-legend').innerHTML = '<p class="text-center text-slate-400 py-8">No expense data to visualize</p>';
                return;
            }

            myChart = new Chart(expenseChartCanvas, {
                type: 'doughnut',
                data: {
                    labels: labels,
                    datasets: [{
                        data: values,
                        backgroundColor: colors,
                        borderWidth: 0,
                        hoverOffset: 15
                    }]
                },
                options: {
                    cutout: '70%',
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            padding: 12,
                            backgroundColor: '#1e293b',
                            titleFont: { size: 14, weight: 'bold' },
                            bodyFont: { size: 13 },
                            callbacks: {
                                label: (context) => ` ${formatCurrency(context.parsed)}`
                            }
                        }
                    },
                    responsive: true,
                    maintainAspectRatio: false
                }
            });

            // Update Custom Legend
            const legendEl = document.getElementById('chart-legend');
            legendEl.innerHTML = labels.map((label, i) => `
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <span class="w-3 h-3 rounded-full" style="background-color: ${colors[i]}"></span>
                        <span class="text-slate-600 font-medium">${label}</span>
                    </div>
                    <span class="font-bold text-slate-800">${formatCurrency(values[i])}</span>
                </div>
            `).join('');
        }

        function formatCurrency(num) {
            return new Intl.NumberFormat('en-US', {
                style: 'currency',
                currency: 'USD',
            }).format(num);
        }

        // Start the app
        init();
    </script>
</body>
</html>
