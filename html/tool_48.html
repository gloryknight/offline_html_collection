<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Defense - Tower Defense Game</title>

            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

            position: relative;
            width: 960px;
            height: 700px;
        }

        canvas {
            border: 2px solid #1a1a3a;

        }

        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #topBar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 50px;
            background: linear-gradient(180deg, rgba(10, 10, 30, 0.95), rgba(10, 10, 30, 0.7));
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            pointer-events: auto;
            border-bottom: 1px solid rgba(100, 100, 255, 0.2);
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .stat-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .stat-value {
            color: #fff;
            font-size: 16px;
        }

        #towerPanel {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 90px;
            background: linear-gradient(0deg, rgba(10, 10, 30, 0.95), rgba(10, 10, 30, 0.7));
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 0 20px;
            pointer-events: auto;
            border-top: 1px solid rgba(100, 100, 255, 0.2);
        }

        .tower-btn {
            width: 72px;
            height: 72px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: all 0.2s;
            position: relative;
        }

        .tower-btn:hover {
            border-color: rgba(100, 100, 255, 0.5);
            background: rgba(100, 100, 255, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 5px 20px rgba(100, 100, 255, 0.2);
        }

        .tower-btn.selected {
            border-color: #6c63ff;
            background: rgba(108, 99, 255, 0.2);
            box-shadow: 0 0 20px rgba(108, 99, 255, 0.3);
        }

        .tower-btn.disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .tower-btn .tower-icon {
            font-size: 24px;
        }

        .tower-btn .tower-name {
            font-size: 9px;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .tower-btn .tower-cost {
            font-size: 10px;
            color: #ffd700;
            font-weight: 700;
        }

        #startWaveBtn {
            position: absolute;
            bottom: 100px;
            right: 20px;
            padding: 10px 24px;
            border-radius: 8px;
            border: 2px solid #6c63ff;
            background: rgba(108, 99, 255, 0.2);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #startWaveBtn:hover {
            background: rgba(108, 99, 255, 0.4);

        }

        #levelSelect {

            top: 0;
            left: 0;

        }

            color: #888;

        }

        .level-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
        }

        .level-btn {

            height: 80px;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.1);

    </style>
</head>

        function getGridPos(px, py) {
            return { gx: Math.floor(px / GRID), gy: Math.floor(py / GRID) };
        }

        function isPathCell(gx, gy, path) {
            for (let i = 0; i < path.length - 1; i++) {
                let [x1, y1] = path[i];
                let [x2, y2] = path[i + 1];
                let minX = Math.min(x1, x2), maxX = Math.max(x1, x2);
                let minY = Math.min(y1, y2), maxY = Math.max(y1, y2);
                if (gx >= minX && gx <= maxX && gy >= minY && gy <= maxY) return true;
            }
            return false;
        }

        function getPlacementSpots(path, gridW, gridH) {
            let spots = [];
            for (let gy = 0; gy < gridH; gy++) {
                for (let gx = 0; gx < gridW; gx++) {
                    if (!isPathCell(gx, gy, path)) {
                        spots.push({ gx, gy, x: gx * GRID + GRID / 2, y: gy * GRID + GRID / 2 + 70 });
                    }
                }
            }
            return spots;
        }

        function getWaypoints(path) {
            return path.map(([gx, gy]) => ({ x: gx * GRID + GRID / 2, y: gy * GRID + GRID / 2 + 70 }));
        }

        function dist(a, b) {
            return Math.sqrt((a.x - b.x) ** 2 + (a.y - b.y) ** 2);
        }

        function createEnemy(type, hp, speed, reward) {
            let e = {
                type, hp, maxHp: hp, speed, reward,
                x: 0, y: 0, waypointIndex: 0,
                slowTimer: 0, poisonTimer: 0, poisonDmg: 0,
                alive: true, radius: type === 'boss' ? 14 : type === 'tank' ? 11 : 7,
                color: type === 'boss' ? '#ff1744' : type === 'tank' ? '#ff9800' : type === 'fast' ? '#e040fb' : '#4fc3f7'
            };
            return e;
        }

        function createTower(type, gx, gy) {
            let t = TOWER_TYPES[type];
            return {
                type, gx, gy,
                x: gx * GRID + GRID / 2,
                y: gy * GRID + GRID / 2 + 70,
                range: t.range, damage: t.damage,
                fireRate: t.fireRate, cooldown: 0,
                level: 1, angle: 0,
                color: t.color,
                aoe: t.aoe || 0, slow: t.slow || 0, slowDur: t.slowDur || 0,
                chain: t.chain || 0, poison: t.poison || 0, poisonDmg: t.poisonDmg || 0
            };
        }

                speed: t.projSpeed,
                color: t.projColor,
                damage: tower.damage,
                aoe: tower.aoe, slow: tower.slow, slowDur: tower.slowDur,
                chain: tower.chain, chainTargets: [],
                poison: tower.poison, poisonDmg: tower.poisonDmg,
                alive: true, trail: []
            };
        }

        function addParticles(x, y, color, count, speed, life) {
            for (let i = 0; i < count; i++) {
                let angle = Math.random() * Math.PI * 2;
                let spd = Math.random() * speed;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * spd,
                    vy: Math.sin(angle) * spd,
                    life: life || 30,
                    maxLife: life || 30,
                    color,
                    size: Math.random() * 3 + 1
                });
            }
        }

        function startWave() {
            if (waveActive || wave >= maxWaves) return;
            waveActive = true;
            let levelData = LEVELS[currentLevel];
            let waveData = levelData.waves[wave];
            enemiesInWave = waveData.reduce((s, g) => s + g.count, 0);
            enemiesSpawned = 0;
            spawnTimer = 0;
            document.getElementById('startWaveBtn').style.display = 'none';
        }

        function spawnEnemy() {
            let levelData = LEVELS[currentLevel];
            let waveData = levelData.waves[wave];
            let groupIdx = 0, count = 0;
            for (let g of waveData) {
                count += g.count;
                if (enemiesSpawned < count) {
                    let e = createEnemy(g.type, g.hp, g.speed, g.reward);
                    let wp = getWaypoints(levelData.path);
                    e.x = wp[0].x;
                    e.y = wp[0].y;
                    enemies.push(e);
                    enemiesSpawned++;
                    return;
                }
            }
        }

        function updateEnemies() {
            let levelData = LEVELS[currentLevel];
            let waypoints = getWaypoints(levelData.path);

            for (let e of enemies) {
                if (!e.alive) continue;

                if (e.slowTimer > 0) e.slowTimer--;
                if (e.poisonTimer > 0) {
                    e.poisonTimer--;
                    if (e.poisonTimer % 20 === 0) {
                        e.hp -= e.poisonDmg;
                        addParticles(e.x, e.y, '#9c27b0', 3, 2, 15);
                        if (e.hp <= 0) {
                            e.alive = false;
                            gold += e.reward;
                            addParticles(e.x, e.y, e.color, 15, 4, 30);
                            updateUI();
                        }
                    }
                }

                let target = waypoints[e.waypointIndex];
                if (!target) {
                    e.alive = false;
                    lives--;
                    updateUI();
                    if (lives <= 0) gameOver(false);
                    continue;
                }

                let dx = target.x - e.x;
                let dy = target.y - e.y;
                let d = Math.sqrt(dx * dx + dy * dy);
                let spd = e.speed * (e.slowTimer > 0 ? 0.5 : 1);

                if (d < spd) {
                    e.x = target.x;
                    e.y = target.y;
                    e.waypointIndex++;
                } else {
                    e.x += (dx / d) * spd;
                    e.y += (dy / d) * spd;
                }
            }

            enemies = enemies.filter(e => e.alive);
        }

        function updateTowers() {
            for (let t of towers) {
                if (t.cooldown > 0) t.cooldown--;

                let target = null;
                let minDist = Infinity;
                for (let e of enemies) {
                    if (!e.alive) continue;
                    let d = dist(t, e);
                    if (d <= t.range && d < minDist) {
                        minDist = d;
                        target = e;
                    }
                }

                if (target) {
                    t.angle = Math.atan2(target.y - t.y, target.x - t.x);
                    if (t.cooldown <= 0) {
                        t.cooldown = t.fireRate;
                        let p = createProjectile(t, target);
                        projectiles.push(p);
                    }
                }
            }
        }

        function updateProjectiles() {
            for (let p of projectiles) {
                if (!p.alive) continue;

                p.trail.push({ x: p.x, y: p.y });
                if (p.trail.length > 8) p.trail.shift();

                if (p.target && p.target.alive) {
                    let dx = p.target.x - p.x;
                    let dy = p.target.y - p.y;
                    let d = Math.sqrt(dx * dx + dy * dy);

                    if (d < p.speed + p.target.radius) {
                        p.alive = false;
                        hitEnemy(p.target, p);

                        if (p.aoe > 0) {
                            for (let e of enemies) {
                                if (!e.alive || e === p.target) continue;
                                if (dist(p.target, e) < p.aoe) {
                                    hitEnemy(e, { ...p, aoe: 0, chain: 0, poison: 0, poisonDmg: 0, slow: 0, slowDur: 0 });
                                }
                            }
                            addParticles(p.target.x, p.target.y, '#ff5722', 20, 5, 25);
                        }

                        if (p.chain > 0 && p.target.alive) {
                            let chainTargets = [p.target];
                            let lastTarget = p.target;
                            for (let c = 0; c < p.chain; c++) {
                                let best = null, bestD = 120;
                                for (let e of enemies) {
                                    if (!e.alive || chainTargets.includes(e)) continue;
                                    let d = dist(lastTarget, e);
                                    if (d < bestD) { bestD = d; best = e; }
                                }
                                if (best) {
                                    chainTargets.push(best);
                                    hitEnemy(best, { ...p, aoe: 0, chain: 0, poison: 0, poisonDmg: 0, slow: 0, slowDur: 0 });
                                    addParticles(lastTarget.x, lastTarget.y, '#ffeb3b', 5, 3, 15);
                                    lastTarget = best;
                                }
                            }
                        }

                        if (p.slow > 0) {
                            p.target.slowTimer = p.slowDur;
                            addParticles(p.target.x, p.target.y, '#00bcd4', 8, 3, 20);
                        }
                        if (p.poison > 0) {
                            p.target.poisonTimer = p.poison;
                            p.target.poisonDmg = p.poisonDmg;
                            addParticles(p.target.x, p.target.y, '#9c27b0', 8, 3, 20);
                        }
                    } else {
                        p.x += (dx / d) * p.speed;
                        p.y += (dy / d) * p.speed;
                    }
                } else {
                    p.alive = false;
                }
            }
            projectiles = projectiles.filter(p => p.alive);
        }

        function hitEnemy(e, p) {
            e.hp -= p.damage;
            addParticles(e.x, e.y, p.color, 5, 3, 15);
            if (e.hp <= 0 && e.alive) {
                e.alive = false;
                gold += e.reward;
                addParticles(e.x, e.y, e.color, 20, 5, 30);
                updateUI();
            }
        }

        function updateParticles() {
            for (let p of particles) {
                p.x += p.vx;
                p.y += p.vy;
                p.vx *= 0.96;
                p.vy *= 0.96;
                p.life--;
            }
            particles = particles.filter(p => p.life > 0);
        }

        function checkWaveComplete() {
            if (!waveActive) return;
            let levelData = LEVELS[currentLevel];
            let totalEnemies = levelData.waves[wave].reduce((s, g) => s + g.count, 0);
            if (enemiesSpawned >= totalEnemies && enemies.length === 0) {
                waveActive = false;
                wave++;
                if (wave >= maxWaves) {
                    gameOver(true);
                } else {
                    document.getElementById('startWaveBtn').style.display = 'block';
                    gold += 20 + wave * 5;
                    updateUI();
                }
            }
        }

        function gameOver(won) {
            gameState = 'gameover';
            let go = document.getElementById('gameOver');
            go.style.display = 'flex';
            if (won) {
                document.getElementById('goTitle').textContent = '🎉 Victory!';
                document.getElementById('goTitle').style.color = '#4caf50';
                document.getElementById('goMsg').textContent = `Level ${currentLevel + 1} completed!`;
                if (currentLevel + 1 >= unlockedLevels && currentLevel + 1 < LEVELS.length) {
                    unlockedLevels = currentLevel + 2;
                }
                levelStars[currentLevel] = Math.min(3, levelStars[currentLevel] || 0 + 1);
                document.getElementById('nextLevelBtn').style.display = 'block';
            } else {
                document.getElementById('goTitle').textContent = '💀 Defeat';
                document.getElementById('goTitle').style.color = '#ff5252';
                document.getElementById('goMsg').textContent = `Waves survived: ${wave}`;
                document.getElementById('nextLevelBtn').style.display = 'none';
            }
            saveProgress();
        }

        function updateUI() {
            document.getElementById('goldDisplay').textContent = gold;
            document.getElementById('livesDisplay').textContent = lives;
            document.getElementById('waveDisplay').textContent = `${wave}/${maxWaves}`;
            document.getElementById('levelDisplay').textContent = `Level ${currentLevel + 1}`;
            updateTowerButtons();
        }

        function updateTowerButtons() {
            document.querySelectorAll('.tower-btn').forEach(btn => {
                let type = btn.dataset.type;
                let cost = TOWER_TYPES[type].cost;
                btn.classList.toggle('disabled', gold < cost);
            });
        }

        function showLevelSelect() {
            gameState = 'menu';
            document.getElementById('levelSelect').style.display = 'flex';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('upgradePanel').style.display = 'none';
            document.getElementById('startWaveBtn').style.display = 'none';
            buildLevelGrid();
        }

        function buildLevelGrid() {
            let grid = document.getElementById('levelGrid');
            grid.innerHTML = '';
            LEVELS.forEach((lvl, i) => {
                let btn = document.createElement('div');
                btn.className = 'level-btn' + (i + 1 > unlockedLevels ? ' locked' : '') + (levelStars[i] ? ' completed' : '');
                btn.innerHTML = `<span class="lvl-num">${i + 1}</span><span class="lvl-name">${lvl.name}</span>${levelStars[i] ? '<span style="color:#ffd700;font-size:12px;">' + '⭐'.repeat(levelStars[i]) + '</span>' : ''}`;
                if (i + 1 <= unlockedLevels) {
                    btn.onclick = () => loadLevel(i);
                }
                grid.appendChild(btn);
            });
        }

        function loadLevel(idx) {
            currentLevel = idx;
            let lvl = LEVELS[idx];
            gold = lvl.startGold;
            lives = lvl.startLives;
            wave = 0;
            enemies = [];
            towers = [];
            projectiles = [];
            particles = [];
            selectedTowerType = null;
            selectedTower = null;
            waveActive = false;
            gameState = 'playing';
            document.getElementById('levelSelect').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('startWaveBtn').style.display = 'block';
            buildTowerPanel();
            updateUI();
            if (!animFrame) gameLoop();
        }

        function nextLevel() {
            document.getElementById('gameOver').style.display = 'none';
            if (currentLevel + 1 < LEVELS.length) {
                loadLevel(currentLevel + 1);
            } else {
                showLevelSelect();
            }
        }

        function buildTowerPanel() {
            let panel = document.getElementById('towerPanel');
            panel.innerHTML = '';
            Object.entries(TOWER_TYPES).forEach(([type, t]) => {
                let btn = document.createElement('div');
                btn.className = 'tower-btn';
                btn.dataset.type = type;
                btn.innerHTML = `<span class="tower-icon">${t.icon}</span><span class="tower-name">${t.name}</span><span class="tower-cost">$${t.cost}</span>`;
                btn.onclick = () => selectTowerType(type);
                panel.appendChild(btn);
            });
        }

        function selectTowerType(type) {
            selectedTowerType = type;
            selectedTower = null;
            document.getElementById('upgradePanel').style.display = 'none';
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.toggle('selected', b.dataset.type === type));
        }

        function placeTower(gx, gy) {
            if (!selectedTowerType) return false;
            let t = TOWER_TYPES[selectedTowerType];
            if (gold < t.cost) return false;

            let levelData = LEVELS[currentLevel];
            if (isPathCell(gx, gy, levelData.path)) return false;
            if (towers.some(tw => tw.gx === gx && tw.gy === gy)) return false;
            if (gx < 0 || gy < 0 || gx >= levelData.gridW || gy >= levelData.gridH) return false;

            gold -= t.cost;
            towers.push(createTower(selectedTowerType, gx, gy));
            addParticles(gx * GRID + GRID / 2, gy * GRID + GRID / 2 + 70, t.color, 15, 4, 25);
            updateUI();
            return true;
        }

        function showUpgradePanel(tower) {
            selectedTower = tower;
            selectedTowerType = null;
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            let t = TOWER_TYPES[tower.type];
            let panel = document.getElementById('upgradePanel');
            panel.style.display = 'block';
            document.getElementById('upgTitle').textContent = `${t.icon} ${t.name} (Lv.${tower.level})`;
            let info = `Damage: ${tower.damage}\nRange: ${tower.range}\nFire Rate: ${tower.fireRate}`;
            if (tower.slow) info += `\nSlow: ${Math.round(tower.slow * 100)}%`;
            if (tower.chain) info += `\nChain: ${tower.chain}`;
            if (tower.poison) info += `\nPoison: ${tower.poison} ticks`;
            if (tower.aoe) info += `\nAoE: ${tower.aoe}`;
            document.getElementById('upgInfo').textContent = info;

            let upgBtn = document.getElementById('upgBtn');
            if (tower.level <= 3) {
                let cost = t.upgradeCost[tower.level - 1];
                upgBtn.textContent = `Upgrade ($${cost})`;
                upgBtn.style.display = 'block';
                upgBtn.disabled = gold < cost;
                upgBtn.style.opacity = gold < cost ? 0.5 : 1;
            } else {
                upgBtn.style.display = 'none';
            }

            let rect = canvas.getBoundingClientRect();
            let px = tower.x + 30;
            let py = tower.y - 30;
            if (px + 200 > W) px = tower.x - 220;
            if (py < 60) py = 60;
            if (py + 200 > H) py = H - 200;
            panel.style.left = px + 'px';
            panel.style.top = py + 'px';
        }

        function upgradeTower() {
            if (!selectedTower || selectedTower.level > 3) return;
            let t = TOWER_TYPES[selectedTower.type];
            let cost = t.upgradeCost[selectedTower.level - 1];
            if (gold < cost) return;
            gold -= cost;
            selectedTower.level++;
            selectedTower.damage += t.upgradeDmg[selectedTower.level - 2];
            selectedTower.range += t.upgradeRange[selectedTower.level - 2];
            if (t.upgradeSlow && t.upgradeSlow[selectedTower.level - 2]) {
                selectedTower.slow += t.upgradeSlow[selectedTower.level - 2];
            }
            if (t.upgradeChain && t.upgradeChain[selectedTower.level - 2]) {
                selectedTower.chain += t.upgradeChain[selectedTower.level - 2];
            }
            addParticles(selectedTower.x, selectedTower.y, '#ffd700', 20, 4, 30);
            showUpgradePanel(selectedTower);
            updateUI();
        }

        function sellTower() {
            if (!selectedTower) return;
            let t = TOWER_TYPES[selectedTower.type];
            let refund = Math.floor(t.cost * 0.6);
            for (let i = 1; i < selectedTower.level; i++) {
                refund += Math.floor(t.upgradeCost[i - 1] * 0.5);
            }
            gold += refund;
            towers = towers.filter(tw => tw !== selectedTower);
            addParticles(selectedTower.x, selectedTower.y, '#ffd700', 15, 3, 25);
            selectedTower = null;
            document.getElementById('upgradePanel').style.display = 'none';
            updateUI();
        }

        function closeUpgrade() {
            selectedTower = null;
            document.getElementById('upgradePanel').style.display = 'none';
        }

        function saveProgress() {
            try {
                localStorage.setItem('neonDefense', JSON.stringify({ unlockedLevels, levelStars }));
            } catch (e) { }
        }

        function loadProgress() {
            try {
                let data = JSON.parse(localStorage.getItem('neonDefense'));
                if (data) {
                    unlockedLevels = data.unlockedLevels || 1;
                    levelStars = data.levelStars || {};
                }
            } catch (e) { }
        }

        // Drawing functions
        function drawGrid() {
            let levelData = LEVELS[currentLevel];
            for (let gy = 0; gy < levelData.gridH; gy++) {
                for (let gx = 0; gx < levelData.gridW; gx++) {
                    let x = gx * GRID;
                    let y = gy * GRID + 70;
                    if (isPathCell(gx, gy, levelData.path)) {
                        ctx.fillStyle = 'rgba(30,30,60,0.8)';
                        ctx.fillRect(x, y, GRID, GRID);
                        ctx.strokeStyle = 'rgba(60,60,100,0.3)';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(x, y, GRID, GRID);
                    } else {
                        ctx.fillStyle = 'rgba(15,15,35,0.9)';
                        ctx.fillRect(x, y, GRID, GRID);
                        ctx.strokeStyle = 'rgba(40,40,80,0.2)';
                        ctx.lineWidth = 0.5;
                        ctx.strokeRect(x, y, GRID, GRID);
                    }
                }
            }
        }

        function drawPath() {
            let levelData = LEVELS[currentLevel];
            let waypoints = getWaypoints(levelData.path);

            // Glow
            ctx.save();
            ctx.shadowColor = '#6c63ff';
            ctx.shadowBlur = 15;
            ctx.strokeStyle = 'rgba(108,99,255,0.3)';
            ctx.lineWidth = GRID * 0.8;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            for (let i = 1; i < waypoints.length; i++) {
                ctx.lineTo(waypoints[i].x, waypoints[i].y);
            }
            ctx.stroke();
            ctx.restore();

            // Path
            ctx.strokeStyle = 'rgba(50,50,90,0.6)';
            ctx.lineWidth = GRID * 0.6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            for (let i = 1; i < waypoints.length; i++) {
                ctx.lineTo(waypoints[i].x, waypoints[i].y);
            }
            ctx.stroke();

            // Dashed center line
            ctx.strokeStyle = 'rgba(108,99,255,0.15)';
            ctx.lineWidth = 2;
            ctx.setLineDash([8, 8]);
            ctx.beginPath();
            ctx.moveTo(waypoints[0].x, waypoints[0].y);
            for (let i = 1; i < waypoints.length; i++) {
                ctx.lineTo(waypoints[i].x, waypoints[i].y);
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // Start marker
            ctx.fillStyle = '#4caf50';
            ctx.beginPath();
            ctx.arc(waypoints[0].x, waypoints[0].y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 12px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('▶', waypoints[0].x, waypoints[0].y + 4);

            // End marker
            let end = waypoints[waypoints.length - 1];
            ctx.fillStyle = '#ff5252';
            ctx.beginPath();
            ctx.arc(end.x, end.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#fff';
            ctx.fillText('✕', end.x, end.y + 4);
        }

        function drawEnemies() {
            for (let e of enemies) {
                if (!e.alive) continue;

                // Shadow
                ctx.fillStyle = 'rgba(0,0,0,0.3)';
                ctx.beginPath();
                ctx.ellipse(e.x + 2, e.y + e.radius + 2, e.radius, e.radius * 0.4, 0, 0, Math.PI * 2);
                ctx.fill();

                // Body
                ctx.save();
                ctx.shadowColor = e.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = e.color;
                ctx.beginPath();
                if (e.type === 'tank') {
                    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                } else if (e.type === 'boss') {
                    // Hexagon for boss
                    for (let i = 0; i < 6; i++) {
                        let a = (Math.PI * 2 / 6) * i - Math.PI / 2;
                        let px = e.x + Math.cos(a) * e.radius;
                        let py = e.y + Math.sin(a) * e.radius;
                        i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                } else {
                    ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2);
                }
                ctx.fill();
                ctx.restore();

                // Inner highlight
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.beginPath();
                ctx.arc(e.x - e.radius * 0.25, e.y - e.radius * 0.25, e.radius * 0.4, 0, Math.PI * 2);
                ctx.fill();

                // Slow indicator
                if (e.slowTimer > 0) {
                    ctx.strokeStyle = 'rgba(0,188,212,0.6)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius + 4, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // Poison indicator
                if (e.poisonTimer > 0) {
                    ctx.strokeStyle = 'rgba(156,39,176,0.6)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(e.x, e.y, e.radius + 6, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // HP bar
                let barW = e.radius * 2.5;
                let barH = 4;
                let barX = e.x - barW / 2;
                let barY = e.y - e.radius - 10;
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX - 1, barY - 1, barW + 2, barH + 2);
                let hpRatio = Math.max(0, e.hp / e.maxHp);
                let hpColor = hpRatio > 0.5 ? '#4caf50' : hpRatio > 0.25 ? '#ff9800' : '#f44336';
                ctx.fillStyle = hpColor;
                ctx.fillRect(barX, barY, barW * hpRatio, barH);
            }
        }

        function drawTowers() {
            for (let t of towers) {
                let tt = TOWER_TYPES[t.type];

                // Range circle (if selected)
                if (selectedTower === t) {
                    ctx.strokeStyle = 'rgba(108,99,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(t.x, t.y, t.range, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(108,99,255,0.05)';
                    ctx.fill();
                }

                // Base
                ctx.save();
                ctx.shadowColor = t.color;
                ctx.shadowBlur = 8;

                // Tower base
                ctx.fillStyle = 'rgba(20,20,40,0.9)';
                ctx.strokeStyle = t.color;
                ctx.lineWidth = 2;
                let size = GRID * 0.4;
                ctx.beginPath();
                ctx.arc(t.x, t.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Tower body
                ctx.fillStyle = t.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, size * 0.6, 0, Math.PI * 2);
                ctx.fill();

                // Turret
                ctx.save();
                ctx.translate(t.x, t.y);
                ctx.rotate(t.angle);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, -2, size * 1.2, 4);
                ctx.restore();

                // Level indicator
                if (t.level > 1) {
                    ctx.fillStyle = '#ffd700';
                    ctx.font = 'bold 9px sans-serif';
                    ctx.textAlign = 'center';
                    ctx.fillText('★'.repeat(t.level - 1), t.x, t.y + size + 12);
                }

                ctx.restore();
            }
        }

        function drawProjectiles() {
            for (let p of projectiles) {
                if (!p.alive) continue;

                // Trail
                for (let i = 0; i < p.trail.length; i++) {
                    let alpha = (i / p.trail.length) * 0.5;
                    ctx.fillStyle = p.color.replace(')', `,${alpha})`).replace('rgb', 'rgba');
                    let s = (i / p.trail.length) * 4;
                    ctx.beginPath();
                    ctx.arc(p.trail[i].x, p.trail[i].y, s, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Projectile
                ctx.save();
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 10;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.aoe ? 5 : 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawParticles() {
            for (let p of particles) {
                let alpha = p.life / p.maxLife;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.globalAlpha = 1;
        }

        function drawPlacementPreview() {
            if (!selectedTowerType) return;
            let mx = mousePos.x, my = mousePos.y;
            if (my < 70) return;
            let gx = Math.floor(mx / GRID);
            let gy = Math.floor((my - 70) / GRID);
            let levelData = LEVELS[currentLevel];

            if (gx < 0 || gy < 0 || gx >= levelData.gridW || gy >= levelData.gridH) return;

            let valid = !isPathCell(gx, gy, levelData.path) &&
                !towers.some(t => t.gx === gx && t.gy === gy) &&
                gold >= TOWER_TYPES[selectedTowerType].cost;

            let px = gx * GRID;
            let py = gy * GRID + 70;

            ctx.fillStyle = valid ? 'rgba(76,175,80,0.3)' : 'rgba(244,67,54,0.3)';
            ctx.fillRect(px, py, GRID, GRID);
            ctx.strokeStyle = valid ? 'rgba(76,175,80,0.6)' : 'rgba(244,67,54,0.6)';
            ctx.lineWidth = 2;
            ctx.strokeRect(px, py, GRID, GRID);

            // Range preview
            if (valid) {
                let cx = px + GRID / 2;
                let cy = py + GRID / 2;
                let range = TOWER_TYPES[selectedTowerType].range;
                ctx.strokeStyle = 'rgba(108,99,255,0.2)';
                ctx.lineWidth = 1;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(cx, cy, range, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        let mousePos = { x: 0, y: 0 };

        canvas.addEventListener('mousemove', (e) => {
            let rect = canvas.getBoundingClientRect();
            mousePos.x = (e.clientX - rect.left) * (W / rect.width);
            mousePos.y = (e.clientY - rect.top) * (H / rect.height);
        });

        canvas.addEventListener('click', (e) => {
            if (gameState !== 'playing') return;
            let rect = canvas.getBoundingClientRect();
            let mx = (e.clientX - rect.left) * (W / rect.width);
            let my = (e.clientY - rect.top) * (H / rect.height);

            if (my < 70 || my > H - 90) return;

            let gx = Math.floor(mx / GRID);
            let gy = Math.floor((my - 70) / GRID);

            // Check if clicking on existing tower
            let clickedTower = towers.find(t => t.gx === gx && t.gy === gy);
            if (clickedTower) {
                showUpgradePanel(clickedTower);
                return;
            }

            // Place tower
            if (selectedTowerType) {
                if (placeTower(gx, gy)) {
                    // Keep type selected for multiple placement
                }
            }
        });

        canvas.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            selectedTowerType = null;
            selectedTower = null;
            document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
            document.getElementById('upgradePanel').style.display = 'none';
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                selectedTowerType = null;
                selectedTower = null;
                document.querySelectorAll('.tower-btn').forEach(b => b.classList.remove('selected'));
                document.getElementById('upgradePanel').style.display = 'none';
            }
            if (e.key === ' ' && gameState === 'playing') {
                e.preventDefault();
                startWave();
            }
        });

        function drawBackground() {
            // Gradient background
            let grad = ctx.createLinearGradient(0, 0, 0, H);
            grad.addColorStop(0, '#0a0a1a');
            grad.addColorStop(1, '#0f0f2a');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, W, H);

            // Subtle grid pattern
            ctx.strokeStyle = 'rgba(40,40,80,0.1)';
            ctx.lineWidth = 0.5;
            for (let x = 0; x < W; x += GRID) {
                ctx.beginPath();
                ctx.moveTo(x, 70);
                ctx.lineTo(x, H - 90);
                ctx.stroke();
            }
            for (let y = 70; y < H - 90; y += GRID) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(W, y);
                ctx.stroke();
            }
        }

        function drawSpawnIndicator() {
            if (!waveActive) return;
            let levelData = LEVELS[currentLevel];
            let waypoints = getWaypoints(levelData.path);
            let pulse = Math.sin(Date.now() / 200) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(76,175,80,${pulse * 0.5})`;
            ctx.beginPath();
            ctx.arc(waypoints[0].x, waypoints[0].y, 18, 0, Math.PI * 2);
            ctx.fill();
        }

        function gameLoop() {
            if (gameState === 'playing') {
                // Spawn enemies
                if (waveActive && enemiesSpawned < enemiesInWave) {
                    spawnTimer++;
                    if (spawnTimer >= 25) {
                        spawnTimer = 0;
                        spawnEnemy();
                    }
                }

                updateEnemies();
                updateTowers();
                updateProjectiles();
                updateParticles();
                checkWaveComplete();
            }

            // Draw
            drawBackground();
            drawGrid();
            drawPath();
            drawSpawnIndicator();
            drawPlacementPreview();
            drawTowers();
            drawEnemies();
            drawProjectiles();
            drawParticles();

            animFrame = requestAnimationFrame(gameLoop);
        }

        // Init
        loadProgress();
        buildLevelGrid();
        gameLoop();
    </script>
</body>

</html>
