<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette Pro | Professional Color Scheme Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .color-card { transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        .copy-feedback { animation: fadeUp 1.5s ease-out forwards; }
        @keyframes fadeUp {
            0% { opacity: 0; transform: translateY(0); }
            20% { opacity: 1; transform: translateY(-20px); }
            80% { opacity: 1; transform: translateY(-25px); }
            100% { opacity: 0; transform: translateY(-30px); }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 overflow-hidden h-screen flex flex-col">

    <!-- Header -->
    <header class="h-16 border-b bg-white/80 backdrop-blur-md flex items-center justify-between px-6 z-20">
        <div class="flex items-center gap-2">
            <div class="w-8 h-8 bg-gradient-to-tr from-indigo-600 to-violet-500 rounded-lg flex items-center justify-center shadow-lg shadow-indigo-200">
                <i data-lucide="palette" class="text-white w-5 h-5"></i>
            </div>
            <h1 class="text-xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-slate-900 to-slate-600">
                Color Palette Pro
            </h1>
        </div>

        <div class="flex items-center gap-4">
            <div class="hidden md:flex items-center bg-slate-100 rounded-full px-3 py-1 border">
                <span class="text-xs font-medium text-slate-500 mr-2 uppercase tracking-wider">Mode:</span>
                <select id="harmonyMode" class="bg-transparent text-sm font-semibold focus:outline-none cursor-pointer pr-2">
                    <option value="analogous">Analogous</option>
                    <option value="monochromatic">Monochromatic</option>
                    <option value="complementary">Complementary</option>
                    <option value="triadic">Triadic</option>
                    <option value="tetradic">Tetradic</option>
                    <option value="random">Random Mix</option>
                </select>
            </div>
            <button id="generateBtn" class="flex items-center gap-2 bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-full font-medium transition-all active:scale-95 shadow-lg shadow-slate-200">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                Generate
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main id="paletteContainer" class="flex-1 flex flex-col md:flex-row w-full overflow-hidden">
        <!-- Color Columns will be injected here by JS -->
    </main>

    <!-- Footer / Instructions -->
    <footer class="h-12 bg-white border-t flex items-center justify-between px-6 text-[10px] md:text-xs text-slate-400 uppercase tracking-widest font-medium">
        <div>Press <kbd class="bg-slate-100 px-1.5 py-0.5 rounded border text-slate-600">Spacebar</kbd> to regenerate</div>
        <div class="hidden sm:block italic">Click color to copy • Lock icon to keep color</div>
        <div id="statusMsg" class="text-indigo-500 font-bold opacity-0 transition-opacity">Copied!</div>
    </footer>

    <!-- Toast Notification Template -->
    <div id="toastContainer" class="fixed bottom-20 left-1/2 -translate-x-1/2 pointer-events-none z-50"></div>

    <script>
        // --- Configuration & State ---
        let colors = [];
        const NUM_COLORS = 5;
        const container = document.getElementById('paletteContainer');
        const harmonySelect = document.getElementById('harmonyMode');
        const generateBtn = document.getElementById('generateBtn');
        const statusMsg = document.getElementById('statusMsg');

        // --- Color Math Logic ---
        const hslToHex = (h, s, l) => {
            l /= 100;
            const a = s * Math.min(l, 1 - l) / 100;
            const f = n => {
                const k = (n + h / 30) % 12;
                const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
                return Math.round(255 * color).toString(16).padStart(2, '0');
            };
            return `#${f(0)}${f(8)}${f(4)}`.toUpperCase();
        };

        const generateScheme = (mode) => {
            const baseHue = Math.floor(Math.random() * 360);
            let newColors = [];

            for (let i = 0; i < NUM_COLORS; i++) {
                // If color is locked, keep it
                if (colors[i] && colors[i].locked) {
                    newColors.push(colors[i]);
                    continue;
                }

                let h, s, l;
                s = 60 + Math.random() * 30; // Saturation 60-90%
                l = 45 + Math.random() * 25; // Lightness 45-70%

                switch (mode) {
                    case 'analogous':
                        h = (baseHue + (i * 15)) % 360;
                        break;
                    case 'monochromatic':
                        h = baseHue;
                        l = 20 + (i * (70 / NUM_COLORS));
                        s = 40 + (i * 10);
                        break;
                    case 'complementary':
                        h = i % 2 === 0 ? baseHue : (baseHue + 180) % 360;
                        l = 30 + (i * 12);
                        break;
                    case 'triadic':
                        const triadSteps = [0, 120, 240, 0, 120];
                        h = (baseHue + triadSteps[i]) % 360;
                        break;
                    case 'tetradic':
                        const tetraSteps = [0, 90, 180, 270, 0];
                        h = (baseHue + tetraSteps[i]) % 360;
                        break;
                    default: // random
                        h = Math.floor(Math.random() * 360);
                }

                newColors.push({
                    hex: hslToHex(h, s, l),
                    locked: false
                });
            }
            return newColors;
        };

        // --- UI Rendering ---
        const render = () => {
            container.innerHTML = '';
            colors.forEach((color, index) => {
                const col = document.createElement('div');
                col.className = `color-card flex-1 flex flex-col items-center justify-end pb-20 group relative`;
                col.style.backgroundColor = color.hex;

                // Determine text color based on lightness
                const luminance = parseInt(color.hex.substring(1,3), 16) * 0.299 + 
                                 parseInt(color.hex.substring(3,5), 16) * 0.587 + 
                                 parseInt(color.hex.substring(5,7), 16) * 0.114;
                const textColor = luminance > 128 ? 'text-slate-900' : 'text-white';

                col.innerHTML = `
                    <div class="opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col items-center gap-6 mb-10">
                        <button onclick="toggleLock(${index})" class="p-3 rounded-full hover:bg-black/10 transition-colors ${textColor}">
                            <i data-lucide="${color.locked ? 'lock' : 'unlock'}" class="w-6 h-6"></i>
                        </button>
                    </div>
                    <div class="flex flex-col items-center gap-2 cursor-pointer" onclick="copyColor('${color.hex}')">
                        <span class="text-xl md:text-3xl font-bold tracking-tight ${textColor}">${color.hex}</span>
                        <span class="text-[10px] uppercase tracking-widest opacity-60 ${textColor}">Click to copy</span>
                    </div>
                `;
                container.appendChild(col);
            });
            lucide.createIcons();
        };

        // --- Actions ---
        window.toggleLock = (index) => {
            colors[index].locked = !colors[index].locked;
            render();
        };

        window.copyColor = (hex) => {
            navigator.clipboard.writeText(hex);
            
            // Visual Feedback
            statusMsg.style.opacity = '1';
            setTimeout(() => statusMsg.style.opacity = '0', 1500);

            // Create Floating Text
            const toast = document.createElement('div');
            toast.className = 'copy-feedback bg-slate-900 text-white px-4 py-2 rounded-lg shadow-xl text-sm font-medium mb-2';
            toast.innerText = `Copied ${hex}`;
            document.getElementById('toastContainer').appendChild(toast);
            setTimeout(() => toast.remove(), 1500);
        };

        const updatePalette = () => {
            colors = generateScheme(harmonySelect.value);
            render();
        };

        // --- Initialization & Listeners ---
        generateBtn.addEventListener('click', updatePalette);
        
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault(); // Prevent scrolling
                updatePalette();
            }
        });

        // Initial Load
        colors = Array(NUM_COLORS).fill(null).map(() => ({ hex: '#ffffff', locked: false }));
        updatePalette();
    </script>
</body>
</html>
