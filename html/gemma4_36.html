<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SonicWave // Pro Audio Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            overflow: hidden;
            margin: 0;
        }
        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-text {
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.5);
        }
        canvas {
            display: block;
        }
        input[type="range"] {
            accent-color: #38bdf8;
        }
        .start-overlay {
            transition: opacity 0.8s ease, visibility 0.8s;
        }
    </style>
</head>
<body class="text-slate-200">

    <!-- Start Overlay -->
    <div id="overlay" class="start-overlay fixed inset-0 z-50 flex items-center justify-center bg-slate-950">
        <div class="text-center p-8">
            <h1 class="text-6xl font-extrabold tracking-tighter mb-4 glow-text text-sky-400">SONICWAVE</h1>
            <p class="text-slate-400 mb-8 max-w-md mx-auto font-light">Experience your sound through real-time frequency analysis. Requires microphone access.</p>
            <button id="startBtn" class="px-10 py-4 bg-sky-500 hover:bg-sky-400 text-white rounded-full font-semibold transition-all transform hover:scale-105 active:scale-95 shadow-[0_0_30px_rgba(14,165,233,0.4)]">
                Initialize Visualizer
            </button>
        </div>
    </div>

    <!-- Main Canvas -->
    <canvas id="visualizer" class="fixed inset-0 w-full h-full"></canvas>

    <!-- UI Controls -->
    <div id="ui" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-40 w-[90%] max-w-3xl opacity-0 transition-opacity duration-1000 pointer-events-none">
        <div class="glass rounded-3xl p-6 flex flex-wrap items-center justify-between gap-6 shadow-2xl">
            
            <!-- Sensitivity & Color Controls -->
            <div class="flex items-center gap-8">
                <div class="flex flex-col gap-1">
                    <label class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Sensitivity</label>
                    <input type="range" id="sensitivity" min="1" max="5" step="0.1" value="2" class="w-32 h-1.5 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                </div>

                <div class="flex flex-col gap-1">
                    <label class="text-[10px] uppercase tracking-widest text-slate-400 font-bold">Theme</label>
                    <select id="theme" class="bg-transparent text-sm outline-none cursor-pointer hover:text-sky-400 transition-colors">
                        <option value="sky" class="bg-slate-900">Sky Blue</option>
                        <option value="rose" class="bg-slate-900">Cyber Rose</option>
                        <option value="emerald" class="bg-slate-900">Emerald City</option>
                        <option value="sunset" class="bg-slate-900">Sunset Gold</option>
                    </select>
                </div>
            </div>

            <!-- Status Indicator -->
            <div class="flex items-center gap-3">
                <div id="statusDot" class="w-2 h-2 rounded-full bg-sky-500 animate-pulse"></div>
                <span class="text-xs font-medium tracking-wider text-slate-400 uppercase">Live Input</span>
            </div>

            <!-- Visualizer Mode Toggle -->
            <div class="flex items-center gap-2">
                 <button id="modeBtn" class="text-[10px] px-3 py-1.5 rounded border border-slate-700 hover:bg-slate-800 transition-all uppercase tracking-widest font-bold">
                    Bars Mode
                </button>
            </div>
        </div>
    </div>

    <script>
        /** 
         * SONICWAVE CORE LOGIC
         * Using Web Audio API & Canvas 2D
         */

        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('startBtn');
        const ui = document.getElementById('ui');
        const sensitivitySlider = document.getElementById('sensitivity');
        const themeSelect = document.getElementById('theme');
        const modeBtn = document.getElementById('modeBtn');

        let audioContext, analyser, source, dataArray;
        let animationId;
        let isBarsMode = true;
        
        const themes = {
            sky: { primary: '#38bdf8', secondary: '#0ea5e9', accent: '#7dd3fc' },
            rose: { primary: '#f43f5e', secondary: '#e11d48', accent: '#fb7185' },
            emerald: { primary: '#10b981', secondary: '#059669', accent: '#34d399' },
            sunset: { primary: '#f59e0b', secondary: '#d97706', accent: '#fbbf24' }
        };

        // Initialize Canvas Size
        function resize() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
        }
        window.addEventListener('resize', resize);
        resize();

        // Audio Setup
        async function initAudio() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioContext.createAnalyser();
                source = audioContext.createMediaStreamSource(stream);
                
                // Set FFT size for detail level
                analyser.fftSize = 512; 
                const bufferLength = analyser.frequencyBinCount;
                dataArray = new Uint8Array(bufferLength);
                
                source.connect(analyser);

                // UI Transition
                overlay.style.opacity = '0';
                setTimeout(() => {
                    overlay.style.visibility = 'hidden';
                    ui.classList.remove('pointer-events-none');
                    ui.classList.add('opacity-100');
                }, 800);

                draw();
            } catch (err) {
                alert("Microphone access is required for this visualizer to work.");
                console.error(err);
            }
        }

        function draw() {
            animationId = requestAnimationFrame(draw);
            analyser.getByteFrequencyData(dataArray);

            const width = window.innerWidth;
            const height = window.innerHeight;
            const currentTheme = themes[themeSelect.value];
            const sensitivity = parseFloat(sensitivitySlider.value);

            // Clear canvas with a slight trail effect (motion blur)
            ctx.fillStyle = 'rgba(2, 6, 23, 0.15)';
            ctx.fillRect(0, 0, width, height);

            if (isBarsMode) {
                drawBars(width, height, dataArray, currentTheme, sensitivity);
            } else {
                drawCircle(width, height, dataArray, currentTheme, sensitivity);
            }
        }

        function drawBars(w, h, data, theme, sens) {
            const barWidth = (w / data.length) * 2.5;
            let x = 0;

            for (let i = 0; i < data.length; i++) {
                // Scale amplitude based on sensitivity
                const barHeight = (data[i] * sens);
                
                // Create gradient for each bar
                const grad = ctx.createLinearGradient(x, h, x, h - barHeight);
                grad.addColorStop(0, theme.secondary);
                grad.addColorStop(1, theme.primary);

                ctx.fillStyle = grad;
                
                // Draw Rounded Rectangle (Bar)
                const radius = 4;
                drawRoundedRect(ctx, x, h - barHeight, barWidth - 2, barHeight, radius);
                
                // Add a glow tip
                ctx.shadowBlur = 15;
                ctx.shadowColor = theme.primary;
                
                x += barWidth;
            }
            ctx.shadowBlur = 0; // Reset shadow for performance
        }

        function drawCircle(w, h, data, theme, sens) {
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = Math.min(w, h) * 0.2;

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.stroke();

            for (let i = 0; i < data.length; i++) {
                const angle = (i / data.length) * Math.PI * 2;
                const amplitude = data[i] * (sens * 0.4);
                const x1 = centerX + Math.cos(angle) * radius;
                const y1 = centerY + Math.sin(angle) * radius;
                const x2 = centerX + Math.cos(angle) * (radius + amplitude);
                const y2 = centerY + Math.sin(angle) * (radius + amplitude);

                ctx.beginPath();
                ctx.moveTo(x1, y1);
                ctx.lineTo(x2, y2);
                ctx.lineWidth = 3;
                ctx.strokeStyle = i % 2 === 0 ? theme.primary : theme.accent;
                ctx.lineCap = 'round';
                ctx.stroke();
            }
        }

        // Helper: Rounded Rectangle for cleaner aesthetics
        function drawRoundedRect(ctx, x, y, width, height, radius) {
            if (height < 1) return; // Don't draw if too small
            ctx.beginPath();
            ctx.moveTo(x + radius, y);
            ctx.lineTo(x + width - radius, y);
            ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
            ctx.lineTo(x + width, y + height);
            ctx.lineTo(x, y + height);
            ctx.lineTo(x, y + radius);
            ctx.quadraticCurveTo(x, y, x + radius, y);
            ctx.closePath();
            ctx.fill();
        }

        // Event Listeners
        startBtn.addEventListener('click', () => {
            initAudio();
        });

        modeBtn.addEventListener('click', () => {
            isBarsMode = !isBarsMode;
            modeBtn.innerText = isBarsMode ? 'Bars Mode' : 'Circle Mode';
        });

    </script>
</body>
</html>
