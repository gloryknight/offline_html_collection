<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinding Visualizer Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        
        .grid-container {
            display: grid;
            gap: 1px;
            background-color: #334155;
            border: 2px solid #334155;
            user-select: none;
        }

        .cell {
            width: 25px;
            height: 25px;
            background-color: #1e293b;
            transition: background-color 0.2s ease;
        }

        .cell.wall { background-color: #475569; animation: wallPop 0.2s ease-out; }
        .cell.start { background-color: #10b981; box-shadow: 0 0 15px #10b981; }
        .cell.end { background-color: #ef4444; box-shadow: 0 0 15px #ef4444; }
        
        .cell.visited {
            animation: visitedAnim 0.5s ease-out forwards;
        }

        .cell.path {
            animation: pathAnim 0.5s ease-out forwards;
        }

        @keyframes wallPop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }

        @keyframes visitedAnim {
            0% { transform: scale(0.3); background-color: #38bdf8; border-radius: 100%; }
            50% { background-color: #818cf8; }
            100% { transform: scale(1); background-color: #1e293b; }
        }

        @keyframes pathAnim {
            0% { transform: scale(0.6); background-color: #fbbf24; }
            100% { transform: scale(1); background-color: #fbbf24; box-shadow: 0 0 10px #fbbf24; }
        }

        .controls-panel {
            backdrop-filter: blur(8px);
            background-color: rgba(30, 41, 59, 0.7);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Header / Controls -->
    <header class="controls-panel border-b border-slate-700 p-4 z-10 shadow-2xl">
        <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold tracking-tight">Pathfinder<span class="text-indigo-400">Visualizer</span></h1>
            </div>

            <div class="flex flex-wrap items-center gap-4 text-sm">
                <div class="flex flex-col">
                    <label class="text-[10px] uppercase font-bold text-slate-400 mb-1">Algorithm</label>
                    <select id="algoSelect" class="bg-slate-800 border border-slate-600 rounded px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-all cursor-pointer">
                        <option value="dijkstra">Dijkstra's Algorithm</option>
                        <option value="astar">A* Search</option>
                    </select>
                </div>

                <div class="flex flex-col">
                    <label class="text-[10px] uppercase font-bold text-slate-400 mb-1">Speed</label>
                    <input type="range" id="speedRange" min="1" max="50" value="25" class="accent-indigo-500 cursor-pointer">
                </div>

                <div class="flex items-end gap-2 h-full pt-4">
                    <button id="startBtn" class="bg-indigo-600 hover:bg-indigo-500 text-white px-5 py-1.5 rounded font-semibold transition-all shadow-lg active:scale-95">Visualize</button>
                    <button id="clearWallsBtn" class="bg-slate-700 hover:bg-slate-600 text-white px-4 py-1.5 rounded font-medium transition-all">Clear Walls</button>
                    <button id="resetBtn" class="bg-rose-900/50 hover:bg-rose-800 text-rose-200 px-4 py-1.5 rounded font-medium transition-all border border-rose-700">Reset Grid</button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Area -->
    <main class="flex-grow relative overflow-auto p-8 flex justify-center items-start bg-[#0f172a]">
        <div id="grid" class="grid-container shadow-2xl"></div>

        <!-- Legend Overlay -->
        <div class="fixed bottom-6 left-6 controls-panel border border-slate-700 p-4 rounded-xl text-xs space-y-2 pointer-events-none">
            <p class="font-bold text-slate-400 mb-2 uppercase tracking-widest">Legend</p>
            <div class="flex items-center gap-3"><span class="w-4 h-4 bg-emerald-500 rounded shadow-[0_0_8px_#10b981]"></span> Start Node</div>
            <div class="flex items-center gap-3"><span class="w-4 h-4 bg-rose-500 rounded shadow-[0_0_8px_#ef4444]"></span> End Node</div>
            <div class="flex items-center gap-3"><span class="w-4 h-4 bg-slate-600 rounded"></span> Wall</div>
            <div class="flex items-center gap-3"><span class="w-4 h-4 bg-[#818cf8] rounded"></span> Visited</div>
            <div class="flex items-center gap-3"><span class="w-4 h-4 bg-yellow-400 rounded shadow-[0_0_8px_#fbbf24]"></span> Path</div>
        </div>

        <!-- Stats Overlay -->
        <div id="stats" class="fixed bottom-6 right-6 controls-panel border border-slate-700 p-4 rounded-xl text-sm hidden">
            <p class="text-slate-400">Path Length: <span id="pathLen" class="text-white font-mono">0</span></p>
            <p class="text-slate-400">Nodes Visited: <span id="visitCount" class="text-white font-mono">0</span></p>
        </div>
    </main>

    <script>
        // Configuration & State
        const ROWS = 25;
        const COLS = 50;
        let gridData = [];
        let startNode = { r: 12, c: 10 };
        let endNode = { r: 12, c: 39 };
        let isMouseDown = false;
        let isDraggingStart = false;
        let isDraggingEnd = false;
        let isVisualizing = false;

        const gridEl = document.getElementById('grid');
        const startBtn = document.getElementById('startBtn');
        const clearWallsBtn = document.getElementById('clearWallsBtn');
        const resetBtn = document.getElementById('resetBtn');
        const algoSelect = document.getElementById('algoSelect');
        const speedRange = document.getElementById('speedRange');
        const statsPanel = document.getElementById('stats');

        // Initialization
        function initGrid() {
            gridEl.style.gridTemplateColumns = `repeat(${COLS}, 25px)`;
            gridEl.innerHTML = '';
            gridData = [];

            for (let r = 0; r < ROWS; r++) {
                const rowArr = [];
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.dataset.r = r;
                    cell.dataset.c = c;

                    // Event Listeners
                    cell.addEventListener('mousedown', (e) => handleMouseDown(r, c, e));
                    cell.addEventListener('mouseenter', () => handleMouseEnter(r, c));
                    cell.addEventListener('mouseup', handleMouseUp);

                    gridEl.appendChild(cell);
                    rowArr.push({
                        r, c, 
                        isWall: false, 
                        el: cell,
                        distance: Infinity,
                        heuristic: 0,
                        parent: null,
                        visited: false
                    });
                }
                gridData.push(rowArr);
            }
            updateSpecialNodes();
        }

        function updateSpecialNodes() {
            // Reset previous positions if they exist in the data (not strictly needed due to full reset)
            gridData[startNode.r][startNode.c].el.classList.add('start');
            gridData[endNode.r][endNode.c].el.classList.add('end');
        }

        // Interaction Handlers
        function handleMouseDown(r, c, e) {
            if (isVisualizing) return;
            isMouseDown = true;
            if (r === startNode.r && c === startNode.c) {
                isDraggingStart = true;
            } else if (r === endNode.r && c === endNode.c) {
                isDraggingEnd = true;
            } else {
                toggleWall(r, c);
            }
        }

        function handleMouseEnter(r, c) {
            if (!isMouseDown || isVisualizing) return;
            if (isDraggingStart) {
                moveSpecialNode(r, c, 'start');
            } else if (isDraggingEnd) {
                moveSpecialNode(r, c, 'end');
            } else {
                toggleWall(r, c);
            }
        }

        function handleMouseUp() {
            isMouseDown = false;
            isDraggingStart = false;
            isDraggingEnd = false;
        }

        function toggleWall(r, c) {
            if ((r === startNode.r && c === startNode.c) || (r === endNode.r && c === endNode.c)) return;
            gridData[r][c].isWall = !gridData[r][c].isWall;
            gridData[r][c].el.classList.toggle('wall');
        }

        function moveSpecialNode(r, c, type) {
            if (gridData[r][c].isWall) return;
            
            // Clear old node
            const oldPos = type === 'start' ? startNode : endNode;
            gridData[oldPos.r][oldPos.c].el.classList.remove(type);

            // Set new node
            if (type === 'start') startNode = { r, c };
            else endNode = { r, c };
            
            gridData[r][c].el.classList.add(type);
        }

        // Algorithms
        async function visualize() {
            if (isVisualizing) return;
            resetSearchState();
            isVisualizing = true;
            startBtn.disabled = true;
            statsPanel.classList.remove('hidden');

            const algo = algoSelect.value;
            let visitedNodesInOrder = [];
            
            if (algo === 'dijkstra') {
                visitedNodesInOrder = dijkstra();
            } else {
                visitedNodesInOrder = astar();
            }

            // Animation phase
            const delay = 51 - speedRange.value;
            let visitCount = 0;

            for (let i = 0; i < visitedNodesInOrder.length; i++) {
                const node = visitedNodesInOrder[i];
                if (!(node.r === startNode.r && node.c === startNode.c) && 
                    !(node.r === endNode.r && node.c === endNode.c)) {
                    node.el.classList.add('visited');
                }
                visitCount++;
                document.getElementById('visitCount').innerText = visitCount;
                await new Promise(res => setTimeout(res, delay));
            }

            // Path reconstruction phase
            const path = getPath();
            document.getElementById('pathLen').innerText = path.length;
            for (let node of path) {
                if (!(node.r === startNode.r && node.c === startNode.c) && 
                    !(node.r === endNode.r && node.c === endNode.c)) {
                    node.el.classList.add('path');
                    await new Promise(res => setTimeout(res, delay * 2));
                }
            }

            isVisualizing = false;
            startBtn.disabled = false;
        }

        function dijkstra() {
            const visitedInOrder = [];
            const unvisitedNodes = [];
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    gridData[r][c].distance = Infinity;
                    gridData[r][c].visited = false;
                    gridData[r][c].parent = null;
                    unvisitedNodes.push(gridData[r][c]);
                }
            }

            gridData[startNode.r][startNode.c].distance = 0;

            while (unvisitedNodes.length > 0) {
                unvisitedNodes.sort((a, b) => a.distance - b.distance);
                const closestNode = unvisitedNodes.shift();

                if (closestNode.isWall) continue;
                if (closestNode.distance === Infinity) break;

                closestNode.visited = true;
                visitedInOrder.push(closestNode);

                if (closestNode.r === endNode.r && closestNode.c === endNode.c) return visitedInOrder;

                const neighbors = getNeighbors(closestNode);
                for (const neighbor of neighbors) {
                    const newDist = closestNode.distance + 1;
                    if (newDist < neighbor.distance) {
                        neighbor.distance = newDist;
                        neighbor.parent = closestNode;
                    }
                }
            }
            return visitedInOrder;
        }

        function astar() {
            const visitedInOrder = [];
            const openSet = [gridData[startNode.r][startNode.c]];
            
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    gridData[r][c].distance = Infinity; // This is gScore
                    gridData[r][c].heuristic = 0;       // This is hScore
                    gridData[r][c].visited = false;
                    gridData[r][c].parent = null;
                }
            }

            const startNodeObj = gridData[startNode.r][startNode.c];
            startNodeObj.distance = 0;
            startNodeObj.heuristic = manhattan(startNode, endNode);

            while (openSet.length > 0) {
                openSet.sort((a, b) => (a.distance + a.heuristic) - (b.distance + b.heuristic));
                const current = openSet.shift();

                if (current.visited) continue;
                current.visited = true;
                visitedInOrder.push(current);

                if (current.r === endNode.r && current.c === endNode.c) return visitedInOrder;

                const neighbors = getNeighbors(current);
                for (const neighbor of neighbors) {
                    if (neighbor.isWall || neighbor.visited) continue;

                    const tentativeGScore = current.distance + 1;
                    if (tentativeGScore < neighbor.distance) {
                        neighbor.parent = current;
                        neighbor.distance = tentativeGScore;
                        neighbor.heuristic = manhattan(neighbor, endNode);
                        if (!openSet.includes(neighbor)) openSet.push(neighbor);
                    }
                }
            }
            return visitedInOrder;
        }

        // Helpers
        function getNeighbors(node) {
            const neighbors = [];
            const { r, c } = node;
            if (r > 0) neighbors.push(gridData[r - 1][c]);
            if (r < ROWS - 1) neighbors.push(gridData[r + 1][c]);
            if (c > 0) neighbors.push(gridData[r][c - 1]);
            if (c < COLS - 1) neighbors.push(gridData[r][c + 1]);
            return neighbors;
        }

        function manhattan(p1, p2) {
            return Math.abs(p1.r - p2.r) + Math.abs(p1.c - p2.c);
        }

        function getPath() {
            const path = [];
            let curr = gridData[endNode.r][endNode.c].parent;
            while (curr && !(curr.r === startNode.r && curr.c === startNode.c)) {
                path.unshift(curr);
                curr = curr.parent;
            }
            return path;
        }

        function resetSearchState() {
            statsPanel.classList.add('hidden');
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    gridData[r][c].el.classList.remove('visited', 'path');
                    gridData[r][c].distance = Infinity;
                    gridData[r][c].visited = false;
                    gridData[r][c].parent = null;
                }
            }
        }

        function clearWalls() {
            if (isVisualizing) return;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    gridData[r][c].isWall = false;
                    gridData[r][c].el.classList.remove('wall');
                }
            }
        }

        // Event Listeners Initialization
        startBtn.addEventListener('click', visualize);
        clearWallsBtn.addEventListener('click', clearWalls);
        resetBtn.addEventListener('click', () => {
            if (isVisualizing) return;
            initGrid();
            statsPanel.classList.add('hidden');
        });

        // Start app
        initGrid();

    </script>
</body>
</html>
