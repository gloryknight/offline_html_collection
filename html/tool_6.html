<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphism Generator | Professional UI Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
        }

        .mesh-gradient {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: 
                radial-gradient(at 0% 0%, rgba(76, 29, 149, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(15, 118, 110, 0.4) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(124, 58, 237, 0.4) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(30, 58, 138, 0.4) 0px, transparent 50%);
        }

        .glass-card {
            transition: all 0.2s ease-out;
        }

        input[type="range"] {
            accent-color: #8b5cf6;
        }

        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(139, 92, 246, 0.5);
            border-radius: 10px;
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="mesh-gradient"></div>

    <main class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-8">
        <!-- Header Section -->
        <header class="lg:col-span-12 flex justify-between items-center mb-4">
            <div>
                <h1 class="text-3xl md:text-4xl font-bold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-violet-400 to-emerald-400">
                    Glassmorphism Generator
                </h1>
                <p class="text-slate-400 mt-2">Craft beautiful frosted glass UI elements instantly.</p>
            </div>
            <div class="hidden md:block text-right">
                <span class="px-3 py-1 rounded-full border border-slate-700 text-xs font-medium text-slate-400 uppercase tracking-widest">v1.0.0 Stable</span>
            </div>
        </header>

        <!-- Sidebar: Controls -->
        <aside class="lg:col-span-4 space-y-6 order-2 lg:order-1">
            <div class="bg-slate-900/50 backdrop-blur-xl border border-slate-800 rounded-3xl p-6 shadow-2xl custom-scrollbar max-h-[calc(100vh-200px)] overflow-y-auto">
                <h2 class="text-lg font-semibold mb-6 flex items-center gap-2 text-slate-200">
                    <i data-lucide="sliders-horizontal" class="w-5 h-5"></i> Parameters
                </h2>

                <!-- Color Controls -->
                <div class="space-y-5">
                    <div>
                        <label class="text-sm font-medium text-slate-400 flex justify-between mb-2">
                            Card Background <span>Color</span>
                        </label>
                        <div class="flex items-center gap-4 bg-slate-800/50 p-3 rounded-xl border border-slate-700">
                            <input type="color" id="bgColor" value="#ffffff" class="w-10 h-10 rounded-lg cursor-pointer bg-transparent border-none">
                            <input type="text" id="bgColorHex" value="#ffffff" class="bg-transparent text-sm outline-none w-full font-mono uppercase">
                        </div>
                    </div>

                    <div>
                        <label class="text-sm font-medium text-slate-400 flex justify-between mb-2">
                            Transparency <span id="val-opacity">50%</span>
                        </label>
                        <input type="range" id="opacity" min="0" max="1" step="0.01" value="0.3" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-sm font-medium text-slate-400 flex justify-between mb-2">
                            Blur Intensity <span id="val-blur">15px</span>
                        </label>
                        <input type="range" id="blur" min="0" max="40" step="1" value="15" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-sm font-medium text-slate-400 flex justify-between mb-2">
                            Border Opacity <span id="val-borderOpacity">20%</span>
                        </label>
                        <input type="range" id="borderOpacity" min="0" max="1" step="0.01" value="0.2" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-sm font-medium text-slate-400 flex justify-between mb-2">
                            Border Width <span id="val-borderWidth">1px</span>
                        </label>
                        <input type="range" id="borderWidth" min="0" max="10" step="1" value="1" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-sm font-medium text-slate-400 flex justify-between mb-2">
                            Corner Radius <span id="val-radius">24px</span>
                        </label>
                        <input type="range" id="radius" min="0" max="100" step="1" value="24" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>

                    <div>
                        <label class="text-sm font-medium text-slate-400 flex justify-between mb-2">
                            Shadow Intensity <span id="val-shadow">20px</span>
                        </label>
                        <input type="range" id="shadow" min="0" max="100" step="1" value="25" class="w-full h-2 bg-slate-700 rounded-lg appearance-none cursor-pointer">
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content: Preview & Code -->
        <section class="lg:col-span-8 space-y-6 order-1 lg:order-2">
            <!-- Preview Window -->
            <div id="previewContainer" class="relative w-full h-[400px] rounded-3xl overflow-hidden border border-slate-800 flex items-center justify-center bg-slate-950 shadow-inner group">
                <!-- Decorative elements in background to show off glass -->
                <div class="absolute top-1/4 left-1/4 w-32 h-32 bg-purple-600 rounded-full blur-[80px] opacity-50 animate-pulse"></div>
                <div class="absolute bottom-1/4 right-1/4 w-40 h-40 bg-emerald-600 rounded-full blur-[80px] opacity-50 animate-pulse" style="animation-delay: 2s;"></div>
                
                <!-- The Glass Card -->
                <div id="glassCard" class="glass-card w-72 h-48 flex flex-col items-center justify-center p-6 text-center relative z-10 animate-float">
                    <h3 class="text-xl font-bold text-white mb-2">Glass UI</h3>
                    <p class="text-sm text-white/70 leading-relaxed">Adjust the sliders to see magic happen.</p>
                </div>
            </div>

            <!-- Code Output Section -->
            <div class="bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl">
                <div class="flex items-center justify-between px-6 py-4 bg-slate-800/50 border-b border-slate-700">
                    <div class="flex items-center gap-2">
                        <i data-lucide="code" class="w-4 h-4 text-emerald-400"></i>
                        <span class="text-sm font-medium text-slate-300 uppercase tracking-wider">CSS Output</span>
                    </div>
                    <button id="copyBtn" class="flex items-center gap-2 px-4 py-1.5 bg-violet-600 hover:bg-violet-500 transition-colors rounded-lg text-sm font-medium text-white shadow-lg active:scale-95">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                        <span>Copy Code</span>
                    </button>
                </div>
                <div class="p-6 overflow-x-auto">
                    <pre id="codeDisplay" class="text-emerald-400 font-mono text-sm leading-relaxed"></pre>
                </div>
            </div>
        </section>
    </main>

    <footer class="max-w-7xl mx-auto mt-12 pb-8 text-center text-slate-500 text-sm">
        Built with <span class="text-red-500">❤</span> for modern developers. Open Source & Free.
    </footer>

    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        const inputs = {
            bgColor: document.getElementById('bgColor'),
            bgColorHex: document.getElementById('bgColorHex'),
            opacity: document.getElementById('opacity'),
            blur: document.getElementById('blur'),
            borderOpacity: document.getElementById('borderOpacity'),
            borderWidth: document.getElementById('borderWidth'),
            radius: document.getElementById('radius'),
            shadow: document.getElementById('shadow')
        };

        const displays = {
            opacity: document.getElementById('val-opacity'),
            blur: document.getElementById('val-blur'),
            borderOpacity: document.getElementById('val-borderOpacity'),
            borderWidth: document.getElementById('val-borderWidth'),
            radius: document.getElementById('val-radius'),
            shadow: document.getElementById('val-shadow')
        };

        const glassCard = document.getElementById('glassCard');
        const codeDisplay = document.getElementById('codeDisplay');
        const copyBtn = document.getElementById('copyBtn');

        // Helper: Convert Hex to RGBA
        function hexToRgba(hex, alpha) {
            let r = parseInt(hex.slice(1, 3), 16);
            let g = parseInt(hex.slice(3, 5), 16);
            let b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }

        function update() {
            const hex = inputs.bgColor.value;
            const alpha = parseFloat(inputs.opacity.value);
            const blurVal = inputs.blur.value;
            const bOpacity = parseFloat(inputs.borderOpacity.value);
            const bWidth = inputs.borderWidth.value;
            const radiusVal = inputs.radius.value;
            const shadowVal = inputs.shadow.value;

            // Update Text Labels
            displays.opacity.innerText = `${Math.round(alpha * 100)}%`;
            displays.blur.innerText = `${blurVal}px`;
            displays.borderOpacity.innerText = `${Math.round(bOpacity * 100)}%`;
            displays.borderWidth.innerText = `${bWidth}px`;
            displays.radius.innerText = `${radiusVal}px`;
            displays.shadow.innerText = `${shadowVal}px`;

            // Generate Styles
            const bgColorRgba = hexToRgba(hex, alpha);
            const borderColorRgba = hexToRgba(hex, bOpacity);
            const boxShadow = `0 ${shadowVal / 2}px ${shadowVal}px rgba(0, 0, 0, 0.3)`;
            
            // Apply to Card
            glassCard.style.backgroundColor = bgColorRgba;
            glassCard.style.backdropFilter = `blur(${blurVal}px)`;
            glassCard.style.webkitBackdropFilter = `blur(${blurVal}px)`; // Safari support
            glassCard.style.borderRadius = `${radiusVal}px`;
            glassCard.style.border = `${bWidth}px solid ${borderColorRgba}`;
            glassCard.style.boxShadow = boxShadow;

            // Generate Code String
            const cssCode = `background: ${bgColorRgba};\n` +
                            `backdrop-filter: blur(${blurVal}px);\n` +
                            `-webkit-backdrop-filter: blur(${blurVal}px);\n` +
                            `border-radius: ${radiusVal}px;\n` +
                            `border: ${bWidth}px solid ${borderColorRgba};\n` +
                            `box-shadow: ${boxShadow};`;

            codeDisplay.textContent = cssCode;
        }

        // Event Listeners
        Object.values(inputs).forEach(input => {
            input.addEventListener('input', (e) => {
                if (e.target.id === 'bgColor') {
                    inputs.bgColorHex.value = e.target.value;
                }
                if (e.target.id === 'bgColorHex') {
                    inputs.bgColor.value = e.target.value;
                }
                update();
            });
        });

        // Copy Functionality
        copyBtn.addEventListener('click', () => {
            const text = codeDisplay.textContent;
            navigator.clipboard.writeText(text).then(() => {
                const originalContent = copyBtn.innerHTML;
                copyBtn.innerHTML = `<i data-lucide="check" class="w-4 h-4"></i><span>Copied!</span>`;
                copyBtn.classList.replace('bg-violet-600', 'bg-emerald-600');
                lucide.createIcons();

                setTimeout(() => {
                    copyBtn.innerHTML = originalContent;
                    copyBtn.classList.replace('bg-emerald-600', 'bg-violet-600');
                    lucide.createIcons();
                }, 2000);
            });
        });

        // Initial Run
        update();
    </script>
</body>
</html>
