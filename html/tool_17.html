<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BST Visualizer | Interactive Data Structures</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; overflow: hidden; }
        .node { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }
        .edge { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); stroke-dasharray: 1000; stroke-dashoffset: 1000; animation: draw 1s forwards; }
        @keyframes draw { to { stroke-dashoffset: 0; } }
        .highlight-search { animation: pulse-blue 1s infinite; }
        @keyframes pulse-blue {
            0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(59, 130, 246, 0.7); }
            50% { transform: scale(1.1); box-shadow: 0 0 20px 10px rgba(59, 130, 246, 0); }
        }
        .highlight-found { animation: pulse-green 0.8s ease-out; }
        @keyframes pulse-green {
            0% { transform: scale(1); background-color: #10b981; }
            50% { transform: scale(1.3); background-color: #34d399; }
            100% { transform: scale(1); background-color: #10b981; }
        }
        .highlight-fail { animation: pulse-red 0.5s ease-in; }
        @keyframes pulse-red {
            0% { transform: scale(1); background-color: #ef4444; }
            50% { transform: scale(1.2); background-color: #f87171; }
            100% { transform: scale(1); background-color: #ef4444; }
        }
        #canvas-container { cursor: grab; }
        #canvas-container:active { cursor: grabbing; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="h-screen w-screen flex flex-col">

    <!-- Header -->
    <header class="glass z-20 px-6 py-4 flex justify-between items-center shadow-2xl">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2 rounded-lg">
                <i data-lucide="binary" class="text-white w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">BST <span class="text-indigo-400">Visualizer</span></h1>
                <p class="text-xs text-slate-400 font-medium uppercase tracking-widest">Binary Search Tree Algorithm</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-800/50 px-3 py-1.5 rounded-full border border-slate-700">
                <span class="text-xs text-slate-400 font-medium">Speed</span>
                <input type="range" id="speedRange" min="200" max="1500" step="100" value="800" class="w-24 accent-indigo-500 cursor-pointer">
            </div>
            <button onclick="resetTree()" class="flex items-center gap-2 bg-slate-700 hover:bg-red-900/40 transition-colors px-4 py-2 rounded-lg text-sm font-medium border border-slate-600">
                <i data-lucide="refresh-cw" class="w-4 h-4"></i> Reset
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 relative overflow-hidden flex">
        
        <!-- Sidebar Controls -->
        <aside class="glass w-80 m-4 rounded-2xl p-6 z-10 flex flex-col gap-6 shadow-xl">
            <div>
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 block">Operations</label>
                <div class="space-y-3">
                    <div class="relative">
                        <input type="number" id="nodeValue" placeholder="Enter value..." 
                            class="w-full bg-slate-900/50 border border-slate-700 rounded-xl px-4 py-3 outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition-all text-white">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="handleInsert()" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 py-3 rounded-xl font-semibold transition-all active:scale-95 shadow-lg shadow-indigo-500/20">
                            <i data-lucide="plus" class="w-4 h-4"></i> Insert
                        </button>
                        <button onclick="handleSearch()" class="flex items-center justify-center gap-2 bg-slate-700 hover:bg-slate-600 py-3 rounded-xl font-semibold transition-all active:scale-95 border border-slate-600">
                            <i data-lucide="search" class="w-4 h-4"></i> Search
                        </button>
                    </div>
                    <button onclick="handleDelete()" class="w-full flex items-center justify-center gap-2 bg-slate-800 hover:bg-rose-900/30 text-rose-400 py-3 rounded-xl font-semibold transition-all border border-rose-900/30">
                        <i data-lucide="trash-2" class="w-4 h-4"></i> Delete Node
                    </button>
                </div>
            </div>

            <div class="flex-1 overflow-hidden flex flex-col">
                <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 block">Activity Log</label>
                <div id="log" class="flex-1 bg-slate-950/50 rounded-xl p-4 text-sm font-mono overflow-y-auto border border-slate-800 space-y-2 custom-scrollbar">
                    <div class="text-indigo-400">> System ready...</div>
                </div>
            </div>

            <div class="text-[10px] text-center text-slate-500 font-medium uppercase tracking-widest">
                Built for Algorithms Education
            </div>
        </aside>

        <!-- Visualization Canvas -->
        <section id="canvas-container" class="flex-1 relative overflow-hidden bg-[#0f172a]">
            <svg id="tree-svg" class="w-full h-full pointer-events-none"></svg>
            <div id="nodes-layer" class="absolute inset-0 pointer-events-none"></div>
        </section>

    </main>

    <script>
        // Initialization
        lucide.createIcons();
        const svg = document.getElementById('tree-svg');
        const nodesLayer = document.getElementById('nodes-layer');
        const logElement = document.getElementById('log');
        const speedInput = document.getElementById('speedRange');
        const valInput = document.getElementById('nodeValue');

        let root = null;
        let isAnimating = false;

        class Node {
            constructor(value, x, y) {
                this.value = value;
                this.left = null;
                this.right = null;
                this.x = x;
                this.y = y;
                this.element = null;
            }
        }

        const sleep = () => new Promise(res => setTimeout(res, 2000 - speedInput.value));

        function addLog(msg, type = 'info') {
            const colors = { info: 'text-slate-400', success: 'text-emerald-400', error: 'text-rose-400', highlight: 'text-indigo-400' };
            const div = document.createElement('div');
            div.className = `${colors[type]} animate-in fade-in slide-in-from-left-2 duration-300`;
            div.innerHTML = `<span class="opacity-50 mr-2">></span> ${msg}`;
            logElement.prepend(div);
        }

        class BST {
            async insert(val) {
                if (!root) {
                    root = new Node(val, window.innerWidth / 2 - 160, 80);
                    addLog(`Root created with ${val}`, 'success');
                    render();
                    return;
                }

                let curr = root;
                while (curr) {
                    highlightNode(curr, 'highlight-search');
                    await sleep();
                    
                    if (val === curr.value) {
                        addLog(`Value ${val} already exists`, 'error');
                        unhighlightNode(curr);
                        return;
                    }

                    if (val < curr.value) {
                        if (!curr.left) {
                            curr.left = new Node(val, curr.x - (curr.y * 0.4 + 100), curr.y + 80); // Simplified spacing logic
                            addLog(`Inserted ${val} to the left of ${curr.value}`, 'success');
                            unhighlightNode(curr);
                            render();
                            return;
                        }
                        curr = curr.left;
                    } else {
                        if (!curr.right) {
                            curr.right = new Node(val, curr.x + (curr.y * 0.4 + 100), curr.y + 80);
                            addLog(`Inserted ${val} to the right of ${curr.value}`, 'success');
                            unhighlightNode(curr);
                            render();
                            return;
                        }
                        curr = curr.right;
                    }
                }
            }

            async search(val) {
                let curr = root;
                while (curr) {
                    highlightNode(curr, 'highlight-search');
                    addLog(`Comparing ${val} with ${curr.value}...`, 'highlight');
                    await sleep();

                    if (val === curr.value) {
                        highlightNode(curr, 'highlight-found');
                        addLog(`Found node ${val}!`, 'success');
                        return true;
                    }

                    unhighlightNode(curr);
                    if (val < curr.value) {
                        addLog(`${val} is smaller than ${curr.value}, going left`);
                        curr = curr.left;
                    } else {
                        addLog(`${val} is larger than ${curr.value}, going right`);
                        curr = curr.right;
                    }
                }
                addLog(`Value ${val} not found in tree`, 'error');
                return false;
            }

            async delete(val) {
                addLog(`Attempting to delete ${val}...`, 'info');
                root = await this._deleteNode(root, val);
                render();
            }

            async _deleteNode(node, val) {
                if (!node) return null;

                highlightNode(node, 'highlight-search');
                await sleep();

                if (val < node.value) {
                    node.left = await this._deleteNode(node.left, val);
                } else if (val > node.value) {
                    node.right = await this._deleteNode(node.right, val);
                } else {
                    // Found it
                    unhighlightNode(node);
                    addLog(`Found ${val}, removing...`, 'success');

                    if (!node.left && !node.right) return null;
                    if (!node.left) return node.right;
                    if (!node.right) return node.left;

                    // Two children: find successor
                    let minNode = this._findMin(node.right);
                    node.value = minNode.value;
                    node.right = await this._deleteNode(node.right, minNode.value);
                }
                unhighlightNode(node);
                return node;
            }

            _findMin(node) {
                while (node.left) node = node.left;
                return node;
            }
        }

        const tree = new BST();

        function highlightNode(node, className) {
            if (!node.element) return;
            node.element.classList.add(className);
        }

        function unhighlightNode(node) {
            if (!node.element) return;
            node.element.classList.remove('highlight-search', 'highlight-found', 'highlight-fail');
        }

        // Dynamic Coordinate Calculation for beautiful tree layout
        function calculatePositions(node, minX, maxX, depth) {
            if (!node) return;
            const midX = (minX + maxX) / 2;
            const midY = depth * 100 + 80;
            node.x = midX;
            node.y = midY;

            calculatePositions(node.left, minX, midX, depth + 1);
            calculatePositions(node.right, midX, maxX, depth + 1);
        }

        function render() {
            nodesLayer.innerHTML = '';
            svg.innerHTML = '';
            if (!root) return;

            const containerWidth = document.getElementById('canvas-container').clientWidth;
            calculatePositions(root, 50, containerWidth - 50, 1);
            drawEdges(root);
            drawNodes(root);
        }

        function drawEdges(node) {
            if (!node) return;
            if (node.left) {
                drawLine(node.x, node.y, node.left.x, node.left.y);
                drawEdges(node.left);
            }
            if (node.right) {
                drawLine(node.x, node.y, node.right.x, node.right.y);
                drawEdges(node.right);
            }
        }

        function drawLine(x1, y1, x2, y2) {
            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            line.setAttribute('x1', x1);
            line.setAttribute('y1', y1);
            line.setAttribute('x2', x2);
            line.setAttribute('y2', y2);
            line.setAttribute('stroke', '#334155');
            line.setAttribute('stroke-width', '2');
            line.classList.add('edge');
            svg.appendChild(line);
        }

        function drawNodes(node) {
            if (!node) return;

            const div = document.createElement('div');
            div.className = 'node absolute w-12 h-12 flex items-center justify-center rounded-full glass text-sm font-bold border-2 border-indigo-500/50 shadow-lg select-none';
            div.style.left = `${node.x - 24}px`;
            div.style.top = `${node.y - 24}px`;
            div.innerText = node.value;
            
            nodesLayer.appendChild(div);
            node.element = div;

            drawNodes(node.left);
            drawNodes(node.right);
        }

        async function handleInsert() {
            if (isAnimating) return;
            const val = parseInt(valInput.value);
            if (isNaN(val)) return;
            isAnimating = true;
            await tree.insert(val);
            isAnimating = false;
            valInput.value = '';
        }

        async function handleSearch() {
            if (isAnimating) return;
            const val = parseInt(valInput.value);
            if (isNaN(val)) return;
            isAnimating = true;
            const found = await tree.search(val);
            if (!found) {
                // Flash red on whole canvas for failure? No, just log it.
            }
            isAnimating = false;
        }

        async function handleDelete() {
            if (isAnimating) return;
            const val = parseInt(valInput.value);
            if (isNaN(val)) return;
            isAnimating = true;
            await tree.delete(val);
            isAnimating = false;
            valInput.value = '';
        }

        function resetTree() {
            root = null;
            nodesLayer.innerHTML = '';
            svg.innerHTML = '';
            logElement.innerHTML = '<div class="text-indigo-400">> Tree cleared...</div>';
            render();
        }

        // Handle Window Resize
        window.addEventListener('resize', render);

        // Initial Render (Empty)
    </script>
</body>
</html>
