<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fourier Series Visualizer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --accent-color: #38bdf8;
            --text-color: #f1f5f9;
            --secondary-text: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            /* Prevent scrollbars during animation */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Header Styling */
        header {
            padding: 1.5rem 2rem;
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 10;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.subtitle {
            color: var(--secondary-text);
            font-size: 0.875rem;
        }

        /* Main Layout */
        main {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        /* Controls Panel */
        .controls {
            position: absolute;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            padding: 1.25rem 2rem;
            border-radius: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            gap: 2rem;
            align-items: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--secondary-text);
        }

        select,
        input[type="range"] {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 0.4rem 0.8rem;
            border-radius: 0.4rem;
            outline: none;
            cursor: pointer;
        }

        select:hover {
            border-color: var(--accent-color);
        }

        /* Tooltip/Info */
        .info-box {
            position: absolute;
            top: 2rem;
            right: 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 1rem;
            border-radius: 0.75rem;
            font-size: 0.8rem;
            max-width: 250px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .controls {
                flex-direction: column;
                bottom: 1rem;
                width: 90%;
                gap: 1rem;
            }

            .info-box {
                display: none;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>Fourier Series Visualizer</h1>
            <p class="subtitle">Decomposing complex waves into rotating circles (Epicycles)</p>
        </div>
    </header>

    <main id="canvas-container">
        <canvas id="fourierCanvas"></canvas>

        <div class="info-box">
            <strong>How it works:</strong><br>
            Each circle represents a sine wave component. Summing their vectors creates the complex path shown in blue.
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="shapeSelect">Waveform</label>
                <select id="shapeSelect">
                    <option value="square">Square Wave</option>
                    <option value="sawtooth">Sawtooth Wave</option>
                    <option value="triangle">Triangle Wave</option>
                    <option value="custom">Custom (Sine)</option>
                </select>
            </div>

            <div class="control-group">
                <label for="complexityRange">Complexity (Harmonics)</label>
                <input type="range" id="complexityRange" min="1" max="50" value="20">
            </div>

            <div class="control-group">
                <label for="speedRange">Animation Speed</label>
                <input type="range" id="speedRange" min="1" max="10" value="3">
            </div>
        </div>
    </main>

    <script>
        /** @type {HTMLCanvasElement} */
        const canvas = document.getElementById('fourierCanvas');
        const ctx = canvas.getContext('2d');
        const shapeSelect = document.getElementById('shapeSelect');
        const complexityRange = document.getElementById('complexityRange');
        const speedRange = document.getElementById('speedRange');

        let time = 0;
        let path = []; // Stores the points of the drawn wave

        class Epicycle {
            constructor(radius, time) {
                this.radius = radius;
                this.time = time;
                this.angle = 0;
            }

            draw(x, y) {
                this.angle += 0.01 * (speedRange.value / 3); // Speed controlled by slider

                // Calculate new position based on rotation
                const nextX = x + Math.cos(this.angle) * this.radius;
                const nextY = y + Math.sin(this.angle) * this.radius;

                // Draw the circle line (the orbit)
                ctx.beginPath();
                ctx.arc(x, y, Math.abs(this.radius), 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.stroke();

                // Draw the vector line (the radius)
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(nextX, nextY);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.lineWidth = 1;
                ctx.stroke();

                return { x: nextX, y: nextY };
            }
        }

        let epicycles = [];

        function init() {
            resize();
            animate();
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);

        function getFourierCoefficients(type, n) {
            // Returns [radius, frequency] for the nth harmonic
            const harmonics = [];
            const count = parseInt(n);

            for (let i = 1; i <= count; i++) {
                let radius = 0;
                let freq = i;

                if (type === 'square') {
                    // Square wave: amplitude is 1/n for odd n, else 0
                    if (i % 2 !== 0) {
                        radius = 1 / i;
                    }
                } else if (type === 'sawtooth') {
                    // Sawtooth wave: amplitude is 1/n
                    radius = 1 / i;
                } else if (type === 'triangle') {
                    // Triangle wave: amplitude is 1/n^2 for odd n, else 0
                    if (i % 2 !== 0) {
                        radius = 1 / (i * i);
                    }
                } else {
                    // Custom simple sine
                    radius = 1 / i;
                }

                if (radius > 0) {
                    harmonics.push({ radius: radius * 150, freq: freq }); // Scale for visibility
                }
            }
            return harmonics;
        }

        function animate() {
            // Clear canvas with a slight trail effect
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const type = shapeSelect.value;
            const harmonics = getFourierCoefficients(type, complexityRange.value);

            // Center of the screen for epicycles
            let x = canvas.width / 2;
            let y = canvas.height / 2;

            // Create/Update Epicycles
            epicycles = [];
            harmonics.forEach(h => {
                // We adjust angle based on frequency and time
                const e = new Epicycle(h.radius, h.freq);
                // Manual angle manipulation to simulate the summation
                e.angle = time * h.freq;
                epicycles.push(e);
            });

            // Draw all epicycles
            let currentPos = { x, y };
            epicycles.forEach(epicycle => {
                currentPos = epicycle.draw(currentPos.x, currentPos.y);
            });

            // Store the tip position for the trace
            path.unshift(currentPos);

            // Draw the resulting wave path
            ctx.beginPath();
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 3;
            ctx.lineJoin = 'round';

            for (let i = 0; i < path.length; i++) {
                // We draw the wave moving from right to left across the screen
                // To make it look like a standard graph, we offset x
                const drawX = path[i].x + (path.length - i) * 2;
                // But actually, let's just draw the trace as it moves:
                ctx.lineTo(path[i].x, path[i].y);
            }
            ctx.stroke();

            // Limit path length to prevent memory leak/slowdown
            if (path.length > 500) {
                path.pop();
            }

            // Increment time for rotation
            time += 0.02 * (speedRange.value / 3);

            requestAnimationFrame(animate);
        }

        init();
    </script>
</body>

</html>
